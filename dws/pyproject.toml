[project]
name = "dws"
version = "0.1.0"
description = "Reusable local web evidence acquisition and retrieval service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.142.2",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "markdown-it-py>=4.2.0",
    "markdownify>=1.2.3",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
dws = "dws.cli:main"

[project.optional-dependencies]
mcp = [
    "fastmcp>=4.0.10",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
build-constraint-dependencies = [
    "hatchling==1.27.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "trove-classifiers==2026.9.21.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dws"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
addopts = ["--strict-markers"]
markers = [
    "qmd: real QMD lexical qualification requiring qmd and bwrap",
]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
