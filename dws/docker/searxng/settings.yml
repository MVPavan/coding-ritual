# Private DWS discovery; requires a deployment-specific SEARXNG_SECRET.
use_default_settings:
  engines:
    keep_only: [duckduckgo, wikipedia, brave, google, yandex, yep, yahoo, xprivo]
# Measured 2026-10-04 from the owner network on 2026.10.4: brave (429) and google
# (403) are blocked; duckduckgo is intermittent. yandex, yep, yahoo and xprivo
# answered technical and equity queries relevantly. Revisit when availability changes.
engines:
  - name: google
    disabled: false
  - name: yandex
    disabled: false
  - name: yep
    disabled: false
  - name: yahoo
    disabled: false
  - name: xprivo
    disabled: false
    inactive: false
# Optional owner choice: add bing to keep_only and an engines entry with
# name: bing, disabled: false. It is excluded by default after observed
# unrelated results for a technical documentation query.
# This mapping replaces upstream plugins. Retain pinned defaults except
# tracker_url_remover: even active:false initializes its mutable rule downloads.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false
general:
  instance_name: DWS discovery
search:
  formats: [html, json]
  # DuckDuckGo CAPTCHAs every all-languages (wt-wt) request: searxng/searxng#6779.
  default_lang: "en-US"
  autocomplete: ""
server:
  limiter: false
  public_instance: false
  image_proxy: false
valkey:
  url: false
outgoing:
  request_timeout: 3.0
  max_request_timeout: 5.0
