# bounded_cycle_cycles_include_entry_node: "draft" <-> "revise" cycle inside the bounded
# region never re-enters entry_node "work", so max_entries counts nothing (§10.1).
[graph]
id = "min"
version = "1.0.0"
entry = "work"
description = "minimal graph"

[instance]
max_total_activations = 5

[[region]]
name = "loop"
mode = "bounded-cycle"
entry_node = "work"
max_entries = 2
on_exhausted = "triage"

[[node]]
name = "work"
kind = "task"
region = "loop"
runner = "profile:x"
writes = false
allowed_paths = []
verify = [{ cmd = "scripts/verify.sh", timeout = "5m" }]
token_budget = 1000
max_wall = "10m"
stale_after = "5m"
max_infra_retries = 1
max_steers = 1
outcomes = ["done"]

[[node]]
name = "draft"
kind = "task"
region = "loop"
runner = "profile:x"
writes = false
allowed_paths = []
verify = [{ cmd = "scripts/verify.sh", timeout = "5m" }]
token_budget = 1000
max_wall = "10m"
stale_after = "5m"
max_infra_retries = 1
max_steers = 1
outcomes = ["done"]

[[node]]
name = "revise"
kind = "task"
region = "loop"
runner = "profile:x"
writes = false
allowed_paths = []
verify = [{ cmd = "scripts/verify.sh", timeout = "5m" }]
token_budget = 1000
max_wall = "10m"
stale_after = "5m"
max_infra_retries = 1
max_steers = 1
outcomes = ["fail_plan"]

[[node]]
name = "triage"
kind = "gate"
gate_type = "human"
binds = "immutable"
outcomes = ["rebudget", "abandon"]

[[node]]
name = "finished"
kind = "terminal"

[[edge]]
from = "work"
on = "done"
to = "draft"

[[edge]]
from = "draft"
on = "done"
to = "revise"

[[edge]]
from = "revise"
on = "fail_plan"
to = "draft"

[[edge]]
from = "triage"
on = "rebudget"
to = "work"

[[edge]]
from = "triage"
on = "abandon"
to = "finished"

[fallback]
to = "triage"
