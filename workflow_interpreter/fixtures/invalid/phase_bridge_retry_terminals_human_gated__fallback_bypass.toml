# phase_bridge_retry_terminals_human_gated: a task fallback can reach a retry terminal
# without crossing the human gate on its declared success route.
[graph]
id = "fallback-bypass"
version = "1.0.0"
entry = "work"
description = "fallback bypasses approval"

[instance]
max_total_activations = 5
phase_bridge_retry_terminals = ["finished"]

[[node]]
name = "work"
kind = "task"
runner = "profile:x"
writes = false
allowed_paths = []
verify = [{ cmd = "scripts/verify.sh", timeout = "5m" }]
token_budget = 1000
max_wall = "10m"
stale_after = "5m"
max_infra_retries = 1
max_steers = 1
outcomes = ["done"]
fallback = { to = "finished" }

[[node]]
name = "approval"
kind = "gate"
gate_type = "human"
binds = "immutable"
outcomes = ["approve", "abandon"]

[[node]]
name = "finished"
kind = "terminal"

[[edge]]
from = "work"
on = "done"
to = "approval"

[[edge]]
from = "approval"
on = "approve"
to = "finished"

[[edge]]
from = "approval"
on = "abandon"
to = "finished"

[fallback]
to = "approval"
