[graph]
id          = "feature-delivery"
version     = "1.1.0"
entry       = "implement"
description = "One feature: implemented → reviewed → shipped"

[instance]
max_total_activations  = 26      # counts every activation AND gate bead
test_force_first_reject = false  # schema'd; validator refuses true without --allow-test-flags
phase_bridge_retry_terminals = ["shipped", "abandoned"]

[[region]]
name         = "build-review"
mode         = "bounded-cycle"           # "acyclic" | "bounded-cycle"
entry_node   = "implement"
max_entries  = 3
on_exhausted = "triage"

[[node]]
name          = "implement"
kind          = "task"                   # task | gate | terminal
region        = "build-review"
runner        = "profile:implementer"
model         = "default"
instructions = """
Implement the feature described in `task_brief`. On a later round,
`review_findings` lists what the reviewer rejected — address every BLOCKER
and MAJOR before claiming done.

Write only production and test code. Do not edit the review's findings, and
do not weaken or delete a test to make a check pass.

Report `done` when source work is complete, committed, and supported local checks pass;
`no_diff` when the feature already exists and needs no change; `fail_plan`
when `task_brief` cannot be implemented as written and needs a human.

Your verdict is a claim; full declared HOST verification remains mandatory and
gates advancement after you return. Perform available supported local checks;
do not run host-only checks (including nested sandbox probes) inside the model
sandbox. Record each command and result, or a not-run reason, in $WF_ARTIFACT_DIR.
Unavailable sandbox/network/tooling is not evidence of a source defect and must
not alone cause `fail_code` or `reject`. Do not retry dependency installs for an
unavailable environment. Real code/test failures must be reported and never
relabeled as environment problems. Review decisions are source/spec judgments;
local evidence does not waive the host gate.

Inspect the provided environment paths first. Use $WF_SCRATCH_DIR (the supplied
$TMPDIR) for temporary repositories and caches; $WF_ARTIFACT_DIR is only for
output evidence/findings, not scratch work.
"""
isolation     = "worktree"               # worktree | in-repo
execution_profile = "writer"            # repo-worktree write access only
allowed_paths = ["src/**", "tests/**"]   # the writable mounts under bwrap
inputs        = ["verify_failure", "task_brief", "review_findings"]
verify        = [{ cmd = "scripts/verify-feature.sh", timeout = "10m" }]
token_budget  = 120000                   # context TRIM budget (not a runaway bound)
max_wall      = "45m"                    # universal runaway ceiling (wrapper-enforced)
stale_after   = "10m"
max_infra_retries = 2
max_steers    = 2
outcomes      = ["done", "no_diff", "fail_plan", "fail_code"]

[[node]]
name          = "debrief"
kind          = "task"                   # one per implement round; the round cap
region        = "build-review"           # is the edge set — nothing re-enters it
runner        = "profile:scribe"
model         = "default"
instructions = """
Write the knowledge this round produced, and nothing else.

`ledger_render` carries two files the engine rendered from the run ledger:
`findings.md` and `evidence.json`. Write BOTH of them into
`docs/workstreams/<WF_EPIC_SEGMENT>/runs/<WF_TASK_ID>/a<WF_ATTEMPT>/`, byte for
byte as given, and write your own `debrief.md` beside them: what was attempted,
what happened, why it was done this way, and what the next round or the next
reader should know. Keep `debrief.md` under 16 KB.

Write nothing outside that one directory. Your verifier recomputes the
directory from the run's own identity and fails the round if the commit under
test touches anything else, if any of the three files is missing, or if either
rendered file differs from the render you were given. It is not a style check
and it cannot be argued with.

Report `done` when the three files are written and committed; `no_diff` when
the directory already holds exactly these files and needs no change;
`fail_code` when your own checks show the commit is wrong; `fail_plan` when the
round cannot be described from what you were given and a human must look.

Your verdict is a claim; full declared HOST verification remains mandatory and
gates advancement after you return. Perform available supported local checks;
do not run host-only checks (including nested sandbox probes) inside the model
sandbox. Record each command and result, or a not-run reason, in $WF_ARTIFACT_DIR.
Unavailable sandbox/network/tooling is not evidence of a source defect and must
not alone cause `fail_code` or `reject`. Do not retry dependency installs for an
unavailable environment. Real code/test failures must be reported and never
relabeled as environment problems. Review decisions are source/spec judgments;
local evidence does not waive the host gate.

Inspect the provided environment paths first. Use $WF_SCRATCH_DIR (the supplied
$TMPDIR) for temporary repositories and caches; $WF_ARTIFACT_DIR is only for
output evidence/findings, not scratch work.
"""
isolation     = "worktree"
execution_profile = "writer"
allowed_paths = ["docs/workstreams/**"]  # static and regex-valid; containment
                                         # to one attempt directory is the
                                         # verifier's job (ADR 0001)
inputs        = ["ledger_render", "task_brief"]
verify        = [{ cmd = "scripts/verify-debrief.sh", timeout = "5m" }]
token_budget  = 40000
max_wall      = "15m"
stale_after   = "10m"
max_infra_retries = 2
max_steers    = 0
outcomes      = ["done", "no_diff", "fail_code", "fail_plan"]

[[node]]
name          = "review"
kind          = "task"
region        = "build-review"
runner        = "profile:critic"
model         = "default"
instructions = """
Review `diff_artifact` against `task_brief`. Findings go to ONE file,
$WF_ARTIFACT_DIR/review.md, as numbered BLOCKER / MAJOR / MINOR entries, each
with a `file:line` and a concrete failure scenario. That file is the only one
read as your verdict; command evidence goes beside it under other names. When
you have no findings, write `NO FINDINGS` as the whole of review.md.

You have no repo write access. Do not fix what you find and do not propose
patches — the implementer acts on your findings next round.

Report `reject` if any BLOCKER or MAJOR stands, otherwise `accept`.
Report `fail_plan` when the same BLOCKER stands for a second round or the
task as briefed cannot be satisfied; do not spend a round restating it.

Evidence discipline: Label observed/source-proven facts, producer-reported evidence,
and inference. Source-proven defects reject without execution; hypotheses are
questions, not MAJOR. Neither tool absence, remembered defaults nor file counts
prove output impossible or a producer report false. Disputes: cite exact evidence, candidate/tool version/environment
and failure scenario; lacking direct proof, request the smallest non-mutating host command,
never auto-run requests. Report required-evidence gaps; never invent success or waive evidence.
Unresolved material gaps: `fail_plan` for review/evidence blockage, not an invented defect.
Coordinator examines requests at existing attention/approval boundaries;
this report convention adds no automatic probe.

Your verdict is a claim; full declared HOST verification remains mandatory and
gates advancement after you return. Perform available supported local checks;
do not run host-only checks (including nested sandbox probes) inside the model
sandbox. Record each command and result, or a not-run reason, in $WF_ARTIFACT_DIR.
Unavailable sandbox/network/tooling is not evidence of a source defect and must
not alone cause `fail_code` or `reject`. Do not retry dependency installs for an
unavailable environment. Real code/test failures must be reported and never
relabeled as environment problems. Review decisions are source/spec judgments;
local evidence does not waive the host gate.

Inspect the provided environment paths first. Use $WF_SCRATCH_DIR (the supplied
$TMPDIR) for temporary repositories and caches; $WF_ARTIFACT_DIR is only for
output evidence/findings, not scratch work.
"""
isolation     = "worktree"
execution_profile = "reviewer"          # findings go to $WF_ARTIFACT_DIR, not the repo
allowed_paths = []
inputs        = ["task_brief", "diff_artifact", "review_findings"]
verify        = [{ cmd = "scripts/verify-feature.sh", timeout = "10m" },
                 { cmd = "scripts/review-checks.sh",  timeout = "5m"  },
                 { cmd = "scripts/verify-debrief.sh", timeout = "5m"  }]
                # deliberately a STRICT SUPERSET of implement's set; the
                # validator warns when a judgment node's verify ⊆ its
                # predecessor's (anti-drift cross-check would be vacuous)
token_budget  = 80000
max_wall      = "30m"
stale_after   = "10m"
max_infra_retries = 2
max_steers    = 2
outcomes      = ["accept", "reject", "fail_code", "fail_plan"]

[[node]]
name      = "ship"
kind      = "gate"
gate_type = "human"
binds     = "immutable"
outcomes  = ["approve", "abandon"]

[[node]]
name      = "triage"
kind      = "gate"
gate_type = "human"
binds     = "immutable"
outcomes  = ["rebudget", "abandon"]

[[node]]
name = "shipped"
kind = "terminal"

[[node]]
name = "abandoned"
kind = "terminal"

[[edge]]
from = "implement"
on   = "done"
to   = "debrief"         # the knowledge is written BEFORE the review, so the
                         # reviewer grades it and the ship gate binds an
                         # artifact that already contains it (run-ledger §3.7)

[[edge]]
from = "implement"
on   = "fail_plan"
to   = "triage"

[[edge]]
from = "implement"
on   = "no_diff"
to   = "triage"

[[edge]]
from = "implement"
on   = "fail_code"
to   = "implement"       # a red check is a rework, not a human halt; the
                         # region entry re-enters, so rounds still cap it

[[edge]]
from = "debrief"
on   = "done"
to   = "review"

[[edge]]
from = "debrief"
on   = "no_diff"
to   = "review"          # nothing to say is not a failure; the reviewer still
                         # grades the debrief's verifier on the same commit

[[edge]]
from = "debrief"
on   = "fail_code"
to   = "triage"          # a debrief that wrote outside its directory, or whose
                         # rendered files do not match, is a human's problem —
                         # it must never reach `ship`

[[edge]]
from = "debrief"
on   = "fail_plan"
to   = "triage"

[[edge]]
from = "review"
on   = "reject"
to   = "implement"

[[edge]]
from = "review"
on   = "accept"
to   = "ship"

[[edge]]
from = "review"
on   = "fail_code"
to   = "implement"       # the reviewer's checks went red on the diff under
                         # review; the implementer is what can fix that

[[edge]]
from = "review"
on   = "fail_plan"
to   = "triage"          # early abandon: the loop must be able to end in
                         # both directions, not only by running out of rounds

[[edge]]
from = "ship"
on   = "approve"
to   = "shipped"

[[edge]]
from = "ship"
on   = "abandon"
to   = "abandoned"

[[edge]]
from = "triage"
on   = "rebudget"
to   = "implement"

[[edge]]
from = "triage"
on   = "abandon"
to   = "abandoned"

[fallback]
to = "triage"          # per-node [node.fallback] may override

[[source]]
name          = "task_brief"
producer      = "instance"
optional      = false
trim_priority = 1

[[source]]
name          = "diff_artifact"
producer      = "node:implement"
optional      = false
trim_priority = 1

[[source]]
name          = "review_findings"
producer      = "node:review"
optional      = true                     # absent on round 1 by construction
trim_priority = 2

# The ledger's own account of every round so far, rendered by the engine and
# pinned as a commit before the consuming activation is minted (run-ledger
# §3.7). Optional like every engine producer: a run with no pinned identity
# has nothing to render, and its debrief then fails its verifier loudly.
[[source]]
name = "ledger_render"
producer = "engine:ledger_render"
optional = true
trim_priority = 1

# Host-observed diagnostic data, bound only to the causal failed check.
[[source]]
name = "verify_failure"
producer = "engine:verify_failure"
optional = true
trim_priority = 10
