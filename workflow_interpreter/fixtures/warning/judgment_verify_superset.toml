# judgment_verify_superset: "review" declares accept but runs a subset of the checks its
# predecessor already ran, so the §7.3 anti-drift cross-check would be vacuous.
# This graph LOADS; the finding is a warning, not an error.
[graph]
id = "min"
version = "1.0.0"
entry = "work"
description = "minimal graph"

[instance]
max_total_activations = 5

[[node]]
name = "work"
kind = "task"
runner = "profile:x"
writes = false
allowed_paths = []
verify = [{ cmd = "scripts/verify.sh", timeout = "5m" },
          { cmd = "scripts/lint.sh", timeout = "5m" }]
token_budget = 1000
max_wall = "10m"
stale_after = "5m"
max_infra_retries = 1
max_steers = 1
outcomes = ["done"]

[[node]]
name = "review"
kind = "task"
runner = "profile:critic"
writes = false
allowed_paths = []
verify = [{ cmd = "scripts/verify.sh", timeout = "5m" }]
token_budget = 1000
max_wall = "10m"
stale_after = "5m"
max_infra_retries = 1
max_steers = 1
outcomes = ["accept"]

[[node]]
name = "approval"
kind = "gate"
gate_type = "human"
binds = "immutable"
outcomes = ["approve", "abandon"]

[[node]]
name = "finished"
kind = "terminal"

[[edge]]
from = "work"
on = "done"
to = "review"

[[edge]]
from = "review"
on = "accept"
to = "approval"

[[edge]]
from = "approval"
on = "approve"
to = "finished"

[[edge]]
from = "approval"
on = "abandon"
to = "finished"

[fallback]
to = "approval"
