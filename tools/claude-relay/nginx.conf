# Plain reverse relay: forwards Claude Code's model traffic to api.anthropic.com
# unchanged. It adds no headers, holds no credentials, and rewrites nothing
# except the Host header the upstream requires.
events {}

http {
  # Docker's embedded DNS; nginx resolves the upstream name at runtime.
  resolver 127.0.0.11 ipv6=off valid=300s;

  # Log whether a bearer token was present, never its value.
  map $http_authorization $auth_present { default "no"; "~^Bearer " "yes"; }
  log_format relay '$time_local $remote_addr "$request" status=$status auth=$auth_present ua="$http_user_agent"';
  access_log /dev/stdout relay;
  error_log  /dev/stderr warn;

  # Claude Code sends multi-megabyte request bodies; nginx's 1m default would
  # answer 413. Streaming responses must not be buffered.
  client_max_body_size 0;
  proxy_buffering off;
  proxy_request_buffering off;

  server {
    listen 80;

    location / {
      proxy_pass https://api.anthropic.com;
      proxy_set_header Host api.anthropic.com;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      proxy_ssl_server_name on;
      proxy_ssl_name api.anthropic.com;
      proxy_connect_timeout 30s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
    }
  }
}
