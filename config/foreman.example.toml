# Foreman configuration — EXAMPLE, not a live config.
#
# `repo_root` and `wrapper_home` must be ABSOLUTE (`foreman/config.py`
# `_shares_one_repository_identity`), and `inspector.wrapper_root` must equal
# the hash-derived `wrapper_home/<sha256(repo_root)[:16]>` — so a working config
# is machine-specific, which CLAUDE.md forbids checking in. Render this file
# for the current checkout instead:
#
#   scripts/make-foreman-config.sh [output-path]   # default scratchpad/foreman.toml
#
# Every @PLACEHOLDER@ below is substituted by that script.

repo_root    = "@REPO_ROOT@"
wrapper_home = "@WRAPPER_HOME@"
host         = "@HOST@"
actor        = "@ACTOR@"

# The validated graph `contract` pins for a selected stage. It is a normal
# configurable graph path, not a contractor implementation default.
contractor_graph = "@REPO_ROOT@/workflows/feature-delivery.toml"
# For a specification stage, select workflows/design-spec.toml instead.
# Basic work uses workflows/basic.toml through children admit; it returns an
# artifact without contractor landing. Integration uses workflows/integration.toml
# through explicit integration prepare and the same contract command.
# These templates reuse the implementer/critic role bindings below.
# Named writer/reviewer policies require bwrap. Receipts/status record tool_network:
# codex = denied; claude = not_enforced (both Claude policies may launch).

# Contractor admission requires an explicit complete nonempty check policy. Uncomment
# and adapt the example only after provisioning uv under the PATH below and its
# pinned Python under UV_PYTHON_INSTALL_DIR. This example calls the repository's
# feature verifier; it is not a claim to run all seven parent milestone gates.
# argv[0] is a tracked repository executable or an explicit absolute host tool,
# never a bare command resolved through PATH. See docs/usage/contractor.md for
# the fixed environment, detached checkout, policy pinning and retry contract.
# BEGIN CONTRACTOR CHECK EXAMPLE
# [[contractor_checks]]
# name = "repository-feature-verifier"
# argv = ["scripts/verify-feature.sh"]
# timeout_s = 1800
# environment = [["PATH", "@WRAPPER_HOME@/tools/bin:/usr/bin:/bin"], ["UV_PYTHON_INSTALL_DIR", "@WRAPPER_HOME@/python"]]
# END CONTRACTOR CHECK EXAMPLE

# The driver always records heartbeat/refusals; monitoring is a separate command.
# Start `foreman monitor <root>` independently; only --monitored requires it.
[wake]
poll_s = 5
stale_s = 120
min_fire_interval_s = 30
lifetime_cap = 100
# Optional trusted host executable + literal arguments, never a shell command.
# hook_argv = ["@WRAPPER_HOME@/bin/enqueue-coordinator-turn"]
hook_timeout_s = 10
hook_backoff_s = 5

# The bd workspace is the repository itself: `bd init` puts `.beads/` there and
# every invocation is scoped with `-C <workspace>` (`bdio/client.py`).
[bd]
workspace = "@REPO_ROOT@"
actor     = "@ACTOR@"

# §9 gate approval. `close_gate_verified` raises `BdConfigError` when no
# verifier is configured (`bdio/api.py`), so a signed `ship` gate needs this
# section AND the key pair it names. Generate them once, outside the repo:
#
#   ssh-keygen -t ed25519 -N "" -C <principal> -f @SIGNERS_DIR@/gate_key
#   printf '%s %s\n' <principal> "$(cat @SIGNERS_DIR@/gate_key.pub)" \
#       > @SIGNERS_DIR@/allowed_signers
#
# The allow-list must live OUTSIDE the bd workspace — a foreman that can write
# its own allow-list can forge approvals, and `GateVerifier` refuses a path
# inside the workspace at construction (`bdio/config.py`). It also lives outside
# the wrapper home (run-ledger D15): $XDG_CONFIG_HOME/wf/signers, falling back
# to ~/.config/wf/signers, so wiping the wrapper home cannot destroy the key.
[signing]
allowed_signers_path = "@SIGNERS_DIR@/allowed_signers"

[inspector]
repo_root    = "@REPO_ROOT@"
wrapper_root = "@WRAPPER_ROOT@"
host         = "@HOST@"

[inspector.toolchain]
# Explicit standalone uv projects; default root is used only when uv.lock exists.
projects = ["."]
# Optional absolute host paths. Omitted cache/python paths use uv discovery;
# the default seed root is <wrapper_root>/toolchain-seeds.
# seed_root = "@WRAPPER_ROOT@/toolchain-seeds"
# Set host_cache/python_root to absolute host paths to override discovery.
allow_host_fetch = true
# Bounds apply to each preparation command/copy and lock wait.
timeout_s = 120.0
max_bytes = 2147483648
max_entries = 100000
reserve_bytes = 67108864

# Role bindings (§3.1 provenance source `role-binding`). The keys are the graph's
# own `crew = "profile:<role>"` names — `feature-delivery.toml` declares
# `implementer` and `critic` — and instantiation refuses a graph whose roles are
# not all bound here ("unknown crew roles").
#
# The writer is claude and the reviewer is codex here, and that is a default
# rather than a constraint. It used to be a constraint: the codex sandbox makes
# `<root>/.git` read-only inside every writable root, and a §5.4 worktree keeps
# its index OUTSIDE the working root, so a codex writer edited source happily and
# then died `Unable to create '<G>/index.lock': Read-only file system` on its
# first `git add`. A codex writer now grants the git directories a commit touches
# and nothing else — its own `<G>`, the shared object store, and the directories
# holding its OWN branch ref and reflog, never `refs/heads` or `logs` whole —
# qualified end to end against the real sandbox by
# `tests/test_codex_writer_qualification.py`, so binding `implementer` to codex
# requires a fresh isolated workflow branch wf/<root_id>/candidate.
# Legacy wf/<root_id> writers need a new instance; no automatic migration.
# In the §12 in-repo band `index.lock` shares a directory with `config` and
# `hooks/`, which a directory-granularity sandbox cannot separate, and the
# profile refuses such a dispatch with that explanation instead of widening.
#
# For reviewers, `writes = false` roots codex
# in the activation's `channels/` directory, leaving the checkout
# readable-but-unwritable while its findings channel stays writable
# (`profiles/codex.py` `_workspace_root`), and it gains no git grant at all.
# Each role states the model and effort that its root pins.
[roles.implementer]
profile = "claude"
model = "claude-opus-5"
effort = "high"

[roles.critic]
profile = "codex"
model = "gpt-5.6-sol"
effort = "high"

# feature-delivery's third role (run-ledger §3.7): the debrief writes what the
# round learned into `docs/workstreams/<epic>/runs/<task>/a<n>/`. It copies two
# engine-rendered files and adds a page of prose, once per implement round, so
# it is deliberately the SMALLEST model at the LOWEST effort — the cost of the
# knowledge must stay far below the cost of the work. It writes, so claude.
[roles.scribe]
profile = "claude"
model = "claude-haiku-4-5"
effort = "low"

# build-loop's three further roles. The test author writes, so it is claude for
# the same reason.
[roles.test-author]
profile = "claude"
model = "claude-opus-5"
effort = "high"

# Reviews the acceptance tests; read-only, so codex.
[roles.test-critic]
profile = "codex"
model = "gpt-5.6-sol"
effort = "high"

# Reviews the implementation diff; read-only, so codex.
[roles.impl-critic]
profile = "codex"
model = "gpt-5.6-sol"
effort = "high"
