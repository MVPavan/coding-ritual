[project]
name = "coding-ritual"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
# The project is not installed into the venv (no build backend); tests import
# `workflow_interpreter` from the repo root.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "bd: needs the real bd binary; runs against a throwaway workspace under tmp_path",
    "proc: forks real child processes and signals them; Linux-only, tmp_path-scoped",
    "live: runs a real vendor CLI (claude/codex/opencode); needs auth, spends tokens, deselected unless --run-live",
    "acceptance: a §5 drill row of the phase-5 plan, asserted end to end at a real foreman seam",
]
# `--strict-markers` only: a typo'd or unregistered marker is a collection
# ERROR, not a warning that leaves the test silently passing unfiltered. It is
# safe beside the note below because it is not `-m` — a command-line `-m`
# overrides only the `-m` value, and there is none here.
addopts = ["--strict-markers"]
# No `addopts = -m 'not live'`: any command-line `-m` REPLACES it, so it was not
# a gate at all. `tests/conftest.py` deselects the marker at collection instead.
