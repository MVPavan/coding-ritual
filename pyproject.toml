[project]
name = "coding-ritual"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest.ini_options]
# The project is not installed into the venv (no build backend); tests import
# `workflow_interpreter` from the repo root.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "bd: needs the real bd binary; runs against a throwaway workspace under tmp_path",
    "proc: forks real child processes and signals them; Linux-only, tmp_path-scoped",
]
