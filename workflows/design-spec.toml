[graph]
id = "design-spec"
version = "1.0.1"
entry = "draft"
description = "One tracked Markdown design reviewed before an authenticated human ship gate"

[instance]
max_total_activations = 4
phase_bridge_retry_terminals = ["shipped", "abandoned"]

[fallback]
to = "halt"

[[node]]
name = "draft"
kind = "task"
runner = "profile:implementer"
model = "default"
instructions = """
Write the tracked Markdown design described in `task_brief` and commit it.
Keep every repository write under the declared grant. The runtime supplies the
committed candidate as `candidate_diff` to review. Report `done` when the design
is complete, committed, and supported local checks pass; report `fail_plan` when the brief cannot be made coherent.

Your verdict is a claim; full declared HOST verification remains mandatory and
gates advancement after you return. Perform available supported local checks;
do not run host-only checks (including nested sandbox probes) inside the model
sandbox. Record each command and result, or a not-run reason, in $WF_ARTIFACT_DIR.
Unavailable sandbox/network/tooling is not evidence of a source defect and must
not alone cause `fail_code` or `reject`. Do not retry dependency installs for an
unavailable environment. Real code/test failures must be reported and never
relabeled as environment problems. Review decisions are source/spec judgments;
local evidence does not waive the host gate.

Inspect the provided environment paths first. Use $WF_SCRATCH_DIR (the supplied
$TMPDIR) for temporary repositories and caches; $WF_ARTIFACT_DIR is only for
output evidence/findings, not scratch work.
"""
isolation = "worktree"
writes = true
allowed_paths = ["docs/**"]
inputs = ["task_brief"]
verify = [{cmd="scripts/verify-feature.sh", timeout="10m"}]
context_budget_bytes = 16000
max_wall = "30m"
stale_after = "10m"
max_infra_retries = 0
max_steers = 0
outcomes = ["done", "fail_code", "fail_plan"]

[[node]]
name = "review"
kind = "task"
runner = "profile:critic"
model = "default"
instructions = """
Review `candidate_diff` against `task_brief`. Verify that the proposed Markdown
is complete, tracked, and within the writer's declared scope. Record findings
in WF_ARTIFACT_DIR without changing repository files. Report `accept` only for
the reviewed candidate; otherwise report `reject` or `fail_plan`.

Your verdict is a claim; full declared HOST verification remains mandatory and
gates advancement after you return. Perform available supported local checks;
do not run host-only checks (including nested sandbox probes) inside the model
sandbox. Record each command and result, or a not-run reason, in $WF_ARTIFACT_DIR.
Unavailable sandbox/network/tooling is not evidence of a source defect and must
not alone cause `fail_code` or `reject`. Do not retry dependency installs for an
unavailable environment. Real code/test failures must be reported and never
relabeled as environment problems. Review decisions are source/spec judgments;
local evidence does not waive the host gate.

Inspect the provided environment paths first. Use $WF_SCRATCH_DIR (the supplied
$TMPDIR) for temporary repositories and caches; $WF_ARTIFACT_DIR is only for
output evidence/findings, not scratch work.
"""
isolation = "worktree"
writes = false
allowed_paths = []
inputs = ["task_brief", "candidate_diff"]
verify = [{cmd="scripts/verify-feature.sh", timeout="10m"}, {cmd="scripts/review-checks.sh", timeout="5m"}]
context_budget_bytes = 16000
max_wall = "20m"
stale_after = "10m"
max_infra_retries = 0
max_steers = 0
outcomes = ["accept", "reject", "fail_code", "fail_plan"]

[[node]]
name = "ship"
kind = "gate"
gate_type = "human"
binds = "immutable"
outcomes = ["approve", "abandon"]

[[node]]
name = "halt"
kind = "gate"
gate_type = "human"
binds = "immutable"
outcomes = ["abandon"]

[[node]]
name = "shipped"
kind = "terminal"

[[node]]
name = "abandoned"
kind = "terminal"

[[edge]]
from = "draft"
on = "done"
to = "review"

[[edge]]
from = "draft"
on = "fail_code"
to = "halt"

[[edge]]
from = "draft"
on = "fail_plan"
to = "halt"

[[edge]]
from = "review"
on = "accept"
to = "ship"

[[edge]]
from = "review"
on = "reject"
to = "halt"

[[edge]]
from = "review"
on = "fail_code"
to = "halt"

[[edge]]
from = "review"
on = "fail_plan"
to = "halt"

[[edge]]
from = "ship"
on = "approve"
to = "shipped"

[[edge]]
from = "ship"
on = "abandon"
to = "abandoned"

[[edge]]
from = "halt"
on = "abandon"
to = "abandoned"

[[source]]
name = "task_brief"
producer = "instance"
optional = false
trim_priority = 1

[[source]]
name = "candidate_diff"
producer = "node:draft"
optional = false
trim_priority = 1
