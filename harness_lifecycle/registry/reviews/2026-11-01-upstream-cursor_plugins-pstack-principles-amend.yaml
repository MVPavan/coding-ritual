themes: 'Amends the sealed report `2026-10-31-upstream-cursor_plugins-pstack-principles.yaml`

  for two rows; every other row and ruling stands as ruled there.


  ## R15. Bulk reading to subagents (owner ruling 2026-11-01)


  The owner''s choice differs from the recommendation (`reject`) and from the

  other option (`amend`): a stronger form than upstream. Delegation is the

  default for most work, not only for bulk reading; the agent works locally only

  when that has a real advantage. Under T5 this is an adaptation, so the row is

  an adopt, pending, into the new variant `delegate-by-default` on

  `doc:AGENTS.md`, where it replaces the conditional `delegation-threshold`

  line when the build delivers it.


  Recount of the principles round after this ruling: 110 rows, 95 adopt (10

  delivered, 85 pending), 10 reject, 5 defer; 11 modified adoptions (`into`),

  12 with the mirrored row. `guard-the-context-window`''s unit changes from no

  unit (reject) to an AGENTS.md line.


  ## Recording correction: owning-layer-fix


  `fix-root-causes#owning-layer-fix` is covered by AGENTS.md (its provider), but

  event `2026-11-01-cursor_plugins-pstack-principles:039` named the compared skill

  `systematic-debugging`, which does not list the trait. The same delivered

  adopt is restated with target `doc:AGENTS.md`; the ruling is unchanged.

  '
