        then a menu of local merge, pull request or keep, a discard only on request, and worktree
        cleanup by provenance. Ours: the Autopilot-full playbook, which carries each settled
        feature to a merge-ready pull request and never merges; by the owner''s rulings it
        owns the finish (verify, push, open the pull request). A playbook cannot be the compared
        unit, so compared with none.'
