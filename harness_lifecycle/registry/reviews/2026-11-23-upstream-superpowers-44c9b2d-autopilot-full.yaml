        reason: 'Owner rulings 2026-11-22 (rejections re-review, bead cr-r2pa.3.3: Autopilot-full
          owns finishing a branch: verify, push, open the pull request) and 2026-11-23 (answer
          4 on the Autopilot-full proposal: cleanup after a merge through worktree-cleanup;
          discarding unmerged work stays held). Adopted, pending cr-p3em.4, into the Autopilot-full
          playbook and delivered there in this round: trunk is merged into the feature''s
          branch (git merge --no-ff --no-commit), the staged merge is gated (never refused
          as empty), its manual checks done before the commit, then committed as one commit
          of the whole index (git commit --no-edit, not land), checked to have both parents
          and the results noted with the merge commit''s SHA; then the commit gate runs with
          --since on the committed tip with a clean tree, prints the exact range it judged,
          and each manual check it prints is done on that range and noted on the bead with
          the range and the tip''s SHA. The checks given the judged range read the same range
          the gate prints. Nothing is pushed for the pull request until both pass; a failure
          is fixed by a new gated commit and the step runs again, and a tip with nothing changed
          since trunk stops the feature as nothing to ship. The gate judges that tip: it reads
          its gate file from HEAD and refuses a working copy that differs or is not a regular
          file, its whitespace check reads the merge-base..HEAD range, not the empty index,
          and the trunk merge''s own commit is gated even when it brings no change (.claude/skills/mvp-mode/playbooks/autopilot-full/commit_gate.py,
          tests/checks/test_commit_gate.py). It runs the project''s own checks for what the
          branch changed, from the project''s gate file, rather than one fixed test command.
          A playbook cannot be a report''s compared unit, so the row is absent and the adopt
          is pended, then completed once the playbook lists it.'
