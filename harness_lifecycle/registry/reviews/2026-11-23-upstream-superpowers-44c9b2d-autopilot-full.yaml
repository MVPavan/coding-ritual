    analysis:
      blind:
      - 'announce-use: Announce at the start that this skill is in use, by name. (SKILL.md:12)'
      - 'green-suite-first: Run the project''s full test suite on the tree about to be integrated;
        when it fails, show the failures and stop, offering no integration until it passes.
        (SKILL.md:14-26, 193)'
      - 'workspace-detection: Tell a normal repository, a named-branch worktree and a detached-HEAD
        worktree apart by comparing the git directory with the common git directory, and capture
        the worktree path before changing directory, because cleanup needs it later. (SKILL.md:28-44)'
      - 'base-branch-confirm: Take the base branch from the plan, the conversation or the
        branch''s upstream, and when it is not known ask the person to confirm a guess before
        merging. (SKILL.md:46-51, 200)'
      - 'integration-menu: Present exactly three options (merge locally, push and open a pull
        request, keep as is), or two on a detached HEAD with no merge, and wait for the person''s
        choice; integration is the person''s decision. (SKILL.md:53-82, 194)'
      - 'local-merge: Merge locally by moving to the main checkout, checking out and pulling
        the base, merging the branch and running the tests on the merged result; on a failing
        result stop, leaving the branch and worktree in place. (SKILL.md:86-104, 199)'
      - 'merged-cleanup: After a green merged result, remove the worktree and then delete
        the branch with a safe delete. (SKILL.md:106-111)'
      - 'push-and-pr: Push the branch with upstream tracking (from a detached HEAD, to a new
        remote branch) and open a pull request against the base with the forge''s tooling,
        following the repository''s template, and report its address. (SKILL.md:113-124)'
      - 'keep-worktree: Keep the worktree after a pull request is opened or the branch is
        kept, because review fixes are made there, until the work lands. (SKILL.md:126, 128-130,
        197)'
      - 'discard-on-request: Discard only when the person explicitly asks, never as an offered
        option: list the branch, its commits and the worktree, require the typed word discard,
        then remove the worktree and force-delete the branch. (SKILL.md:78-82, 132-157, 195-196)'
      - 'provenance-cleanup: Remove a worktree only when this skill created it (it lives under
        .worktrees/ or worktrees/), from outside it, then prune; leave any other worktree
        and a detached one to the host. (SKILL.md:159-178, 198)'
      - 'no-force-on-reject: A rejected push means the remote moved: investigate, and force-push
        only on the person''s explicit request. (SKILL.md:201)'
