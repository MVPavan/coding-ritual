      - principle-test-behavior-not-implementation
      suggested: how
      purpose_match: none
      purpose: 'Upstream keeps such a project skill true to the product: it reads each feature''s
        source, drives each live and fixes drift. Nothing of ours maintains a verification
        skill.'
      flag: suggested differs
      reason: 'Compared with none: the owner''s ruling of 2026-11-05 makes it a new unit.
        Suggested how by the computed signals only.'
    analysis:
      blind:
      - 'feature-level-rigor-unit: Set the unit of coverage at the feature, covering each
        from source and live without testing every sentence. (SKILL.md:9)'
      - 'declare-one-outcome: End each pass by choosing and stating exactly one of three outcomes.
        (SKILL.md:13)'
      - 'clean-outcome-no-pr: When every feature has source and live coverage and nothing
        is worth shipping, create no branch and no PR. (SKILL.md:15)'
      - 'single-pr-of-proven-fixes: Cap a pass with changes at one PR containing only proven
        doc, harness or map corrections. (SKILL.md:16)'
      - 'blocked-outcome-names-cause: Use blocked when coverage or a safe ship could not finish,
        and say exactly what stopped it. (SKILL.md:17)'
      - 'skill-directory-edit-scope: Limit edits to the verification skill''s own directory,
        including its feature files and owned harness scripts. (SKILL.md:21)'
      - 'no-product-edits: Never change product code during a run. (SKILL.md:21)'
      - 'drift-versus-regression-split: Classify map-versus-app disagreement as doc drift
        to fix or a product regression to report, and never hide a regression in docs. (SKILL.md:21)'
      - 'target-identification: Identify the target by finding a project-local skill with
        launch and drive sections and a feature map. (SKILL.md:25)'
      - 'ask-on-multiple-targets: Ask which skill is meant when several candidates exist.
        (SKILL.md:25)'
      - 'stop-on-no-target: Stop and point at the creation skill when no target exists rather
        than inventing one. (SKILL.md:25)'
      - 'index-hygiene: Compare the map README with its sibling files and fix missing, extra,
        duplicate or dead entries. (SKILL.md:27)'
      - 'no-generated-inventory: Keep index checking lightweight, without building a generated
        inventory. (SKILL.md:27)'
      - 'per-feature-source-wave: Launch one concurrent read-only subagent per feature file
        to explain from source how the feature works. (SKILL.md:29)'
      - 'cited-drift-flags: Have each source reader flag likely doc drift with citations.
        (SKILL.md:29)'
      - 'one-live-recipe-per-reader: Have each source reader return one concise live-verification
        recipe. (SKILL.md:29)'
      - 'readers-never-drive-or-edit: Forbid source readers from driving the app or editing
        files. (SKILL.md:29)'
      - 'fixed-reader-return-shape: Fix the reader''s return as feature summary, source entry
        points, likely drift or none, and one recipe. (SKILL.md:29)'
      - 'every-feature-returned-check: Confirm that each feature file has a returned summary
        before going on. (SKILL.md:31)'
      - 'merge-recipes-minimize-states: Merge overlapping recipes into as few app states as
        practical. (SKILL.md:31)'
      - 'spot-check-cited-drift: Spot-check drift the readers cited without re-proving claims
        reported clean. (SKILL.md:31)'
      - 'churn-sweep-with-source-path: Sweep recent changes for user-facing surfaces missing
        from the map and require a concrete source path before calling one missing. (SKILL.md:31)'
      - 'mandatory-live-pass: Require the live pass even when the source wave looks clean.
        (SKILL.md:33)'
      - 'coordinator-owned-driving: Reserve all app driving for the coordinator. (SKILL.md:33)'
      - 'skill-decides-launch-model: Follow the target skill''s launch section to choose one
        serial long-lived instance or a fresh isolated session per drive. (SKILL.md:33)'
      - 'every-feature-live-once: Exercise each feature at least once live. (SKILL.md:33)'
      - 'doctor-before-surprising-state: Run doctor before the first drive, on each fresh
        session, and after any failed drive, so no unchecked instance is driven. (SKILL.md:33)'
      - 'reset-when-doctor-blind: Where doctor cannot see a failure such as a wedged UI, reset
        to a known state or relaunch. (SKILL.md:33)'
      - 'evidence-survival-invariant: Hold throughout the pass that captured evidence survives
        each cleanup, checked at its named location. (SKILL.md:33)'
      - 'residue-cleanup-invariant: Clean up what a failed iteration left behind whether the
        session is stuck, exited or shared, removing only residue from a shared instance.
        (SKILL.md:33)'
      - 'drift-doctor-fix-retry-once: Treat a doctor failure caused by skill drift as drift,
        fix it within scope, restart only what the fix invalidated, and retry once before
        declaring blocked. (SKILL.md:33)'
      - 'verified-unreachable-status: Mark a feature verified-unreachable only with the concrete
        prerequisite and the route attempted. (SKILL.md:33)'
      - 'omitted-prerequisite-is-drift: Count a prerequisite the map fails to mention as drift.
        (SKILL.md:33)'
      - 're-drive-harness-fixes: Drive any harness fix live again before it ships. (SKILL.md:33)'
      - 'final-teardown-after-re-proofs: Do final teardown only after the last drive of the
        run, including re-proofs, leaving the evidence in place. (SKILL.md:33)'
      - 'doc-drift-triage: Fix a wrong or missing user-view description as doc drift. (SKILL.md:35)'
      - 'harness-gap-triage: Fix working behavior the harness cannot drive as a harness gap,
        under the same executable-and-documented helper rule used at generation. (SKILL.md:35)'
      - 'product-gap-triage: Record genuinely broken app behavior for the user and keep it
        out of the PR. (SKILL.md:35)'
      - 'reread-changed-files-before-pr: Re-read every changed file before opening the PR.
        (SKILL.md:37)'
      - 'honest-coverage-report: For clean or blocked passes, open no PR and report the outcome
        and coverage honestly. (SKILL.md:37)'
      - 'uncommitted-run-notes: Keep concise notes on features covered, unreachable prerequisites,
        confirmed drift and outcome in a scratch location that is not committed. (SKILL.md:39)'
