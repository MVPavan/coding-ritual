    pairing:
      overlap: {}
      placement_match: []
      suggested: null
      purpose_match: prototype
      purpose: Upstream model-checks a state machine and draws it so a person can judge the
        behaviour. `prototype` answers a state-model question with a throwaway demo the person
        runs; it checks no rules.
      flag: 'The pair agrees on purpose (judging a state model) but shares almost no traits:
        prototype demonstrates states and checks no rules.'
      reason: 'Compared with prototype: the only unit of ours for a state-model question,
        though nothing of ours checks a model, so few rows overlap.'
    analysis:
      blind:
      - 'scratch-workdir-outside-repo: The agent writes the model and its config in a scratch
        folder outside the repository. (SKILL.md:13)'
      - 'single-check-and-draw-command: One command takes a spec file plus optional config,
        view module and output folder, model-checks the spec and draws its state graph. (SKILL.md:15-17;
        scripts/statechart.ts:9-23)'
      - 'runtime-launcher-version-gate: A shell launcher resolves symlinks and runs the TypeScript
        entry on the first suitable runtime (Node 22.18–22.x or 23.6+, Bun 1.1.5+, Deno 2+),
        or exits 127 naming the versions it needs. (SKILL.md:19; scripts/statechart:1-29)'
      - 'auto-install-pinned-checker: On first use the tool installs a pinned model-checker
        release (verified by checksum) and a pinned Java build through mise, which needs the
        network. (SKILL.md:21; scripts/run.ts:67-69, 193-213)'
      - 'checker-path-override: Environment variables can point the tool at an existing checker
        jar and Java binary in place of the managed install, and an install failure message
        says so. (scripts/run.ts:194-195, 203-206)'
      - 'deterministic-checker-flags: Every checker run is pinned to one worker, a fixed fingerprint
        seed and liveness checked only at the end. (SKILL.md:69; scripts/run.ts:70, 339-345)'
      - 'spec-folder-on-module-path: Modules beside the spec are on the checker''s library
        path, so the spec can extend sibling modules. (scripts/run.ts:288, 305)'
      - 'config-defaults: The config defaults to the spec name with `.cfg` and the output
        folder to the spec name with `-chart`; a missing config is an error that names the
        flag to pass. (scripts/statechart.ts:53-56)'
      - 'config-prevalidation: Before running the checker, the tool parses the config itself
        and refuses unreadable or invalid input (bad characters, unterminated strings or comments,
        reserved symbols, keywords used as names, duplicate single-value sections, numbers
        out of range, both INIT/NEXT and SPECIFICATION, no initial predicate) with a file
        and line number. (scripts/frontends/config.ts:62-276; scripts/frontends/spec.ts:6-21)'
      - 'parse-before-check: The spec is parsed by the language front end first, and a parse
        failure stops the run with the tail of the parser''s output. (scripts/run.ts:302-310)'
      - 'fresh-output-folder-only: The command writes only to a new or empty folder, refuses
        a broken link or unreadable path, and names the first file found when the folder is
        not empty. (SKILL.md:80; scripts/statechart.ts:57-78)'
      - 'atomic-output-publish: Results are written to a hidden staging folder and moved into
        place in one rename, and if the target folder gained files during the run the command
        writes nothing and says so. (scripts/statechart.ts:80-83, 140-150; scripts/worker.ts:18-30)'
      - 'exit-code-contract: The exit code is the checker''s own verdict on the config as
        written: 0 all rules hold, 1 a rule breaks, 2 error or kill or unusable input, 130/143
        for interrupt/terminate; only 0 and 1 produce output. (scripts/statechart.ts:21-23,
        134-154; scripts/run.ts:215-216)'
      - 'clean-interrupt: An interrupt or terminate signal kills the whole check process group,
        removes temporary files (also if the parent dies, via a watcher process) and reports
        that nothing was written. (scripts/statechart.ts:25-32, 116-138, 155-159)'
      - 'report-to-stdout: On success the command prints the report text and the folder it
        wrote. (scripts/statechart.ts:151-152)'
      - 'unnamed-break-is-error: When the checker exits with a failure but names no rule that
        broke, the command stops with an error and the output tail rather than guessing. (scripts/run.ts:374-377)'
      - 'trimmed-error-excerpt: When the checker stops on an error, the report quotes only
        its error messages, cut to 40 lines (or the last 30 lines of output when no error
        message is found). (scripts/run.ts:218-244)'
      - 'agreed-rules-as-invariants: Each rule the reader agrees to is written as an invariant,
        covering screens, results, stored values or messages. (SKILL.md:25)'
      - 'add-variable-for-rule: When the model has no variable a rule needs, the agent adds
        one. (SKILL.md:25)'
      - 'no-rule-weakening: A rule is never weakened to make it hold. (SKILL.md:25)'
      - 'next-as-named-disjunction: The next-state relation is written as a disjunction of
        named actions so each step carries its action name. (SKILL.md:26)'
      - 'terminal-stutter-action: To keep correct end states from counting as deadlocks, the
        agent adds an action enabled only in end states that changes nothing, and labels it.
        (SKILL.md:27)'
      - 'deadlock-rule-name-collision: The deadlock rule is reported as `NoDeadlock`, or as
        `CHECK_DEADLOCK` when an invariant or property already uses that name. (SKILL.md:27;
        scripts/ir.ts:527-535)'
      - 'bounded-state-space: Because checking continues past violations, the agent keeps
        constants small or adds a constraint so an unbounded model does not run forever. (SKILL.md:65-66)'
      - 'rerun-until-no-break: When a rule breaks, the tool drops it and reruns the checker
        until no remaining rule breaks, so every rule gets its own verdict (holds, broken,
        not checked). (SKILL.md:69; scripts/run.ts:316-381)'
      - 'properties-isolated-on-break: When a temporal property breaks while several are checked
        together, the tool splits the properties into separate runs to find which ones break.
        (scripts/run.ts:362-373)'
      - 'rerun-state-bound: After the first break each rerun stops at 100,000 distinct states;
        rules a bounded or failed run could not finish are listed as not checked and left
        unmarked, with the bound named in the report. (SKILL.md:69; scripts/run.ts:337-358,
        379; scripts/backends/cfg.ts:10-18; scripts/backends/report.ts:157-161)'
      - 'unchecked-rule-remedy: To check a rule listed as not checked, the agent removes the
        breaking rules from the config or shrinks the model. (SKILL.md:69)'
