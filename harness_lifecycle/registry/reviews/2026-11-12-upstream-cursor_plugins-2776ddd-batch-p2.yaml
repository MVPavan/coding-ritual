  skill:pstack/skills/maintain-formal-verification-skill:
    upstream_tree_hash: 10c850aa0b1db151e2b196428c0166bebbb0ae307032d71bf1cadc82eb93e669
    accepted: null
    compared_with: none
    pairing:
      overlap:
        doc:.claude/skills/mvp-mode/playbooks/figure-it-out.md: 1
        doc:.claude/skills/mvp-mode/playbooks/hillclimb.md: 1
        principle-sequence-verifiable-units: 1
      placement_match: []
      suggested: principle-sequence-verifiable-units
      purpose_match: none
      purpose: Upstream keeps a formal verification true to changed code and tells drift from
        bugs. Nothing of ours maintains one.
      flag: suggested differs
      reason: 'Compared with none: nothing of ours does formal verification. Suggested principle-sequence-verifiable-units
        by the computed signals only.'
    analysis:
      blind:
      - 'per-check-outcome: Give each check one named outcome: in sync, updated, bug, or blocked
        with the exact reason. (SKILL.md:13-18)'
      - 'updated-and-bug-combination: A check can be both updated and bug, when the update
        restores fidelity and the property then fails. (SKILL.md:20)'
      - 'verification-only-edit-scope: Edit only models, harnesses, property files and the
        verify skill; never product code during a run unless asked. (SKILL.md:24)'
      - 'no-weakening-on-failure: When a property fails on current code, report it rather
        than weakening the property or model. (SKILL.md:24)'
      - 'discover-checks-by-function: Find verify skills by what they do (run a verifier against
        named code), since they have no fixed name, or use the one the user named. (SKILL.md:28)'
      - 'per-check-inventory: For each check collect the property, covered code, bounds and
        assumptions, run command, and last sync commit. (SKILL.md:28)'
      - 'stop-when-no-verify-skill: If no verify skill exists, stop and point at the creation
        procedure. (SKILL.md:28)'
      - 'inferred-sync-commit-fallback: When no sync commit is recorded, use the last commit
        that changed the verification files and say so. (SKILL.md:28)'
      - 'baseline-run-before-edits: Run each check once before changing anything and record
        the result. (SKILL.md:30)'
      - 'defer-failure-classification: Do not decide whether a baseline failure is drift or
        a bug until rerun-and-judge. (SKILL.md:30)'
      - 'diff-since-sync-commit: Diff the covered files from the sync commit to now and read
        each commit message. (SKILL.md:32)'
      - 'track-moved-code: A covered function that was renamed, split or moved stays covered
        code. (SKILL.md:32)'
      - 'find-new-writers-of-guarded-state: Look for new code that touches the state a check
        guards. (SKILL.md:32)'
      - 'four-way-change-classification: Classify each change as no effect, verification no
        longer describes code, promise changed on purpose, or promise may be broken. (SKILL.md:32-36)'
      - 'no-effect-checked-against-model: Judge "no effect" against the model or harness,
        not the commit message. (SKILL.md:33)'
      - 'intended-change-needs-evidence: A promise counts as changed on purpose only with
        cited evidence from the change (doc comment, tests, changelog or commit message).
        (SKILL.md:35)'
      - 'unexplained-change-is-bug-candidate: A changed promise with no supporting evidence
        makes any following failure a bug candidate. (SKILL.md:36)'
      - 'update-from-code-before-rerun: Write the model update from the code before rerunning,
        never shaped by what makes the check pass. (SKILL.md:38)'
      - 'preserve-traceability-and-atomicity: Each changed part of the model again points
        to openable code, and one indivisible code step stays one verification step. (SKILL.md:38)'
      - 'property-change-audit-trail: Change a property only for an intended promise change,
        recording the old wording, new wording and evidence. (SKILL.md:38)'
      - 'keep-bounds: Keep bounds unless the change makes them wrong, and report any reduction.
        (SKILL.md:38)'
      - 'post-update-failability-check: After a pass, break the new code the way the property
        guards against, confirm the check catches it, then drop the break. (SKILL.md:41)'
      - 'counterexample-replay: After a failure, replay the counterexample step by step against
        real code; a step that cannot happen means the verification is wrong, to be fixed
        and explained. (SKILL.md:42)'
      - 'bug-report-fields: A confirmed bug names the introducing commit, tells the counterexample
        as steps in the code''s words, and states the harm in one sentence. (SKILL.md:42)'
      - 'uncommitted-repro-evidence: A cheap test or repro that shows the bug goes in the
        report as evidence but is not committed to product code. (SKILL.md:42)'
      - 'verify-skill-metadata-refresh: Update each check''s covered code, commands, bounds,
        assumptions and sync commit in the verify skill, setting the sync commit to the commit
        checked. (SKILL.md:44)'
      - 'blocked-check-sync-freeze: Do not move the sync commit for a blocked check, and say
        so. (SKILL.md:44)'
      - 'verify-skill-dry-run: Follow the updated verify skill once as the next agent would
        to confirm its steps run. (SKILL.md:44)'
      - 'per-check-report: Report per check the outcome and commits read, each verification
        change with its reason, the rerun result and the break used, each bug in plain words
        with its commit, and remaining coverage gaps including uncovered new code. (SKILL.md:48-54)'
      - 'drift-vs-bug-attribution: State outright which failures were verification drift and
        which were code bugs. (SKILL.md:56)'
      - 'stale-pass-disclosure: For a check that passed before the update and fails after,
        say the old pass was on a stale description. (SKILL.md:56)'
      - 'separate-verification-change: Put verification updates in a change of their own,
        separate from any product fix. (SKILL.md:58)'
