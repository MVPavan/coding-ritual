themes: These rows serve proof that a change works in the real product, by driving it as a
  user would and keeping the evidence, and plain prose for people, in documents and pull requests
  alike. They also serve reviews of past sessions that turn mistakes into approved changes,
  and delegated workers that report against named commits, methods and full coverage. The
  recommendations are ruled as one set, with named exceptions.
