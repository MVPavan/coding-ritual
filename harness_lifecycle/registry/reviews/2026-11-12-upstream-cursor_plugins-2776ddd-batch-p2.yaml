      suggested: brief-me
      purpose_match: none
      purpose: Upstream verifies one promise of the code with a formal tool and leaves a project
        skill to recheck it. Nothing of ours uses formal tools.
      flag: suggested differs
      reason: 'Compared with none: nothing of ours does formal verification. Suggested brief-me
        by the computed signals only.'
    analysis:
      blind:
      - 'leave-reusable-verify-skill: The run verifies one property and leaves a project-local
        skill that lets a later agent check changes against it. (SKILL.md:9)'
      - 'write-for-cold-reader: The generated skill is written for an agent reading it cold,
        mid-change, with no knowledge of this work. (SKILL.md:9)'
      - 'trust-without-tool-literacy: The user must be able to trust and act on the result
        without learning the verification language. (SKILL.md:9)'
      - 'answer-from-codebase: Answer questions from the code and ask the user only what cannot
        be observed. (SKILL.md:13)'
      - 'start-at-named-area: If the user named an area or bug, start there. (SKILL.md:13)'
      - 'target-selection-criteria: A target is a promise the code makes whose break harms
        users and that tests rarely reach. (SKILL.md:15)'
      - 'strongest-not-easiest-target: Choose the strongest such target in the repo, not the
        easiest to verify. (SKILL.md:15)'
      - 'question-driven-tool-choice: Pick the verification tool that answers the question
        at the lowest cost. (SKILL.md:19)'
      - 'model-checker-for-ordering: Questions about bad event orderings suit a model checker
        over a small design model, with TLA+ the default in any language. (SKILL.md:19)'
      - 'code-level-verifier-for-inputs: Questions about the code''s behaviour for every input
        (memory safety, overflow, data-structure invariants) suit a verifier that runs on
        the code. (SKILL.md:19)'
      - 'generated-input-fallback: When no verifier supports the language, say so and test
        the real code with generated inputs, not a hand model of it. (SKILL.md:19)'
      - 'proof-for-unbounded-properties: A property that must hold at every size, where a
        bound is not enough, may need a proof. (SKILL.md:19)'
      - 'installable-tool-preference: Prefer a tool the repo''s developers can install and
        run, and tell the user why it was chosen. (SKILL.md:19)'
      - 'traceable-to-code: Every part of the model or proof points to code a reviewer can
        open. (SKILL.md:23)'
      - 'atomicity-fidelity: What the verification treats as one indivisible step is one indivisible
        step in the code. (SKILL.md:23)'
      - 'repo-vocabulary: Names in the verification come from the repository. (SKILL.md:23)'
      - 'demonstrated-failability: Each property is shown failing on a deliberately broken
        variant of the code it guards. (SKILL.md:24)'
      - 'findings-not-weakened: When current code breaks the property, report it with the
        counterexample in code terms and never weaken the property or model to pass. (SKILL.md:25)'
      - 'no-product-code-edits: Do not change product code unless the user asks. (SKILL.md:25)'
      - 'explicit-scope-statement: State what is verified, under which bounds and assumptions,
        and what is left out. (SKILL.md:26)'
      - 'plain-property-and-harm: State the property and its harm in one plain sentence each.
        (SKILL.md:27)'
      - 'counterexample-as-code-steps: Tell a counterexample as a short sequence of steps
        in the code''s words. (SKILL.md:27)'
      - 'cheap-rerun: The check runs with one command, a reproducible tool version, and a
        short run time. (SKILL.md:28)'
      - 'coverage-and-sync-record: Record which files and functions each check covers and
        the commit at which the verification was last confirmed to match them, so drift is
        visible. (SKILL.md:29)'
      - 'registrable-skill-frontmatter: The generated skill has frontmatter naming the area
        and when to use it, so it registers. (SKILL.md:33)'
      - 'generated-skill-capabilities: From the skill alone the next agent can tell whether
        a change touches verified code, run the check, distinguish a real bug from a modelling
        error, and update the verification for intended changes. (SKILL.md:33)'
      - 'sync-commit-advance-rule: The generated skill tells the next agent to move the sync
        commit forward only after confirming the verification matches the code at the new
        commit. (SKILL.md:33)'
      - 'no-placeholders: The generated skill uses the repo''s real commands, paths and nouns,
        with no placeholders. (SKILL.md:33)'
      - 'reference-companion-tool-by-name: For a TLA+ check, the generated skill tells the
        next agent to read results with a named companion charting skill, and copies none
        of its commands, options or paths. (SKILL.md:35)'
      - 'dogfood-on-scratch-break: Follow the generated skill once as the next agent would,
        on a scratch change that breaks the property in real code; it must catch the break.
        (SKILL.md:39)'
      - 'baseline-restore-check: After dropping the scratch change, confirm the check returns
        to its prior state: passing, or failing only on findings to be reported. (SKILL.md:39)'
      - 'unrun-skill-is-draft: A verify skill that has never been run counts as a draft. (SKILL.md:39)'
      - 'fix-skill-not-scratch: If the skill misses the break or a step fails, fix the skill
        or the verification, not the scratch change. (SKILL.md:39)'
      - 'handoff-contents: Tell the user what was verified, the tool and why, the bounds,
        findings in plain words, how to run it, and what it does not cover. (SKILL.md:43)'
      - 'adjacent-target-only-if-close: Suggest a second target only if a close one was found.
        (SKILL.md:43)'
