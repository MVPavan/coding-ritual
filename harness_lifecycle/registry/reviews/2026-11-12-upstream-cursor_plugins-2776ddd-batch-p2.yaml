  skill:pstack/skills/ketchup:
    upstream_tree_hash: f2f883bf6e1e1e9de3936d21faa3c64da9f8e9c103499f6dee8c3eb6d455083e
    accepted: null
    compared_with: recall
    pairing:
      overlap:
        doc:AGENTS.md: 1
        teach: 1
      placement_match:
      - brief-me
      - html-artifact
      - show-me
      - unslop
      suggested: teach
      purpose_match: recall
      purpose: Upstream catches the person up on the current chat since their last message,
        with the decisions waiting on them. `recall` rebuilds work across past chats into
        a brief; `brief-me` sets reply style. Nothing of ours catches up within the current
        chat.
      flag: 'Purpose differs: recall rebuilds past chats and this catches up on the current
        one, and the computed pick, teach, shares only one figure rule; no unit of ours has
        this job.'
      reason: 'Compared with recall: the only unit of ours that produces a catch-up brief,
        though over past chats rather than the current one. Suggested teach by the computed
        signals only.'
    analysis:
      blind:
      - 'since-last-user-message-window: Cover what changed since the user''s last message
        before the command; notifications and subagent results are not user messages. (SKILL.md:9)'
      - 'assume-only-last-message-known: Assume the user remembers their last message and
        nothing after it. (SKILL.md:9)'
      - 'explain-not-just-status: Help the user understand each change, not only where it
        stands. (SKILL.md:9)'
      - 'decide-from-reply-alone: Lay out every waiting call so the user can make it from
        the reply without anything else. (SKILL.md:9, 23)'
      - 'plain-spoken-voice: Plain words, short sentences, no jargon, like one person catching
        up another. (SKILL.md:11)'
      - 'outcome-over-method: Say what changed for the user, not how it was done, in user
        terms rather than tool terms. (SKILL.md:11)'
      - 'omit-technical-identifiers: Leave out hashes, paths, commands, build numbers and
        test counts unless the user needs one to act. (SKILL.md:11)'
      - 'user-known-names: Call each PR, branch or agent by a name the user would know, not
        an invented label. (SKILL.md:11)'
      - 'context-or-omit: Give a fact the context it needs to make sense, or leave it out.
        (SKILL.md:11)'
      - 'read-only-turn: Change no code, start no app or job, post nothing; make visuals only
        from material already in hand. (SKILL.md:15)'
      - 'gather-all-sources: Collect own work, subagent reports and messages from anyone else
        in the chat since the window start. (SKILL.md:15)'
      - 'live-state-check: Check the current state of every PR, CI run or agent the chat touched.
        (SKILL.md:15)'
      - 'verify-shown-numbers: Check each number shown against its source, and say so when
        one is corrected. (SKILL.md:15)'
      - 'user-only-action-items: An action item is a call only the user can take (product
        choice, approval, irreversible action, access the agent lacks); work the agent can
        still do is not one. (SKILL.md:17)'
      - 'carry-forward-pending-calls: Include any call still waiting on the user, even one
        raised before their last message. (SKILL.md:17)'
      - 'no-invented-calls: Never make up a call to fill the reply. (SKILL.md:17)'
      - 'unrequested-step-exclusion: A step the user did not ask for and the work does not
        need is excluded, unless it is irreversible and waiting on the user, in which case
        it gets one line and no visual. (SKILL.md:17)'
      - 'group-items-under-one-call: One call can cover many items, such as a set of PRs awaiting
        merge. (SKILL.md:19)'
      - 'per-item-decision-fields: For each item collect its link, what it changes for users,
        the evidence behind the pick, its risk, and the agent''s pick. (SKILL.md:19)'
      - 'explicit-unknowns: Write "unknown" for any needed fact the agent does not know, and
        omit links it does not have. (SKILL.md:19)'
      - 'words-on-calls: Spend words on the calls rather than the story; leave out work that
        changed nothing for the user. (SKILL.md:23)'
      - 'narrative-word-cap: Keep what happened under 100 words, excluding pictures, and shorter
        when less happened. (SKILL.md:23)'
      - 'per-item-word-budget: About 30 words per item, with total length growing with the
        item count. (SKILL.md:23)'
      - 'never-shrink-items: Never drop items or replace them with a count or a bare link
        to meet a word count. (SKILL.md:23)'
      - 'waiting-first-opening: Open with one sentence naming what waits on the user, or saying
        nothing does. (SKILL.md:25)'
      - 'nothing-happened-stop: If nothing happened and nothing waits, say so and stop. (SKILL.md:25)'
      - 'pictures-first-narrative: Show what happened with pictures first: produced screenshots
        and videos inline, then any explanatory diagram. (SKILL.md:27)'
      - 'per-request-outcome-bullets: One short bullet per thing the user asked for, giving
        its result and whether it is done, still running, failed or not checked. (SKILL.md:27)'
      - 'spoken-sentence-bullets: Write each bullet as a sentence one would say aloud, not
        a label-colon-status tag. (SKILL.md:27)'
      - 'name-incidental-bug-fixes: Name any bug found and fixed along the way. (SKILL.md:27)'
      - 'standalone-true-lines: Each line stays true when read alone. (SKILL.md:27)'
      - 'no-done-while-waiting: Never mark something done that still waits on the user. (SKILL.md:27)'
      - 'no-summary-action-overlap: Leave out of the summary anything the action items say.
        (SKILL.md:27)'
      - 'three-key-takeaways-cap: Under the summary, at most three short lines that change
        what the user knows or must do. (SKILL.md:27)'
      - 'remaining-own-work-line: Name in one line any work left that the agent can do itself.
        (SKILL.md:27)'
      - 'ask-call-with-pick: For each action item, ask the call the user owns and give the
        agent''s pick. (SKILL.md:29)'
      - 'pick-includes-prereqs-and-irreversibles: The pick includes any step the agent would
        take first, anything that must happen first, and anything that cannot be undone. (SKILL.md:29)'
      - 'cite-item-identifiers: Give the number or link of each PR, issue or agent a call
        concerns, also within a choice between options. (SKILL.md:29)'
      - 'single-item-call-bullet: A call about one item is one bullet with the call, pick,
        user impact, evidence and risk, naming the item once. (SKILL.md:31)'
      - 'shared-call-riskiest-first: When items share a call, state the call and pick once,
        then one bullet per item ordered riskiest first, naming an item''s pick only where
        it differs. (SKILL.md:31)'
      - 'always-state-risk: Give each item''s risk even when it is low. (SKILL.md:31)'
      - 'waiting-cost-only-if-material: Say what waiting costs only when it is more than delay,
        such as a deadline or data loss. (SKILL.md:31)'
      - 'options-gain-and-cost: For a choice between options, give every weighed option with
        what it gains and costs and its current state; those costs stand in for a separate
        risk line. (SKILL.md:33)'
      - 'option-text-under-screenshots: When screenshots above show the options, write each
        option''s gain and cost under its screenshot. (SKILL.md:33)'
      - 'draw-when-picture-clearer: Draw when a picture is easier to grasp than sentences,
        such as how a system works, a PR stack with states, a before/after, or options side
        by side. (SKILL.md:39)'
      - 'banned-visual-kinds: Never draw a status list, a list of action items, or unconnected
        boxes. (SKILL.md:39)'
      - 'no-repeated-facts: Never give a fact twice, in text or across visuals. (SKILL.md:39)'
      - 'glanceable-visual-limits: Each visual has at most six boxes with at most eight words
        each. (SKILL.md:41)'
      - 'plain-visual-labels: Labels are plain spoken words, not tags; a fact that needs a
        sentence goes in the text or nowhere. (SKILL.md:41)'
      - 'inline-media-for-visible-changes: Embed screenshots and videos inline when a change
        is visible, not only as links. (SKILL.md:43)'
      - 'no-screenshot-marker: When a visible change has no screenshot, mark its summary line
        "No screenshot yet" and describe the on-screen change. (SKILL.md:43)'
      - 'diagram-type-by-content: Use a Mermaid diagram for how things connect and a charting
        tool for numbers, drawn only from facts in hand. (SKILL.md:43)'
      - 'no-fabricated-visuals: Never invent a number or draw or generate a screen that was
        not captured. (SKILL.md:43)'
      - 'link-only-existing-artifacts: Link only artifacts that exist. (SKILL.md:43)'
