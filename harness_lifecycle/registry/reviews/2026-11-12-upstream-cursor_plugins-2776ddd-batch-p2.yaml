  skill:pstack/skills/create-verification-skill:
    upstream_tree_hash: 8a96bace9d61f0c3bfc226755a7de750cfc738f4e3c598430401077d9b9f42d6
    accepted: null
    compared_with: none
    pairing:
      overlap:
        doc:.claude/skills/mvp-mode/playbooks/eval.md: 1
        doc:.claude/skills/mvp-mode/playbooks/feature.md: 1
        doc:.claude/skills/mvp-mode/playbooks/figure-it-out.md: 1
        doc:.claude/skills/mvp-mode/playbooks/refactoring.md: 1
        doc:.repo-context/coding-style.md: 1
        doc:.repo-context/verification.md: 1
        doc:AGENTS.md: 1
        sharpen: 1
        show-me: 1
        tdd: 1
      placement_match:
      - check-invariants
      - principle-test-behavior-not-implementation
      suggested: sharpen
      purpose_match: none
      purpose: Upstream writes a project skill that launches the real product, drives a feature
        as a user would and keeps the evidence. Nothing of ours gives the means to drive work
        end to end, which `.repo-context/verification.md` asks for.
      flag: suggested differs
      reason: 'Compared with none: the owner''s ruling of 2026-11-05 makes it a new unit.
        Suggested sharpen by the computed signals only.'
    analysis:
      blind:
      - 'per-repo-verification-skill: Produce a skill stored inside the project that scripts
        launching the real app, exercising a feature as a user would, and capturing evidence.
        (SKILL.md:9)'
      - 'cold-reader-audience: Write the generated skill for an agent that meets the app for
        the first time in the middle of a task, not for a human. (SKILL.md:9)'
      - 'repo-before-user-interview: Answer the setup questions from the codebase and ask
        the user only for what cannot be observed there. (SKILL.md:13)'
      - 'primary-surface-selection: Identify every surface a user touches, choose the main
        one, and note the others. (SKILL.md:15)'
      - 'documented-run-command-first: Prefer the repo''s own documented dev command when
        working out how the app starts locally. (SKILL.md:16)'
      - 'run-prerequisite-inventory: Record the ports, environment variables, seed data and
        authentication that a local run needs. (SKILL.md:16)'
      - 'existing-harness-first: Look for driving harnesses the repo already has before choosing
        anything generic. (SKILL.md:17)'
      - 'generic-drive-recipes: Fall back to a recipe matched to the surface, namely browser
        or CDP for web and Electron, tmux or PTY for CLI and TUI, and plain HTTP for services.
        (SKILL.md:17)'
      - 'evidence-inventory: List the kinds of evidence the app can yield, such as screenshots,
        transcripts, response bodies, logs, exit codes and database state. (SKILL.md:18)'
      - 'isolation-probe: Establish whether two instances can run side by side through separate
        ports, data directories or profiles. (SKILL.md:19)'
      - 'refuse-shared-double-drive: When instances cannot be isolated, have the generated
        skill state this and decline to drive a shared instance rather than risk the user''s
        session. (SKILL.md:19)'
      - 'working-base-precondition: Make a broken checkout build and start, or report the
        failure precisely, before generating anything from it. (SKILL.md:21)'
      - 'marked-startup-scaffolding: Allow the generated skill to create an irrelevant asset
        that blocks startup, provided it is labelled as verification scaffolding and removed
        in cleanup. (SKILL.md:21)'
      - 'registering-frontmatter: Give the generated skill frontmatter with its name and a
        description naming the app, surface and when to use it, since it does not register
        otherwise. (SKILL.md:25)'
      - 'no-placeholder-sections: Ground every generated section in interview findings and
        leave no placeholders. (SKILL.md:25)'
      - 'exact-launch-with-ready-signal: State the exact start command and the concrete sign,
        such as a log line or prompt, that shows readiness. (SKILL.md:27)'
      - 'empty-data-dir-launch: Require launch to reach a usable state from an empty data
        directory, including migrations and seed data. (SKILL.md:27)'
      - 'ready-means-usable: Treat readiness as the app being usable, not merely a process
        or health check answering. (SKILL.md:27)'
      - 'launch-teardown-pairing: Include teardown alongside the launch instructions. (SKILL.md:27)'
      - 'short-lived-cli-launch: For a short-lived CLI or TUI, redefine launch as one build
        or install followed by a separate isolated session per drive. (SKILL.md:27)'
      - 'read-only-doctor: Provide one read-only check covering process liveness, the right
        build, port ownership and valid auth, answering whether the instance is worth driving.
        (SKILL.md:28)'
      - 'doctor-when-suspicious: Direct the agent to run the doctor first whenever something
        looks wrong. (SKILL.md:28)'
      - 'repo-real-drive-commands: Write the drive recipe with this repo''s actual selectors
        and commands instead of illustrative ones. (SKILL.md:29)'
      - 'stable-handles-preference: Prefer durable handles such as ARIA labels, data attributes,
        prompt strings and routes over coordinates and tab order. (SKILL.md:29)'
      - 'named-evidence-destination: State what to capture for a proof and where it is stored.
        (SKILL.md:30)'
      - 'real-user-path-proof: Require proofs to go through the real user path, not internal
        setters or test-only endpoints. (SKILL.md:30)'
      - 'action-and-state-capture: Capture both the action taken and the resulting state,
        not only the final screen. (SKILL.md:30)'
      - 'side-effect-verification: Verify side effects such as written files, inserted rows
        and sent messages along with what is visible. (SKILL.md:30)'
      - 'boundary-only-mocks: Permit mocks only where a production boundary already isolates
        the external system. (SKILL.md:30)'
      - 'observe-dry-run-behavior: Confirm by observing files, network and git refs what a
        dry-run or test mode really skips, rather than trusting its name. (SKILL.md:30)'
      - 'kill-only-what-you-started: Tear down only instances the run created and never kill
        by process name. (SKILL.md:31)'
      - 'cleanup-preserves-evidence: Make cleanup remove instances and scratch state while
        proof artifacts survive at a location the skill names. (SKILL.md:31)'
      - 'runnable-documented-helpers: Require every shipped helper script to be executable
        and its invocation to appear in the skill body. (SKILL.md:32)'
      - 'seeded-feature-map: Create a feature map with an index README and one file per user-facing
        feature, starting from about the top three to five found in routes, commands, menus
        or docs. (SKILL.md:36)'
      - 'user-pov-feature-questions: Have each feature file answer, from the user''s view,
        what the feature is, how to reach it, how to drive it and which observable end state
        proves it. (SKILL.md:36)'
      - 'four-heading-feature-shape: Fix the feature file''s H2s as sub-features, how to get
        to it, driving it with the harness, and gotchas. (SKILL.md:36)'
      - 'failing-journey-not-weakened: When seed data lacks a journey''s precondition, report
        the journey as failed, record the reason in gotchas, and never weaken the journey
        to pass. (SKILL.md:36)'
      - 'map-defines-proof-completeness: Treat the map as the maintained verification source,
        so a proof through one convenient entry point is incomplete when the map lists others.
        (SKILL.md:36)'
      - 'end-to-end-self-proof: Run the generated skill''s own launch, doctor, drive, evidence
        and cleanup steps once before handover, since an unexecuted skill is only a draft.
        (SKILL.md:40)'
      - 'single-feature-proof-scope: Limit the handover proof to one mapped feature and leave
        the rest to later runs. (SKILL.md:40)'
      - 'post-cleanup-evidence-check: After cleanup, confirm the evidence still exists at
        the named location and fail the step if it does not. (SKILL.md:40)'
      - 'cleanup-after-failed-iterations: Run the generated cleanup after each failed attempt
        too, so no processes or ports are stranded. (SKILL.md:40)'
      - 'stand-in-gap-disclosure: If the proof ran in a stand-in for the real target, list
        every setup step the stand-in did that the target will not and keep those steps marked
        unverified. (SKILL.md:40)'
      - 'cadence-on-request-only: Suggest a maintenance cadence only when the user asks for
        one. (SKILL.md:44)'
      - 'read-index-before-driving: Have the map tell the reader to read the index first and
        then use the matching feature file as the recipe. (references/feature-map-example/README.md:3)'
      - 'baseline-preconditions-block: Open the map index with a shared block of preconditions
        covering launch address, seed data and tools on PATH. (references/feature-map-example/README.md:5-10)'
      - 'per-run-disposable-data-dir: Give each run its own disposable data directory keyed
        by a run ID so concurrent runs share no state. (references/feature-map-example/README.md:7-8)'
      - 'doctor-identity-assertion: Require the doctor output to match the expected URL, data
        directory and build revision. (references/feature-map-example/README.md:11)'
      - 'never-drive-foreign-instance: Refuse to drive any instance this verification run
        did not start. (references/feature-map-example/README.md:12)'
      - 'baseline-start-recipes: Start each recipe from the baseline state unless its own
        preconditions say otherwise. (references/feature-map-example/README.md:16)'
      - 'accessible-name-selection: Prefer ARIA roles and accessible names over CSS selectors
        or DOM position. (references/feature-map-example/README.md:17)'
      - 'literal-command-handling: Treat each command as literal and keep quoted names and
        flags unchanged. (references/feature-map-example/README.md:18)'
      - 'single-wrapper-driving: Route browser and terminal actions through one control wrapper
        command. (references/feature-map-example/README.md:19-20)'
      - 'restore-seed-after-mutation: Put seeded data back after any mutation. (references/feature-map-example/README.md:21)'
      - 'ui-proof-pair: Define UI proof as an ARIA snapshot plus a screenshot with the app''s
        identity visible. (references/feature-map-example/README.md:26)'
      - 'cli-proof-tuple: Define CLI proof as the command, stdout, stderr and exit code. (references/feature-map-example/README.md:27)'
      - 'mutation-second-view: Require a mutation''s proof to include a read-only second view
        of the stored value. (references/feature-map-example/README.md:28)'
      - 'artifact-provenance-labels: Record the feature ID and entry point with every artifact.
        (references/feature-map-example/README.md:29)'
      - 'unreachable-path-report: Report an unreachable path with the command attempted and
        the precondition not met. (references/feature-map-example/README.md:30)'
      - 'no-substituted-entry-point: Never report a skipped entry point as verified through
        a different path. (references/feature-map-example/README.md:31)'
      - 'feature-title-and-paragraph: Start each feature file with an H1 and one paragraph
        of user-visible behavior, followed by exactly four H2s in fixed order. (references/feature-map-example/README.md:35)'
      - 'short-subfeature-ids: List sub-features as short IDs with one line per behavior.
        (references/feature-map-example/README.md:37)'
      - 'complete-entry-point-list: List every user entry point to the feature. (references/feature-map-example/README.md:38)'
      - 'action-command-result-bullets: Open the drive section with preconditions, then use
        labelled bullets that each pair a user action with an exact command and an observable
        result. (references/feature-map-example/README.md:39)'
      - 'run-invalidating-gotchas: Reserve gotchas for traps that can waste or invalidate
        a verification run. (references/feature-map-example/README.md:40)'
      - 'no-implementation-detail-in-map: Keep implementation details out of the map and name
        only user paths, stable handles, required state, commands and observable proof. (references/feature-map-example/README.md:42)'
      - 'one-line-feature-index: Link each feature from the index with one line summarizing
        what it covers. (references/feature-map-example/README.md:46-47)'
      - 'cancel-path-coverage: Include a journey showing that an abandoned action leaves no
        trace in the visible state. (references/feature-map-example/create-note.md:30)'
      - 'reopen-to-prove-persistence: Treat a save confirmation as insufficient and reopen
        the item through the list to prove it persisted. (references/feature-map-example/create-note.md:38)'
      - 'rendered-over-input-assertion: Assert the value the app rendered rather than the
        value typed, because the app may normalize input. (references/feature-map-example/create-note.md:37)'
      - 'empty-versus-unavailable-state: Distinguish a true no-results state from an unavailable
        feature and wait for the completed state before asserting it. (references/feature-map-example/search.md:33)'
      - 'negative-query-cli-assertion: Assert the exact exit code and empty output for an
        absent value on the terminal path as well. (references/feature-map-example/search.md:36)'
      - 'proof-identifies-context: Require proof artifacts to identify the app, the input
        used and the expected item. (references/feature-map-example/search.md:37)'
      - 'condition-wait-not-sleep: Wait for a concrete result element or status rather than
        a fixed sleep. (references/feature-map-example/search.md:42)'
      - 'structured-output-for-assertions: Use a machine-readable output flag for stable CLI
        assertions. (references/feature-map-example/search.md:44)'
      - 'reset-state-between-proofs: Return to the required UI state before proving the next
        case when an earlier step changed it. (references/feature-map-example/search.md:45)'
