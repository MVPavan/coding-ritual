      purpose: 'Upstream sets a writing standard for documents people read: word and sentence
        rules, four documentation modes and pull-request text. `unslop` edits a draft a person
        will read; `authoring-for-agents` writes text agents load, so its readers differ.'
      flag: null
      reason: 'Compared with unslop: it holds the most of these rules and has the same reader,
        a person. authoring-for-agents shares the plain-language source but writes for agents.'
    analysis:
      blind:
      - 'cut-idle-words: Remove every word the sentence survives without. (SKILL.md:13)'
      - 'short-everyday-words: Choose the common short word and require a longer one to earn
        its length through precision. (SKILL.md:14)'
      - 'rule-yields-to-quality: When obeying a rule worsens a sentence, rewrite it another
        way or leave it, treating mechanical compliance as failure. (SKILL.md:15)'
      - 'codebase-is-the-word-list: Use the real symbol, file, flag or command name rather
        than a synonym or description. (SKILL.md:17)'
      - 'no-invented-jargon: Use the plain words a developer would say aloud rather than coined
        terms. (SKILL.md:19)'
      - 'define-named-pattern-once: Allow a named pattern when the doc explains it at first
        use. (SKILL.md:19)'
      - 'propose-offenders-in-reply: Offer a newly found jargon term and its replacement as
        a diff in the reply rather than editing the slop-catalog skill. (SKILL.md:19)'
      - 'mix-sentence-lengths: Vary sentence lengths deliberately, with short ones for a point
        and long ones for a fact plus its condition or consequence. (SKILL.md:25)'
      - 'split-by-thought-not-length: Split a sentence carrying two thoughts and keep a long
        sentence carrying one. (SKILL.md:26)'
      - 'view-where-mode-allows: State an opinion on trade-offs where the mode permits rather
        than listing pros and cons, and stay dry in reference. (SKILL.md:27)'
      - 'specific-over-sterile: Replace vague claims with a concrete consequence. (SKILL.md:28)'
      - 'one-mode-per-document: Confine each document to one mode. (SKILL.md:32)'
      - 'two-question-mode-compass: Choose among tutorial, how-to, reference and explanation
        by asking whether content serves action or understanding and learning or work. (SKILL.md:32-37)'
      - 'compass-at-any-scale: Apply the same mode test to a whole document or a single sentence.
        (SKILL.md:39)'
      - 'tutorial-owns-learner-success: Treat the learner''s success as the author''s responsibility.
        (SKILL.md:41)'
      - 'tutorial-opens-with-build: Open a tutorial by saying what will be built rather than
        what will be learned. (SKILL.md:41)'
      - 'tutorial-visible-results: Make every tutorial step yield a visible result early and
        often. (SKILL.md:41)'
      - 'tutorial-expected-output: Tell the learner what to expect to see, such as output,
        a prompt change or a log line. (SKILL.md:41)'
      - 'tutorial-minimal-explanation: Reduce tutorial explanation to one clause and a link.
        (SKILL.md:41)'
      - 'tutorial-we-commands: Write tutorials concretely, as "we" and in commands. (SKILL.md:41)'
      - 'howto-human-problem: Frame a how-to around a person''s problem, not a machine operation.
        (SKILL.md:43)'
      - 'howto-action-only: Assume competence and leave out teaching, background and completeness,
        linking them instead. (SKILL.md:43)'
      - 'howto-allows-forks: Permit conditional branches and judgment calls in how-to steps.
        (SKILL.md:43)'
      - 'howto-task-named: Title a guide by the task, not the subject. (SKILL.md:43)'
      - 'reference-describes-only: Limit reference to description, without instruction, persuasion
        or opinion. (SKILL.md:45)'
      - 'reference-complete-no-hedge: State facts, options, limits and errors in reference
        completely, drily and without hedging. (SKILL.md:45)'
      - 'reference-mirrors-structure: Mirror the described thing''s structure so code and
        docs can be navigated together. (SKILL.md:45)'
      - 'reference-expected-placement: Put material where readers expect to find it. (SKILL.md:45)'
      - 'reference-generated-from-code: Generate reference from code where possible. (SKILL.md:45)'
      - 'explanation-bounded-standalone: Keep an explanation to one bounded topic readable
        away from the product. (SKILL.md:47)'
      - 'explanation-about-title-test: Check that each explanation title tolerates an implied
        "About" in front. (SKILL.md:47)'
      - 'explanation-why-anchor: Anchor an explanation on a real why question. (SKILL.md:47)'
      - 'explanation-gives-context: Supply design decisions, history, constraints and alternatives
        in an explanation. (SKILL.md:47)'
      - 'opinion-only-in-explanation: Allow opinion in explanation and nowhere else. (SKILL.md:47)'
      - 'split-and-link-mixed-modes: Split and link content rather than mixing modes, for
        example no tables in a tutorial or arguing in a how-to. (SKILL.md:49)'
      - 'second-person-present: Address the reader as "you" in the present tense. (SKILL.md:53)'
      - 'future-tense-only-if-later: Use "will" only for what really happens later. (SKILL.md:53)'
      - 'named-actor-active-voice: Say who does what, with passive allowed only when the actor
        is unknown or irrelevant. (SKILL.md:54)'
      - 'imperative-instructions: Write instructions as commands, state facts plainly, and
        never write "should be done". (SKILL.md:55)'
      - 'purpose-before-instruction: Put the condition or goal ahead of the instruction. (SKILL.md:56)'
      - 'common-case-first: Lead with the common case and follow with exceptions. (SKILL.md:57)'
      - 'no-buzzwords-or-figures: Sound like a knowledgeable friend and avoid buzzwords and
        figurative language. (SKILL.md:58)'
      - 'no-please-in-instructions: Omit "please" from instructions. (SKILL.md:58)'
      - 'no-minimizing-words: Never use "simply", "easy" or "quickly" in a procedure. (SKILL.md:58)'
      - 'no-preannouncing: Do not announce future support. (SKILL.md:59)'
      - 'varied-sentence-openers: Do not begin consecutive sentences with the same phrase.
        (SKILL.md:59)'
      - 'descriptive-link-text: Word links by destination title or description and never as
        "click here". (SKILL.md:60)'
      - 'context-over-outbound-link: Prefer a sentence of context on the page to a link off
        it. (SKILL.md:60)'
      - 'point-carrying-headings: Make headings state the point rather than only the topic.
        (SKILL.md:61)'
      - 'sentence-case-headings: Write headings in sentence case. (SKILL.md:61)'
      - 'heading-grammar-by-type: Use a bare verb phrase for task headings and a noun phrase
        for concept headings. (SKILL.md:61)'
      - 'heading-level-discipline: Use one h1 per page and skip no levels. (SKILL.md:61)'
      - 'list-type-by-sequence: Number sequences and bullet everything else. (SKILL.md:62)'
      - 'list-introducing-sentence: Introduce a list with a complete sentence. (SKILL.md:62)'
      - 'parallel-list-items: Keep list items grammatically parallel. (SKILL.md:62)'
      - 'code-and-ui-formatting: Put code in code font and UI elements in bold. (SKILL.md:63)'
      - 'serial-commas: Use serial commas. (SKILL.md:63)'
      - 'no-etc-state-partial: Drop "etc." and say up front when a list is partial. (SKILL.md:63)'
      - 'one-instruction-per-sentence: Allow one instruction per sentence and one thought
        per sentence elsewhere. (SKILL.md:67)'
      - 'sentence-length-ceilings: Split instructions over about 20 words and other sentences
        over about 25. (SKILL.md:68)'
      - 'warning-before-step: Put a warning or condition before the step it guards. (SKILL.md:69)'
      - 'keep-articles: Retain "the" and "a" to avoid a double reading. (SKILL.md:70)'
      - 'one-meaning-per-word: Give each word one meaning and job and keep it. (SKILL.md:71)'
      - 'one-word-per-action: Choose a single verb for each action and use it consistently.
        (SKILL.md:72)'
      - 'no-narrated-procedures: Write procedures as direct commands, never as narration or
        passive requirements. (SKILL.md:73)'
      - 'avoid-ing-forms: Avoid "-ing" words where possible. (SKILL.md:74)'
      - 'limiter-placement: Keep words such as "only" and "not" beside the word they change.
        (SKILL.md:78)'
      - 'break-noun-strings: Rewrite long noun strings as phrases with explicit relations.
        (SKILL.md:79)'
      - 'unambiguous-pronouns: Make each "it", "they" and "this" point at one obvious thing,
        repeating the noun when unsure. (SKILL.md:80)'
      - 'no-whole-clause-pointers: Never use "this" or "which" to refer to an entire clause.
        (SKILL.md:80)'
      - 'no-elided-verbs: Give every clause its own verb. (SKILL.md:81)'
      - 'keep-structure-words: Keep small structural words such as "that" and never trade
        clarity for word count. (SKILL.md:82)'
      - 'repeat-article-in-series: Repeat the article in a series when two things could read
        as one. (SKILL.md:83)'
      - 'explicit-conjunction-grouping: Show what "and" or "or" joins, using paired forms
        such as "both...and" and "if...then". (SKILL.md:84)'
      - 'periods-not-semicolons: Use periods rather than semicolons. (SKILL.md:85)'
      - 'no-em-dashes: Replace an em dash with a new sentence. (SKILL.md:85)'
      - 'complete-parentheticals: Make parenthetical text a full grammatical unit or its own
        sentence. (SKILL.md:86)'
      - 'no-parenthetical-plurals: Never form plurals with "(s)". (SKILL.md:86)'
      - 'no-slashes: Write out alternatives in words rather than using a slash or "and/or".
        (SKILL.md:87)'
      - 'one-name-per-thing: Call each thing by a single name throughout a doc. (SKILL.md:88)'
      - 'no-unchanged-churn: Do not rewrite wording for things that did not change. (SKILL.md:88)'
      - 'no-idioms-latin-metaphors: Skip idioms, colloquialisms, Latin abbreviations and metaphors.
        (SKILL.md:89)'
      - 'pr-and-commit-coverage: Apply every layer except the mode layer to PR descriptions
        and commit messages. (SKILL.md:94)'
      - 'one-minute-pr-briefing: Write a PR body as a briefing a reviewer can read in under
        a minute. (SKILL.md:94)'
      - 'link-logs-not-paste: Link swarm logs, SHA lists and metric tables rather than pasting
        them. (SKILL.md:94)'
      - 'ui-strings-out-of-scope: Exclude product UI strings and send them to the product''s
        copy guidelines. (SKILL.md:95)'
      - 'tab-indented-snippets: Indent code snippets with tabs. (SKILL.md:96)'
      - 'real-paths: Write real paths in docs. (SKILL.md:96)'
      - 'verifiable-count-claims: Make each count or tree claim true at the landing commit
        and include the command that regenerates it. (SKILL.md:96)'
