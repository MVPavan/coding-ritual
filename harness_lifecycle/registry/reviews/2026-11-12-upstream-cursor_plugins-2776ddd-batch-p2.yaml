      - 'shortest-bug-path: For each broken state rule the report gives the shortest path
        from a start, as numbered steps with the step label and the state in view words. (SKILL.md:3,
        80; scripts/passes/reach.ts:113-135; scripts/backends/report.ts:130-141)'
      - 'liveness-loop-description: For a broken temporal property the report gives the counterexample
        steps and says which states repeat forever or where the run stops forever. (scripts/backends/report.ts:29-37,
        133-140)'
      - 'break-marks: A chart state where every underlying model state breaks a rule is marked
        as breaking; one where only some do is marked as may-break. (SKILL.md:64; scripts/backends/mermaid.ts:141-144;
        scripts/passes/regions.ts:117-126)'
      - 'region-combination-marks: In a regions chart a state is marked when every region
        combination containing it can break a rule, and when a breaking combination has no
        marked state, all its states are marked. (SKILL.md:64; scripts/passes/regions.ts:66-74,
        270-278)'
      - 'path-and-repeat-classes: States on a shortest bug path and states a temporal counterexample
        repeats forever carry their own classes. (scripts/backends/mermaid.ts:145; scripts/passes/regions.ts:45-50)'
      - 'legend-of-marks: The chart carries a legend naming the phase colours and, per mark,
        the rules it stands for. (SKILL.md:64; scripts/backends/mermaid.ts:174-193)'
      - 'per-state-rule-attribution: When one mark covers two rules, the hand-off says which
        state breaks which rule. (SKILL.md:64)'
      - 'post-violation-states-shown: Because the checker explores past a violation, the chart
        shows states reached after a bug. (SKILL.md:65)'
      - 'dead-end-deadlock-marking: Without constraints, every state with no outgoing step
        is marked as breaking the deadlock rule; under constraints or a stopped drawing run
        only the reported deadlock is marked, and the report says why. (scripts/run.ts:438-445;
        scripts/passes/annotate.ts:57-61; scripts/backends/report.ts:110-121)'
      - 'constraint-boundary-states: When a rule''s shortest path ends in a state beyond a
        constraint, or with a step an action constraint excludes, the chart draws that state
        or step and the report counts them; other states past the bound are not drawn. (SKILL.md:68;
        scripts/passes/annotate.ts:63-96; scripts/backends/report.ts:98-105)'
      - 'representative-state-note: With VIEW or SYMMETRY, the report warns that an arrow
        may lead to the representative state, not the state the step reached. (SKILL.md:67;
        scripts/backends/report.ts:124-129)'
      - 'graph-size-summary: The report opens with the states and steps the checker reached
        and the states and arrows the chart draws. (scripts/backends/report.ts:81-87)'
      - 'empty-model-diagnosis: When no state is explored, the report says whether no state
        satisfies the initial predicate or every initial state lies outside the constraints.
        (scripts/backends/report.ts:92-97)'
      - 'partial-drawing-note: When the graph-dump run stops early, the report says the chart
        covers only the states reached before it stopped. (scripts/backends/report.ts:88-91)'
      - 'holds-list: The report lists the rules that hold. (scripts/backends/report.ts:156)'
      - 'checker-stopped-section: When a run stopped on an error, the report says which rules
        it left unchecked and quotes the error. (scripts/backends/report.ts:162-170)'
      - 'chart-state-budget: The full chart is drawn only up to 500 states; above that only
        the bug paths are drawn, and with no break no chart file is written, while every rule
        is still checked and the report gives counts and bug paths. (SKILL.md:74; scripts/run.ts:412-477;
        scripts/pipeline.ts:61-67; scripts/backends/report.ts:84-85)'
      - 'mermaid-codeblock-display: The agent shows the chart file to the user as a Mermaid
        code block. (SKILL.md:74)'
      - 'mermaid-safe-label-escaping: The tool encodes label and title text so any characters
        render safely in Mermaid. (scripts/backends/mermaid.ts:3-92, 184)'
      - 'concurrent-regions-rendering: A regions chart is drawn left to right as one composite
        of parallel regions, with the title as diagram frontmatter. (scripts/backends/mermaid.ts:163-187)'
      - 'portable-mark-styles: The chart file defines styles only for the break and may-break
        marks, so any Mermaid viewer shows them. (scripts/backends/mermaid.ts:96-99, 195-196;
        references/render.md:9)'
      - 'designated-renderer: Charts are rendered with one named renderer (Pele) only, unless
        the user asks for another, and only when the user wants an image or the text is too
        large. (SKILL.md:76)'
      - 'pinned-renderer-version: The renderer package is pinned to an exact version, installed
        once outside the repo. (references/render.md:3)'
      - 'svg-beside-source: Each SVG is written next to its chart file with the same name
        and given to the user. (references/render.md:3)'
      - 'raised-render-limits: The render call passes raised node, output and edge limits
        so a 500-state chart fits. (references/render.md:3)'
      - 'render-error-fallback: On a renderer error the agent shows the Mermaid text and the
        error. (references/render.md:3)'
      - 'css-variable-theming: Colours are set through the renderer''s CSS variables and class
        rules, since it ignores Mermaid theme settings. (references/render.md:7)'
      - 'mark-rules-override-order: Mark colour rules use `!important` and come after group
        colours so marks show over phase colours and survive dark mode. (references/render.md:9)'
      - 'embedded-light-dark-stylesheet: A suggested light and dark palette is put in a style
        element at the start of each SVG so it follows the viewer''s colour scheme. (references/render.md:11-93)'
      - 'chart-to-decider: Each chart and its Mermaid text go to the person who decides whether
        the behaviour is right. (SKILL.md:9, 80)'
      - 'one-line-per-bug: The hand-off gives one line per bug: the rule, the reader''s sentence
        for it, and the path as the report numbers it. (SKILL.md:80)'
      - 'state-model-omissions: The hand-off says what the model leaves out. (SKILL.md:80)'
      - 'regeneration-command: The hand-off gives the command that regenerates the files,
        with a new output folder. (SKILL.md:80)'
      - 'replay-against-code: When the model describes code, each bug path is replayed against
        the real code as a test or live repro, one step per action. (SKILL.md:82)'
      - 'model-guilty-until-shown: A bug that does not reproduce is presumed a model error
        until shown otherwise. (SKILL.md:82)'
