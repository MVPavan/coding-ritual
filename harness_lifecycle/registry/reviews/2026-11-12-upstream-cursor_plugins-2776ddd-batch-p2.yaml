    analysis:
      blind:
      - 'inherit-catch-up-rules: Follow the text catch-up procedure in full, replacing its
        summary and visuals with a short subtitled video. (SKILL.md:9)'
      - 'window-ignores-prior-catch-up: The window starts at the user''s last message before
        this command, not before an earlier text catch-up. (SKILL.md:9)'
      - 'render-exception-to-read-only: Writing and rendering the video outside the repository
        is the one allowed exception to the read-only rule. (SKILL.md:9)'
      - 'fixed-reply-composition: The reply is the opening sentence, the embedded video, one
        line of remaining own work, and the action items. (SKILL.md:9)'
      - 'consistent-option-names: When the video shows a call''s options, the text names each
        option as the video does. (SKILL.md:9)'
      - 'render-failure-fallback: If rendering fails, say so in one line and give only the
        calls. (SKILL.md:9)'
      - 'primary-artifact-sources: Build slides from produced screenshots, recordings, diffs
        and data, not from chat prose about them. (SKILL.md:13)'
      - 'pre-render-storyline: Before drawing, write the one sentence the user should leave
        with and one line per slide, kept out of the reply. (SKILL.md:13)'
      - 'drop-uninformative-slides: Drop any slide that does not change what the user knows.
        (SKILL.md:13)'
      - 'slide-count-cap: At most 10 slides, fewer preferred. (SKILL.md:13)'
      - 'one-point-per-slide: Each slide makes one point. (SKILL.md:15)'
      - 'evolving-base-picture: Slides evolve one picture from slide to slide rather than
        cutting to unrelated ones. (SKILL.md:15)'
      - 'consistent-visual-encoding: A colour or shape means the same thing on every slide.
        (SKILL.md:15)'
      - 'pictorial-work: Show the work as pictures such as how a system works, a PR stack
        with states, a before/after, or options side by side. (SKILL.md:15)'
      - 'point-at-change: Direct attention to what changed with arrows, highlights and motion.
        (SKILL.md:15)'
      - 'banned-slide-kinds: A slide is never a bullet list, status list, table or unconnected
        boxes. (SKILL.md:15)'
      - 'minimal-on-object-labels: Keep text minimal and put each plain-word label on the
        thing it names, not as a tag. (SKILL.md:17)'
      - 'no-captions-no-repeats: Never caption what a picture shows, and never give a fact
        twice across slides or the text below. (SKILL.md:17)'
      - 'per-request-status-in-video: Show what came of each user request and its status,
        never showing as done something still waiting on the user. (SKILL.md:19)'
      - 'show-incidental-fixes: Show any bug found and fixed on the way. (SKILL.md:19)'
      - 'missing-screenshot-slide-note: When a visible change has no screenshot, say so on
        its slide and name what changed on screen. (SKILL.md:19)'
      - 'facts-only-slides: Draw only from facts in hand; never invent a number or draw a
        screen not captured. (SKILL.md:19)'
      - 'one-subtitle-per-slide: Each slide gets one subtitle line of about ten words stating
        its point as one would tell the user, using only what that slide shows, interpreting
        rather than reading labels. (SKILL.md:23)'
      - 'dedicated-subtitle-strip: Subtitles sit in a fixed-height strip below the slide,
        empty except for the subtitle, never covering the slide, small but readable at chat
        size. (SKILL.md:23)'
      - 'silent-landscape-video: Render one silent landscape video file with motion between
        slides. (SKILL.md:27)'
      - 'frames-from-slides: Frames are the slides themselves edge to edge above the strip,
        made from the slides, never from a screen recording. (SKILL.md:27)'
      - 'burned-in-subtitles: Each subtitle is burned into its slide''s frames for the slide''s
        whole hold. (SKILL.md:27)'
      - 'reading-time-hold: Hold each slide fully on screen at least one second per three
        newly added words, counting the subtitle, new or changed labels, all words on the
        first slide, and not words inside screenshots. (SKILL.md:27)'
      - 'frame-legibility-check: Before embedding, inspect one frame per slide at chat size
        to confirm the subtitle is readable and covers nothing. (SKILL.md:29)'
      - 'measured-hold-check: Measure each hold by matching file frames to the slide, not
        with a still-frame detector, and compare it with the slide''s added word count. (SKILL.md:29)'
      - 'fix-rerender-recheck-loop: Fix any slide that cannot be read in its hold, render
        again and check again. (SKILL.md:29)'
