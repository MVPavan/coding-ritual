      purpose: Upstream runs several candidates at one task, picks a base and grafts the best
        of the rest into one artifact. Ours runs independent members and a judge to reach
        an answer; a branch that turns candidates into one artifact belongs there, since it
        keeps the judge and the isolation.
      flag: suggested differs
      reason: 'Compared with model-council: the only unit of ours with independent members
        and a judge, as playbook-map §3 row 17 records. Suggested delegation by the computed
        signals only.'
    analysis:
      blind:
      - 'phase-checklist-before-launch: Create a tracked to-do list with one item for each
        of the six phases before starting any work. (SKILL.md:9)'
      - 'identical-candidate-prompt: Give all candidates the same prompt, which acts as the
        binding definition of the job. (SKILL.md:13)'
      - 'explicit-artifact-statement: Say exactly what artifact each candidate must produce
        before any candidate starts. (SKILL.md:15)'
      - 'task-specific-rubric: Write three to six concrete, gradeable success criteria tailored
        to this particular task. (SKILL.md:16)'
      - 'rubric-withheld-from-candidates: Keep the rubric for selection and show candidates
        only the task. (SKILL.md:16)'
      - 'runner-list-from-configuration: Choose candidate models from a dedicated line in
        a user-level model configuration rule. (SKILL.md:17)'
      - 'default-runner-pair: When that rule or line is absent, run one candidate on `claude-opus-5-5-xhigh`
        and one on `grok-4.7-xhigh-fast`. (SKILL.md:17)'
      - 'parent-model-alias: Treat an `auto` or `inherit-parent` runner entry as the parent''s
        model and leave the model field unset for that seat. (SKILL.md:17)'
      - 'rejected-runner-family-default: When the spawning tool rejects a configured runner,
        run that seat on its family''s default model and disclose the substitution. (SKILL.md:17)'
      - 'model-family-prefix-map: Classify models into families by name prefix, with `claude-*`
        as one family and `grok-*`, `cursor-grok-*` and `composer-*` as another. (SKILL.md:17)'
      - 'composer-refusal-substitute: When a `composer-*` entry is refused, run that seat
        on `grok-4.7-xhigh-fast`. (SKILL.md:17)'
      - 'error-message-slug-recovery: When a family has no default or its default is rejected,
        use the closest same-family model name offered by the error message. (SKILL.md:17)'
      - 'unrunnable-seat-drop: When no valid same-family model name exists, remove the seat
        and disclose that. (SKILL.md:17)'
      - 'minimum-runner-backfill: When dropped seats leave fewer than two runners, add runners
        up to two, or up to one when the configured line has a single entry. (SKILL.md:17)'
      - 'backfill-model-choice: Run each added runner on a surviving runner''s model, or on
        the parent''s model when none survive, and disclose the choice. (SKILL.md:17)'
      - 'extra-runners-per-design-direction: Add more candidates when the arena must explore
        several design directions. (SKILL.md:17)'
      - 'repeated-model-for-generation-work: Use one model for every seat when output is limited
        by generation rather than judgment. (SKILL.md:17)'
      - 'per-subagent-effort-and-speed: Choose each subagent''s reasoning level and its fast
        or standard speed according to the job. (SKILL.md:17)'
      - 'isolated-candidate-output: Assign every candidate a separate output location so they
        share no writable state. (SKILL.md:18)'
      - 'worktree-first-output-location: Prefer a git worktree for each candidate, and fall
        back to a per-candidate directory under a temporary arena path. (SKILL.md:18)'
      - 'same-message-background-fan-out: Launch all candidates in one message as background
        subagents. (SKILL.md:22)'
      - 'candidate-brief-contents: Hand each candidate the task, the shared grounding''s path
        and its own output path. (SKILL.md:22)'
      - 'candidate-rationale-with-alternatives: Require each candidate to deliver a short
        rationale naming the alternatives it weighed and what it rejected, alongside the artifact.
        (SKILL.md:22)'
      - 'candidate-dropout-tolerance: Continue with the remaining candidates when one produces
        nothing, and record the dropout. (SKILL.md:24)'
      - 'judge-after-candidates-finish: Start the cross-judge only once all candidates have
        completed. (SKILL.md:28)'
      - 'judge-pool-from-configuration: Choose the judge''s model from a dedicated pool line
        in the user-level model configuration rule. (SKILL.md:28)'
      - 'default-judge-pool: When that rule or line is absent, choose the judge from `claude-opus-5-5-xhigh`
        and `grok-4.7-xhigh-fast`. (SKILL.md:28)'
      - 'single-readonly-judge: Spawn exactly one judge subagent, and give it read-only access.
        (SKILL.md:28)'
      - 'judge-outside-parent-family: Never let the judge''s model belong to the same family
        as the parent''s model. (SKILL.md:28)'
      - 'judge-pool-order-trial: Try only other-family pool entries, in the order the pool
        lists them. (SKILL.md:28)'
      - 'parent-alias-never-judges: Exclude `auto` and `inherit-parent` pool entries from
        judging, because they resolve to the parent''s model. (SKILL.md:28)'
      - 'default-pool-judge-by-parent: With the default pool, a Claude parent gets `grok-4.7-xhigh-fast`,
        and any other parent tries `claude-opus-5-5-xhigh` first. (SKILL.md:28)'
      - 'rejected-judge-slug-recovery: When a judge entry is rejected, use the same model
        at the nearest level or speed named in the error, or move to the next entry when none
        is offered. (SKILL.md:28)'
      - 'judge-default-pool-fallback: When no configured other-family entry runs, try the
        default pool''s other-family entries in the same way. (SKILL.md:28)'
      - 'judge-skip-with-disclosure: When no judge can run, skip the judge, pick the base
        alone and say so. (SKILL.md:28)'
      - 'unknown-parent-judge-handling: When the parent''s model is unknown, try the pool''s
        real model names in order and disclose that the family check did not run. (SKILL.md:28)'
      - 'judge-sees-path-labelled-candidates: Give the judge the rubric and the candidates
        identified only by path label. (SKILL.md:28)'
      - 'judge-per-criterion-scoring: Require the judge to score each candidate on each rubric
        criterion. (SKILL.md:28)'
      - 'judge-base-recommendation: Require the judge to recommend a base and justify that
        recommendation. (SKILL.md:28)'
      - 'judge-parallel-with-picker: Run the judge at the same time as the picker''s own reading
        rather than before or after it. (SKILL.md:28)'
      - 'full-read-before-pick: Read every candidate completely before choosing a base. (SKILL.md:32)'
      - 'picker-per-criterion-scoring: Score each candidate against each rubric criterion
        instead of relying on overall impression. (SKILL.md:32)'
      - 'compare-pick-with-judge: Compare the picker''s result with the judge''s when a judge
        ran, and treat a shared choice as confirmation. (SKILL.md:32)'
      - 'disagreement-signals-bias-or-ambiguity: Treat a picker-judge disagreement as evidence
        of bias or an unclear rubric, and read both rationales before deciding. (SKILL.md:32)'
      - 'base-chosen-for-extensibility: Select the base that a later maintainer could extend
        most easily while keeping invariants intact. (SKILL.md:34)'
      - 'tie-break-boundary-and-api: Break a near-tie in favor of the cleaner boundary or
        the smaller API. (SKILL.md:34)'
      - 'loser-review-pass: Go through each losing candidate one further time looking for
        parts worth porting. (SKILL.md:38)'
      - 'sparse-graft-expectation: Expect only one or two grafts from a losing candidate,
        not the bulk of it. (SKILL.md:38)'
      - 'hand-integrated-grafts: Rewrite each graft into the base by hand so the result keeps
        one coherent design rather than pasted fragments. (SKILL.md:38)'
      - 'convergence-ships-without-graft: When candidates arrive at one shape, record the
        agreement and ship that shape with no grafting. (SKILL.md:40)'
      - 'divergence-triggers-reframe: When candidates differ wildly, treat the framing as
        under-specified, then reframe and rerun instead of blending them. (SKILL.md:40)'
      - 'verify-synthesized-artifact: Verify the merged result to the same standard as any
        other output. (SKILL.md:44)'
      - 'verification-failure-reframe-route: When verification finds a problem caused by bad
        framing, reframe and rerun the arena. (SKILL.md:44)'
      - 'verification-failure-graft-route: When verification finds a problem some candidate
        had caught, return to grafting for the missed part. (SKILL.md:44)'
      - 'no-papering-over-failures: Forbid hiding a verification problem instead of routing
        it back to an earlier phase. (SKILL.md:44)'
      - 'single-synthesized-output: End with one merged artifact rather than a set of alternatives.
        (SKILL.md:48)'
      - 'synthesis-note-base-reason: Attach a short note naming the chosen base and why it
        was chosen. (SKILL.md:48)'
      - 'synthesis-note-judge-status: Record in the note the judge''s verdict or the fact
        that the judge was skipped. (SKILL.md:48)'
      - 'graft-provenance-record: List each graft in the note with the candidate it came from.
        (SKILL.md:48)'
      - 'rejection-record: Record in the note what was rejected and the reason. (SKILL.md:48)'
      - 'convergence-and-dropout-record: Record in the note any convergence or candidate dropouts.
        (SKILL.md:48)'
      - 'verification-result-record: Record the verification result in the note. (SKILL.md:48)'
