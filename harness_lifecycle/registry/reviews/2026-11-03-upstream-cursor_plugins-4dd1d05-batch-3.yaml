themes: These rows serve two capabilities. model-council gains a branch that turns independent
  candidates into one artifact, scored against criteria, picked and grafted, and delegation
  keeps model choice and dispatch. A new skill, interrogate, sends adversaries to break a
  change or design and keeps only a finding a run proves.
