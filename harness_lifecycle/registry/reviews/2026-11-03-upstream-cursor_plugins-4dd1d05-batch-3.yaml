  skill:pstack/skills/interrogate:
    upstream_tree_hash: 45b67702b12e70485937b5efb0f1217d198ee2bbc8393b70877a3fb496102bdd
    accepted: null
    compared_with: none
    pairing:
      overlap:
        doc:AGENTS.md: 1
      placement_match:
      - review
      suggested: review
      purpose_match: none
      purpose: Upstream sends adversaries to break a change or design and keeps only findings
        a run proves. Ours has no unit for this until interrogate is built; review judges
        by reading and reports every finding.
      flag: suggested differs
      reason: 'Compared with none: interrogate, the row target, does not exist yet, and --with
        takes only an existing skill. Suggested review by the computed signals only.'
    analysis:
      blind:
      - 'adversarial-break-mandate: Assign adversaries to attempt to break a change or design
        rather than to assess it in general. (SKILL.md:9)'
      - 'run-proof-survival-gate: Let a finding stand only when an executed run demonstrates
        it. (SKILL.md:9)'
      - 'report-only-no-fixes: Limit the result to reporting findings, with no fixes applied.
        (SKILL.md:9)'
      - 'user-named-scope: Use the scope the user names when one is given. (SKILL.md:13)'
      - 'default-branch-diff-scope: Without a named scope, cover the branch''s diff from its
        merge base with the base branch up to and including the working tree. (SKILL.md:13)'
      - 'intent-restatement: Restate the change''s intent in the agent''s own words before
        fanning out. (SKILL.md:13)'
      - 'intent-evidence-sources: Derive that intent from the user''s message, the commits
        and the pull request description. (SKILL.md:13)'
      - 'ask-when-intent-unclear: Ask the user when the intent cannot be established. (SKILL.md:13)'
      - 'reviewer-list-from-configuration: Choose adversary models from a dedicated reviewer
        line in the user-level model configuration rule, using the sibling skill''s runner-selection
        and fallback steps. (SKILL.md:17)'
      - 'isolated-adversary-worktrees: Give each adversary its own output location through
        the sibling skill''s worktree-first step. (SKILL.md:17)'
      - 'same-message-background-adversaries: Launch all adversaries in one message as background
        subagents through the sibling skill''s fan-out step. (SKILL.md:17)'
      - 'adversary-dropout-tolerance: Continue when an adversary produces nothing and record
        the dropout, through the sibling skill''s fan-out step. (SKILL.md:17)'
      - 'uncommitted-changes-seeded: Copy the scope''s uncommitted changes into each adversary''s
        worktree. (SKILL.md:17)'
      - 'general-purpose-adversary-type: Spawn each adversary as the general-purpose subagent
        type. (SKILL.md:17)'
      - 'adversary-brief-contents: Give each adversary the scope, the intent and one fixed
        brief in place of a task and rationale request. (SKILL.md:17)'
      - 'proof-against-real-code: Require each finding to be shown by a run against the actual
        code, such as a failing test, a reproduction script or revealing command output. (SKILL.md:19)'
      - 'design-review-by-prototype-or-probe: For a design or plan, prove findings by running
        a prototype or probing the current tree. (SKILL.md:19)'
      - 'repros-confined-to-own-worktree: Keep reproduction material inside the adversary''s
        own worktree. (SKILL.md:19)'
      - 'finding-report-template: Require each finding to carry a title, the exact command,
        the printed output and the output the intent demands. (SKILL.md:19)'
      - 'exclude-unrun-claims: Omit anything the adversary did not actually run. (SKILL.md:19)'
      - 'exclude-style-and-speculative-risk: Exclude style, naming, structure and hazards
        that only matter after a future change. (SKILL.md:19)'
      - 'empty-result-permitted: Accept a report with no findings as a legitimate outcome.
        (SKILL.md:19)'
      - 'coordinator-reruns-commands: Have the coordinator verify each finding by executing
        its command again. (SKILL.md:23)'
      - 'two-part-keep-test: Retain a finding only if the output shows the failure and that
        failure violates the intent. (SKILL.md:23)'
      - 'drop-unverified-findings: Remove every finding that fails the keep test. (SKILL.md:23)'
      - 'root-cause-merge: Combine findings that share one root cause. (SKILL.md:23)'
      - 'no-judge-pick-or-graft: Omit cross-judging, base selection and grafting from this
        flow. (SKILL.md:25)'
      - 'union-of-verified-findings: Keep all verified findings across adversaries rather
        than selecting one adversary''s list. (SKILL.md:25)'
      - 'output-intent-section: Open the output with the intent restatement. (SKILL.md:29)'
      - 'output-finding-fields: For each verified finding, report its command, its output
        and how it violates the intent. (SKILL.md:30)'
      - 'adversary-attribution: Name the adversaries that found each verified finding. (SKILL.md:30)'
      - 'explicit-no-findings-statement: State explicitly that there are no verified findings
        when none remain. (SKILL.md:30)'
      - 'dropped-finding-accounting: Report per adversary how many findings were dropped and
        why. (SKILL.md:31)'
      mapping:
      - line: 1
        to:
        - break-it-mandate
        mark: new
      - line: 2
        to:
