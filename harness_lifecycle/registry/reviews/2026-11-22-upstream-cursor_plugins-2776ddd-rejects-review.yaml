themes: 'Sixteen pstack rows the owner reopened in the rejections re-review. Owner ruling
  2026-11-22 (conversation), rejections re-review, bead cr-r2pa.3.3. The pull-request playbooks
  built on 2026-11-20 (Babysit, Shipping) and the planned Autopilot-full removed the premise
  of most of these rejects, that we run no pull-request flow. Twelve are adopted, pending
  their delivering beads: an owner-held write list in AGENTS.md (cr-r2pa.3.6); the merged-state
  signal, a fetched base and push state in worktree-cleanup (cr-r2pa.3.9); text Babysit and
  Shipping post routed through unslop, with full pull-request links (cr-r2pa.3.10); count
  claims with their command in pr (cr-r2pa.3.13); one reviewer verdict vocabulary in delegation
  (cr-r2pa.3.14); a reproduction budget in systematic-debugging (cr-r2pa.3.15); and a duplicate-search
  key list and an issue template in triage (cr-r2pa.3.8). Four stay rejected with current
  reasons: per-feature pull requests with no draft step (decision bead cr-0qcj) and Visual
  parity''s pass predicate now carry what they asked for.'
