themes: 'These rows serve two aims. A worker''s brief reaches it intact and running workers
  can be told apart (two adopts into `delegation`). Git safety stays enforced: our guard hook
  already holds most of the upstream rules, and the one place it falls short, git options
  before the subcommand, is closed by a fix of the hook itself, which is not a registry unit.
  The rest is rejected: co-writing with a person, conversation handoff, commit-time checks
  and TypeScript test data have no place among ours, and the course scaffold is out of scope.'
