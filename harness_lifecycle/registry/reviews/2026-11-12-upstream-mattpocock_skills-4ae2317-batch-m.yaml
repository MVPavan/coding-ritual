  skill:skills/in-progress/writing-shape:
    upstream_tree_hash: 7e06f4ca8a96c83b5b9a540c0279e998ba449e74586c77d44f9b8183c1bd8ef8
    accepted: null
    compared_with: none
    pairing:
      overlap: {}
      placement_match:
      - brief-me
      - html-artifact
      - show-me
      - unslop
      suggested: brief-me
      purpose_match: none
      purpose: Upstream turns a pile of material into an article with its author, block by
        block. Nothing of ours shapes a person's article; `unslop` edits finished text.
      flag: suggested differs
      reason: 'Compared with none: no unit of ours shapes an article with its author; `brief-me`
        matches only by its place in the lifecycle. Suggested brief-me by the computed signals
        only.'
    analysis:
      blind:
      - 'any-format-input-pile: Accept raw material in any form (fragments, prose, transcript)
        as the source (SKILL.md:9).'
      - 'read-pile-fully-first: Read the whole input end to end before anything else (SKILL.md:9,
        21).'
      - 'separate-output-document: Produce the article in a different file from the input
        (SKILL.md:11).'
      - 'source-file-read-only: Never edit the raw-material file (SKILL.md:11, 76).'
      - 'ask-output-path-once: If no save location was given, ask once and remember it (SKILL.md:13).'
      - 'settle-prerequisites-first: Agree on the concepts the reader brings before writing
        (SKILL.md:22).'
      - 'grounding-gate: No block may lean on an ungrounded concept; the unit is the idea,
        and a named concept is grounded with its term (SKILL.md:22, 30-35).'
      - 'running-grounded-list: Keep a list of grounded concepts as the article grows (SKILL.md:37).'
      - 'ungrounded-need-is-next-move: When the next move needs an ungrounded concept, grounding
        it becomes the next step (SKILL.md:37).'
      - 'prerequisite-balance-lever: Balance upfront demands against in-article definitions,
        settled with the user (SKILL.md:39).'
      - 'candidate-openings-distinct-theses: Draft two or three openings each implying a different
        thesis, show all, and make the user pick or build a hybrid (SKILL.md:23).'
      - 'opening-defines-obligations: The chosen opening sets what the rest of the article
        must deliver (SKILL.md:23).'
      - 'reader-needs-next-question: Grow the article by asking what the reader must hear
        next given what is written (SKILL.md:24).'
      - 'deliberate-block-format: Argue the form of each block (paragraph, list, table, callout,
        quote, code) so each choice is defensible (SKILL.md:24).'
      - 'append-each-agreed-block: Write each agreed block to the file immediately, not in
        batches (SKILL.md:25, 71).'
      - 'user-decides-done: The user, not the agent, says when the article is finished (SKILL.md:26).'
      - 'adversarial-editor-stance: Push back, refuse weak transitions, and cut paragraphs
        that do not earn their place (SKILL.md:43).'
      - 'standing-challenge-questions: Keep asking what each paragraph adds, what breaks if
        cut, prose versus list, split double-duty sentences, and whether the article drifted
        from its opening''s promise (SKILL.md:45-51).'
      - 'pile-as-quarry-one-voice: Rework, split, merge or paraphrase pile material so the
        article reads as one voice (SKILL.md:55).'
      - 'name-material-gaps: When the pile lacks something needed, say so and ask the user
        to supply it now or cut the section (SKILL.md:57).'
      - 'prose-vs-list-rule: Use prose for argument and lists only for truly parallel items
        (SKILL.md:63).'
      - 'callout-only-if-derailing: Put tips and warnings in callouts only when inline they
        would derail the argument (SKILL.md:64).'
      - 'table-at-three-repeats: Use a table when the same field shape repeats three or more
        times, otherwise prose with bold leads (SKILL.md:65).'
      - 'quote-when-wording-matters: Quote when exact wording is the point, paraphrase otherwise
        (SKILL.md:66).'
      - 'code-block-vs-inline-rule: Multi-line, runnable or illustrative code goes in a block;
        single tokens inline (SKILL.md:67).'
      - 'format-tradeoffs-out-loud: Discuss format tradeoffs with the user rather than deciding
        silently (SKILL.md:61).'
      - 'reread-before-every-write: Re-read the article before every write and never overwrite
        blindly (SKILL.md:71).'
      - 'targeted-paragraph-rewrite: Rewrite only the requested paragraph in place (SKILL.md:71).'
      - 'no-new-material-mining: Gathering new fragments outside the pile is out of scope;
        gaps are named instead (SKILL.md:75).'
      - 'no-publishing-or-unrequested-frontmatter: Platform formatting, publishing and unrequested
        frontmatter are out of scope (SKILL.md:77).'
