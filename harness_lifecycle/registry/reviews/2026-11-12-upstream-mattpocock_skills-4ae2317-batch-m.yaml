        pile of material. Nothing of ours writes for a human reader with them; `unslop` edits
        a finished text.
      flag: suggested differs
      reason: 'Compared with none: no unit of ours co-writes an article; `brief-me` sits at
        the same place in the lifecycle but briefs a person on work, with no shared trait.
        Suggested brief-me by the computed signals only.'
    analysis:
      blind:
      - 'fixed-pile-exploit-mode: Treat the supplied raw-material file as fixed; the job is
        to commit to a path through it, not to gather more (SKILL.md:9).'
      - 'ask-output-path-once: If no save location was given, ask once and remember it (SKILL.md:11).'
      - 'settle-prerequisites-first: Before any beat, agree with the user which concepts the
        audience already holds (SKILL.md:15).'
      - 'grounding-gate: No beat may rely on a concept not yet grounded, either as a prerequisite
        or by an earlier beat; the unit is the idea, not just its jargon (SKILL.md:15, 27).'
      - 'term-and-idea-land-together: Grounding a named concept means introducing the idea
        and its name together (SKILL.md:27).'
      - 'running-grounded-list: Keep an updated list of grounded concepts, refreshed after
        each beat lands (SKILL.md:34).'
      - 'candidate-openings-two-to-three: Offer two or three distinct opening beats drawn
        from the pile, each noting what it grounds (SKILL.md:16).'
      - 'show-before-write: Show candidate beats to the user before anything goes into the
        article file; the user picks (SKILL.md:16).'
      - 'preview-unlocked-paths: After a pick, preview which beats it unlocks a short way
        ahead (SKILL.md:16).'
      - 'write-only-the-chosen-beat: Write just the selected beat, then stop (SKILL.md:17).'
      - 'reread-before-offering-next: Re-read the article from disk before proposing next
        beats (SKILL.md:18).'
      - 'reachable-next-candidates: Offer two or three next beats, each reachable from the
        current grounded set and labelled with what it grounds (SKILL.md:18, 36).'
      - 'loop-to-natural-end: Repeat write/re-read/offer until the article reaches a natural
        ending (SKILL.md:19).'
      - 'ungrounded-beat-repair: When a desired beat needs an ungrounded concept, either insert
        a grounding beat before it or promote the concept to a prerequisite, revisited with
        the user (SKILL.md:38).'
      - 'prerequisite-balance-lever: Weigh how much to demand upfront against how much to
        define inside the piece, settled with the user (SKILL.md:38).'
      - 'one-move-per-beat: A beat does a single move (scene, point, question, aside, twist)
        and stops at a pivot point (SKILL.md:42).'
      - 'beat-sized-by-need: A beat is as long as its move requires, from one sentence to
        several paragraphs (SKILL.md:44-48).'
      - 'split-oversized-beat: A beat needing many paragraphs and subheadings is two beats
        and must be split (SKILL.md:50).'
      - 'pile-as-quarry: Paraphrase, split, recombine or quote pile material freely (SKILL.md:54).'
      - 'end-on-journey-not-pile: Stop when the journey is complete even if material is left
        over (SKILL.md:58).'
      - 'append-one-beat-never-ahead: Add one beat at a time and never draft ahead (SKILL.md:62).'
      - 'reread-before-every-write-preserve-edits: Re-read the file before each write and
        keep the user''s edits absolutely (SKILL.md:63).'
      - 'user-edits-steer-direction: A substantial user edit to an earlier beat may change
        what comes next (SKILL.md:64).'
      - 'targeted-beat-rewrite: On request to redo a specific beat, edit it in place and leave
        the rest alone (SKILL.md:65).'
