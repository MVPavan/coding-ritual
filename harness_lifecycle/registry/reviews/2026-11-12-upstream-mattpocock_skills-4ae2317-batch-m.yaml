      overlap:
        doc:.repo-context/verification.md: 1
      placement_match: []
      suggested: null
      purpose_match: none
      purpose: Upstream installs a hook that blocks dangerous git commands. Ours already ships
        such a hook as project configuration; a hook is not a skill and cannot be compared.
      flag: null
      reason: 'Compared with none: our equivalent is a hook, outside the registry''s skill
        comparison.'
    analysis:
      blind:
      - 'pre-tool-command-hook: Install a hook that inspects shell commands before execution
        and blocks dangerous git ones (SKILL.md:8).'
      - 'blocked-command-list: The blocked set is pushes of any kind, hard resets, forced
        cleans, forced branch deletion, and whole-tree checkout or restore (SKILL.md:10-16).'
      - 'no-authority-message: A blocked agent is told it lacks authority to run that command
        (SKILL.md:18).'
      - 'ask-install-scope: Ask whether to install for this project or for all projects (SKILL.md:22-24).'
      - 'copy-script-by-scope: Copy the bundled script into a project or user hooks folder
        per the chosen scope (SKILL.md:26-33).'
      - 'make-script-executable: Mark the copied script executable (SKILL.md:35).'
      - 'settings-hook-registration-template: Register the script as a command hook on the
        shell tool in the matching settings file, using a project-dir variable for project
        scope and a home path for global (SKILL.md:37-79).'
      - 'merge-not-overwrite-settings: Merge into an existing hook array without disturbing
        other settings (SKILL.md:81).'
      - 'offer-pattern-customization: Ask whether to add or remove blocked patterns, and edit
        the copied script accordingly (SKILL.md:83-85).'
      - 'pipe-test-verification: Verify by piping a sample push command as hook input and
        expecting exit code 2 with a blocked message on stderr (SKILL.md:87-95).'
      - 'reads-hook-json-from-stdin: Reads the hook payload from standard input and extracts
        the command field with a JSON tool, which is therefore required (block-dangerous-git.sh:3-4).'
      - 'regex-pattern-blocklist: Holds nine extended-regex patterns: push, hard reset, forced
        clean (two forms), forced branch delete, checkout-dot, restore-dot, plus bare "push
        --force" and "reset --hard" fragments that also catch git invocations with options
        before the subcommand (block-dangerous-git.sh:6-16).'
      - 'substring-match-anywhere: A pattern matching anywhere in the command string blocks
        it, so the pattern inside a longer command or quoted text also triggers (block-dangerous-git.sh:18-19).'
      - 'block-with-exit-2-and-stderr-reason: On a match, prints to stderr a message naming
        the command and the matched pattern and saying the user prevented it, then exits 2
        (block-dangerous-git.sh:20-21).'
      - 'first-match-stops: Stops checking at the first matching pattern (block-dangerous-git.sh:18-23).'
      - 'allow-by-default: Any command matching no pattern exits 0 and is allowed (block-dangerous-git.sh:25).'
