    analysis:
      blind:
      - Identify which question the prototype answers, logic/state or UI look, before choosing
        its form. (SKILL.md:12-15)
      - If ambiguous and the user is unreachable, default the branch by surrounding code and
        state the assumption at the top. (SKILL.md:17)
      - Place prototype code near its eventual use but name it visibly as a prototype, following
        existing routing conventions. (SKILL.md:21, UI.md:28)
      - Make the prototype start with one command or a double-clicked file. (SKILL.md:22,
        LOGIC.md:37)
      - Keep state in memory, using a clearly named scratch store only when persistence is
        the question. (SKILL.md:23, LOGIC.md:63)
      - Skip tests, extra error handling and abstractions. (SKILL.md:24, LOGIC.md:62, LOGIC.md:64)
      - Render the full relevant state after every action or variant switch. (SKILL.md:25,
        LOGIC.md:44)
      - Fold the validated decision into the real code. (SKILL.md:26)
      - Commit the prototype to a throwaway branch out of main as a primary source and point
        to it from the implementation issue. (SKILL.md:26, LOGIC.md:58, UI.md:100-105)
      - Record the verdict and the question it settled in the issue or a commit. (SKILL.md:26,
        LOGIC.md:58, UI.md:100)
      - Logic prototypes are single self-contained HTML files with no framework, bundler or
        server. (LOGIC.md:3, LOGIC.md:37, LOGIC.md:66)
      - State the prototyped question in a visible intro paragraph before coding. (LOGIC.md:18-20)
      - Isolate logic in a pure, liftable module with no DOM access, choosing reducer, state
        machine, pure functions or stateful class by the question. (LOGIC.md:22-33, LOGIC.md:65)
      - Label everything in domain language for a non-developer audience. (LOGIC.md:5, LOGIC.md:39)
      - Lay out title, readable state panel, always-available free-play buttons, and tabbed
        guided scenarios. (LOGIC.md:41-46)
      - Highlight what just changed in the state panel where it helps. (LOGIC.md:44)
      - Each guided scenario resets to a known initial state and steps through real buttons.
        (LOGIC.md:46)
      - Choose scenarios covering the happy path, a tricky edge case, and an attempted illegal
        action. (LOGIC.md:48)
      - Keep the demo visually restrained with no animations. (LOGIC.md:50)
      - Never ship the HTML shell to production; only the logic module is kept. (LOGIC.md:58,
        LOGIC.md:67)
      - UI prototypes render several structurally different variants on one route switched
        by a URL search parameter. (UI.md:3, UI.md:20)
      - Prefer hosting variants inside an existing page with real data, using a new throwaway
        route only when no host exists after a sanity check. (UI.md:14-30)
      - Default to three variants and cap at five. (UI.md:36-38)
      - Write a one-line plan of variant count, switching method and route at the prototype
        location. (UI.md:40-44)
      - Hold each variant to the page's purpose and data, the project's styling system, and
        a clear exported component name. (UI.md:48-52)
      - Require variants to differ in layout, hierarchy and primary affordance, redoing one
        if two come out too similar. (UI.md:54, UI.md:109)
      - Keep existing data fetching above a single switcher so only the rendered subtree changes.
        (UI.md:58-73)
      - Build a floating bottom switcher with wrapping arrows and a variant label, updating
        the URL via the router. (UI.md:79-87)
      - Let arrow keys cycle variants except when a text input or editable element is focused.
        (UI.md:88)
      - Style the switcher distinctly from the design under evaluation. (UI.md:89)
      - Hide the switcher in production builds. (UI.md:90)
      - Put the switcher in one shared component where shared UI lives. (UI.md:92)
      - Hand over the URL and variant keys. (UI.md:94-96)
      - After a winner, fold it in and remove losing variants and the switcher from main.
        (UI.md:100-103)
      - Avoid sharing layout code between variants. (UI.md:110)
      - Point variants needing mutations at stubs rather than real backends. (UI.md:111)
      - Rewrite the winning variant properly rather than promoting prototype code. (UI.md:112)
