    analysis:
      blind:
      - Treat the current directory as a persistent multi-session teaching workspace with
        a fixed set of state files and folders. (SKILL.md:8-20)
      - Resolve workspace paths from the run directory and format-file links from the skill
        folder. (SKILL.md:12)
      - Keep a mission file that grounds every teaching decision. (SKILL.md:14, MISSION-FORMAT.md:3)
      - Keep printable quick-reference HTML documents distilled from lessons. (SKILL.md:15,
        SKILL.md:122-126)
      - Keep a curated resources file of trusted sources. (SKILL.md:16, RESOURCES-FORMAT.md:3)
      - Keep numbered learning records that capture what the user has learned and feed next-lesson
        choice. (SKILL.md:17, LEARNING-RECORD-FORMAT.md:3-5)
      - Keep a notes file for user teaching preferences and working notes. (SKILL.md:20, SKILL.md:138-140)
      - Frame learning as knowledge from trusted sources, skills from interactive lessons,
        and wisdom from communities. (SKILL.md:24-28)
      - Prioritise finding high-quality resources until the resources file is well populated,
        never trusting parametric knowledge. (SKILL.md:30)
      - Design for long-term storage strength over in-the-moment fluency. (SKILL.md:36-41)
      - Use retrieval practice in lessons. (SKILL.md:43)
      - Space practice over time. (SKILL.md:44)
      - Interleave related topics in skills practice only. (SKILL.md:45)
      - Produce each lesson as one self-contained numbered HTML file. (SKILL.md:49)
      - Make lessons beautiful with clean typography for later review. (SKILL.md:51)
      - Keep lessons short, within working memory, each delivering one tangible win tied to
        the mission. (SKILL.md:53)
      - Open the lesson for the user via a CLI command when possible. (SKILL.md:55)
      - Cross-link lessons to other lessons and reference documents. (SKILL.md:57)
      - Recommend one top primary source per lesson. (SKILL.md:59)
      - Remind the user in each lesson to ask the agent follow-up questions. (SKILL.md:61)
      - Build lessons from reusable components in an assets folder, reading it first and writing
        new reusable parts there rather than inlining. (SKILL.md:65-67)
      - Start the component library with a shared stylesheet every lesson links. (SKILL.md:69)
      - If the mission is unclear or empty, first question the user on why they want to learn.
        (SKILL.md:75, MISSION-FORMAT.md:29)
      - When the mission shifts, confirm with the user, update the mission file and add a
        learning record. (SKILL.md:79, LEARNING-RECORD-FORMAT.md:36)
      - Without a user-specified target, pick the next lesson from learning records and the
        mission within the zone of proximal development. (SKILL.md:83-89)
      - Include only the knowledge needed for the lesson's target skill, teach it first, then
        practise. (SKILL.md:93)
      - Cite external sources for every claim in a lesson. (SKILL.md:95)
      - Minimise difficulty when conveying knowledge but use effortful retrieval for skills.
        (SKILL.md:97, SKILL.md:103)
      - Teach skills through quizzes, in-browser tasks, or guided real-world step lists. (SKILL.md:103-106)
      - Give immediate, ideally automatic, feedback on performance. (SKILL.md:108)
      - Make quiz answer options equal in word length and, where possible, character length,
        vary the correct position, and leak no formatting or order clues. (SKILL.md:110)
      - For wisdom questions, attempt an answer but direct the user to a high-reputation community.
        (SKILL.md:116-120)
      - Respect a user's choice not to join communities and record it. (SKILL.md:120, RESOURCES-FORMAT.md:32)
      - Create reference documents alongside lessons as their compressed essence. (SKILL.md:124-134)
      - Once a glossary exists, adhere to its terms in every lesson and artifact. (SKILL.md:136,
        GLOSSARY-FORMAT.md:3)
      - Use a mission template of why, success criteria, constraints and out of scope. (MISSION-FORMAT.md:5-23)
      - Push the mission toward a concrete real-world outcome over abstract understanding.
        (MISSION-FORMAT.md:11, MISSION-FORMAT.md:28)
      - Keep one mission per workspace. (MISSION-FORMAT.md:27)
      - Revise a stale mission rather than leaving it to steer sessions. (MISSION-FORMAT.md:30)
      - Keep the mission file within one screen. (MISSION-FORMAT.md:31)
      - Group resources into knowledge and wisdom sections. (RESOURCES-FORMAT.md:7-23, RESOURCES-FORMAT.md:29)
      - Include only high-trust resources, excluding marketing posing as education. (RESOURCES-FORMAT.md:27)
      - Annotate every resource with what it covers and when to use it. (RESOURCES-FORMAT.md:28)
      - List missing resource areas in a gaps section. (RESOURCES-FORMAT.md:30)
      - Prune wrong, shallow or off-mission resources. (RESOURCES-FORMAT.md:31)
      - Number learning records sequentially, creating the folder lazily and taking the highest
        number plus one. (LEARNING-RECORD-FORMAT.md:3, LEARNING-RECORD-FORMAT.md:25-27)
      - Use a minimal learning-record template of title and one to three sentences, with optional
        status, evidence and implications. (LEARNING-RECORD-FORMAT.md:7-23)
      - Write a learning record on demonstrated understanding, disclosed prior knowledge with
        its depth, a corrected misconception, or a mission shift. (LEARNING-RECORD-FORMAT.md:29-36)
      - Do not record mere coverage, glossary duplicates, or session activity logs. (LEARNING-RECORD-FORMAT.md:38-42)
      - Mark contradicted learning records as superseded rather than deleting them. (LEARNING-RECORD-FORMAT.md:44-46)
      - Use a glossary template of topic, short description, and terms with definition and
        avoid-list. (GLOSSARY-FORMAT.md:5-25)
      - Add a glossary term only once the user can use it correctly. (GLOSSARY-FORMAT.md:29)
      - Pick one preferred word per concept and list the rest as aliases to avoid. (GLOSSARY-FORMAT.md:30)
      - Keep definitions to one or two sentences on what the term is. (GLOSSARY-FORMAT.md:31)
      - Use existing glossary terms inside other definitions. (GLOSSARY-FORMAT.md:32)
      - Group terms under subheadings when clusters emerge. (GLOSSARY-FORMAT.md:33)
      - Record how loosely used field terms are resolved in this workspace. (GLOSSARY-FORMAT.md:34)
      - Revise glossary definitions in place as understanding deepens. (GLOSSARY-FORMAT.md:35)
      - Vary the balance of knowledge teaching and skills practice with the topic. [critic
        r1] (SKILL.md:32)
