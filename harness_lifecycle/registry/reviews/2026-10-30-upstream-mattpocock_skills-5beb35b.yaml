    analysis:
      blind:
      - Fetch and read the full body and comments of any referenced spec or issue. (SKILL.md:17)
      - Explore the codebase if needed, using glossary vocabulary and respecting decision
        records in ticket text. (SKILL.md:21)
      - Look for prefactoring opportunities that make the change easy, and schedule them first.
        (SKILL.md:23, SKILL.md:34)
      - Slice work into tracer-bullet tickets that each cut a narrow complete path through
        every layer. (SKILL.md:27-31)
      - Each slice must be demoable or verifiable on its own. (SKILL.md:32)
      - Size each slice to fit one fresh context window. (SKILL.md:33)
      - Give every ticket explicit blocking edges, with unblocked tickets startable immediately.
        (SKILL.md:38)
      - Sequence wide mechanical refactors as expand, batched migrate, then contract, each
        batch its own ticket blocked appropriately. (SKILL.md:40)
      - Size migrate batches by blast radius and keep CI green between batches. (SKILL.md:40)
      - When batches cannot stay green alone, share an integration branch gated by a final
        integrate-and-verify ticket. (SKILL.md:40)
      - Present the breakdown as a numbered list of title, blockers and delivered behaviour.
        (SKILL.md:44-48)
      - Ask the user about granularity, correctness of blocking edges, and merges or splits.
        (SKILL.md:50-54)
      - Iterate until the user approves the breakdown before publishing. (SKILL.md:56)
      - For a local tracker, write one numbered file per ticket in dependency order, never
        a combined file. (SKILL.md:62)
      - For a real tracker, publish in dependency order so edges reference real ids, using
        native blocking links where available. (SKILL.md:63)
      - Make each ticket a sub-issue when the source was an existing issue. (SKILL.md:63)
      - Label published tickets ready for an agent unless told otherwise. (SKILL.md:63)
      - Work the frontier of tickets whose blockers are all done. (SKILL.md:65)
      - Never close or modify the parent issue. (SKILL.md:67)
      - Use a local ticket template of title, end-to-end what-to-build, blocked-by, status,
        and acceptance checkboxes. (SKILL.md:69-82)
      - Use an issue template of parent, what-to-build, acceptance criteria and blocked-by,
        omitting blocked-by when native edges are set. (SKILL.md:84-103)
      - Describe what to build as user-facing end-to-end behaviour rather than a layer list.
        (SKILL.md:73, SKILL.md:92)
      - Avoid file paths and code snippets in tickets except trimmed decision-encoding prototype
        snippets noted as such. (SKILL.md:105)
