        AGENT-BRIEF.md:150)
      - 'Write briefs to stay durable: name interfaces, types and contracts, never file paths
        or line numbers. (AGENT-BRIEF.md:9-17)'
      - Describe behaviour, not implementation steps. (AGENT-BRIEF.md:19-26)
      - Give concrete, independently verifiable acceptance criteria. (AGENT-BRIEF.md:28-33)
      - State explicit out-of-scope boundaries. (AGENT-BRIEF.md:35-37)
      - Use a brief template of category, summary, current behaviour, desired behaviour, key
        interfaces, acceptance criteria and out of scope. (AGENT-BRIEF.md:39-68)
      - Keep one rejected-requests file per concept, not per issue, with a recognisable kebab-case
        name. (OUT-OF-SCOPE.md:17, OUT-OF-SCOPE.md:56-58)
      - Write rejection records as readable short design notes with decision, substantive
        reason and prior-request list. (OUT-OF-SCOPE.md:19-54)
      - Require durable reasons grounded in scope, technical constraints or strategy, treating
        temporary reasons as deferrals. (OUT-OF-SCOPE.md:60-68)
      - Match new requests against rejections by concept similarity, not keywords, and ask
        the maintainer if they still agree. (OUT-OF-SCOPE.md:75-76)
      - On maintainer confirm, append the issue to prior requests and close; on reconsider,
        delete or update the record; on disagree, proceed. (OUT-OF-SCOPE.md:78-82)
      - Record rejected enhancement PRs the same way as issues. (OUT-OF-SCOPE.md:86)
      - When writing a rejection, append to an existing matching record or create one, comment
        with a link, then close as wontfix. (OUT-OF-SCOPE.md:90-97)
      - When reversing a rejection, delete the record without reopening old issues. (OUT-OF-SCOPE.md:99-105)
