    analysis:
      blind:
      - Use a fixed glossary of design terms exactly and avoid listed substitute words. (SKILL.md:10-28)
      - Treat a module's interface as everything a caller must know, including invariants,
        ordering, error modes, configuration and performance. (SKILL.md:16, SKILL.md:108)
      - Measure depth as leverage per unit of interface rather than as an implementation-to-interface
        line ratio. (SKILL.md:20, SKILL.md:107)
      - When designing an interface, ask whether methods can be fewer, parameters simpler,
        and more complexity hidden. (SKILL.md:54-58)
      - Depth belongs to the interface, so a deep module may contain small swappable internal
        parts with internal seams kept off its interface. (SKILL.md:62, DEEPENING.md:30)
      - 'Apply a deletion test: imagine removing the module and see whether complexity vanishes
        or reappears across callers. (SKILL.md:63)'
      - Treat the interface as the test surface; wanting to test past it signals the wrong
        module shape. (SKILL.md:64, DEEPENING.md:35)
      - Introduce a seam only when at least two adapters are justified, since one adapter
        is mere indirection. (SKILL.md:65, DEEPENING.md:29)
      - Make code testable by accepting dependencies rather than constructing them. (SKILL.md:71-81)
      - Make code testable by returning results rather than producing side effects. (SKILL.md:83-93)
      - Keep interface surface small so fewer tests and simpler setup are needed. (SKILL.md:95)
      - Classify a deepening candidate's dependencies into in-process, local-substitutable,
        remote-owned, or true-external categories that dictate how it is tested. (DEEPENING.md:5-25)
      - For local-substitutable dependencies, test with the local stand-in in the suite and
        keep the seam internal. (DEEPENING.md:13-15)
      - For owned remote services, define a port with a production transport adapter and an
        in-memory test adapter. (DEEPENING.md:17-21)
      - For third-party services, inject the dependency as a port and use a mock adapter in
        tests. (DEEPENING.md:23-25)
      - After deepening, delete the old shallow-module unit tests once interface-level tests
        exist. (DEEPENING.md:34)
      - Tests assert observable outcomes through the interface and should survive internal
        refactors. (DEEPENING.md:36-37)
      - Before exploring alternatives, show the user a problem-space framing of constraints,
        dependency categories and an illustrative sketch, then proceed without waiting. (DESIGN-IT-TWICE.md:9-17)
      - Spawn three or more parallel subagents that must each produce a radically different
        interface. (DESIGN-IT-TWICE.md:21)
      - 'Give each design subagent a separate technical brief and a distinct constraint: minimal,
        flexible, common-caller-optimised, or ports-and-adapters. (DESIGN-IT-TWICE.md:23-28)'
      - Include both the design vocabulary and the project's domain glossary in each design
        brief. (DESIGN-IT-TWICE.md:30)
      - Each design subagent returns interface, usage example, hidden internals, dependency
        strategy, and trade-offs. (DESIGN-IT-TWICE.md:32-38)
      - Present designs one at a time, then compare them on depth, locality and seam placement.
        (DESIGN-IT-TWICE.md:42)
      - Finish with an opinionated recommendation, proposing a hybrid where elements combine
        well. (DESIGN-IT-TWICE.md:44)
