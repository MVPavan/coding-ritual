      purpose_match: test-driven-development
      purpose: 'Upstream tdd is the reference for test-first red-green work: what a good test
        is, where seams go, mocking rules and loop rules, used when building or fixing test-first.
        Our test-driven-development fires for the same work and produces the same tests.'
      flag: null
      reason: null
    analysis:
      blind:
      - Consult the testing rules before and during every red-green cycle, not after. (SKILL.md:8)
      - Match test names and interface vocabulary to the domain glossary and respect local
        decision records. (SKILL.md:10)
      - Test behaviour through public interfaces so tests read like specifications and survive
        refactors. (SKILL.md:14, tests.md:5-23)
      - Write tests only at seams listed and confirmed with the user before any test is written.
        (SKILL.md:22)
      - Annotate each proposed seam with one line on what it catches and what it misses. (SKILL.md:24)
      - Consult the module-design vocabulary when the interface shape itself is in question,
        as a reference rather than a session. (SKILL.md:26)
      - Reject implementation-coupled tests that mock internals, test private methods, or
        verify through a side channel. (SKILL.md:30, tests.md:38-45)
      - Reject tautological tests whose expected value is recomputed like the code; take expected
        values from an independent source such as a known literal or the spec. (SKILL.md:31,
        tests.md:63-76)
      - Work in vertical tracer-bullet slices of one test then one implementation, never all
        tests first. (SKILL.md:32, SKILL.md:37)
      - Write the failing test first, then only enough code to pass, with no anticipated features.
        (SKILL.md:36)
      - Keep refactoring out of the red-green loop and leave it to review. (SKILL.md:38)
      - Keep one logical assertion per test. (tests.md:23)
      - Avoid asserting on call counts or call order. (tests.md:42)
      - Name tests for what behaviour exists, not how it is achieved. (tests.md:22, tests.md:44)
      - Mock only at system boundaries such as external APIs, time and randomness, and sometimes
        databases or the filesystem. (mocking.md:3-8)
      - Never mock your own modules or internal collaborators. (mocking.md:10-14)
      - Prefer a test database over mocking the database. (mocking.md:6)
      - Inject external dependencies so they can be mocked. (mocking.md:20-35)
      - Expose external operations as specific per-operation functions rather than one generic
        fetcher so each mock returns one shape. (mocking.md:37-59)
