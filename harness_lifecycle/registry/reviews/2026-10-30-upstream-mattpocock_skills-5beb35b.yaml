    pairing:
      overlap:
        beads: 1
        planning: 2
        wayfinder: 22
      placement_match:
      - wayfinder
      suggested: wayfinder
      purpose_match: wayfinder
      purpose: Upstream charts a large effort with unsettled decisions as a map of decision
        tickets on the tracker and resolves them across sessions. Our wayfinder is the Beads-native
        copy for the same multi-session decision mapping.
      flag: null
      reason: null
    analysis:
      blind:
      - Name the effort's destination first, since it fixes scope. (SKILL.md:9, SKILL.md:111)
      - Produce decisions rather than deliverables by default, treating the urge to build
        as the signal to hand off, unless the map's notes override. (SKILL.md:11-13)
      - Refer to maps and tickets by title in human-facing text, with links inside names,
        never bare ids. (SKILL.md:15-17)
      - Keep the map as a single labelled tracker issue whose tickets are its child issues.
        (SKILL.md:21)
      - Make the map an index that gists and links each decision, which lives only in its
        ticket. (SKILL.md:23)
      - Default to a local-markdown tracker when none is configured. (SKILL.md:25)
      - Use a map body of destination, notes, decisions so far, not yet specified, and out
        of scope, without listing open tickets. (SKILL.md:27-53)
      - Write each ticket body as a single question sized to one 100K-token session. (SKILL.md:57-63)
      - Label each ticket with one type of research, prototype, grilling or task, and never
        with triage labels. (SKILL.md:65)
      - Claim a ticket by assigning it before any work so concurrent sessions skip it. (SKILL.md:67,
        SKILL.md:123)
      - Use the tracker's native blocking so the frontier is visible, falling back to a body
        convention only without it. (SKILL.md:69)
      - Define the frontier as open, unblocked, unclaimed children. (SKILL.md:69)
      - Record answers on resolution, not in the body, and link assets rather than pasting.
        (SKILL.md:71)
      - Mark each ticket as human-in-the-loop or agent-alone, and never let the agent answer
        the human's side of a live ticket. (SKILL.md:75)
      - Resolve research tickets with a research subagent when outside knowledge is needed.
        (SKILL.md:77)
      - Resolve prototype tickets by building a rough artifact and linking it as an asset.
        (SKILL.md:78)
      - Make grilling the default ticket type, run with the interview and domain-model skills.
        (SKILL.md:79)
      - Use task tickets only for manual work that unblocks a decision, driving it alone where
        possible or handing a checklist, and recording resulting facts. (SKILL.md:80)
      - Leave not-yet-sharp questions in a fog section rather than ticketing them, graduating
        them as the frontier advances. (SKILL.md:84-86)
      - Ticket a question when it can be stated precisely now, even if blocked; otherwise
        keep it as fog without pre-slicing. (SKILL.md:88-91)
      - Keep decided, ticketed and out-of-scope items out of the fog section. (SKILL.md:93)
      - Close tickets found beyond the destination and log them in an out-of-scope section,
        not in decisions so far. (SKILL.md:97-101)
      - Treat out-of-scope work as never graduating, returning only as a fresh effort if the
        destination changes. (SKILL.md:99)
      - Resolve at most one ticket per session, except research tickets. (SKILL.md:105)
      - When charting, grill breadth-first across the space to surface open decisions and
        first steps. (SKILL.md:112)
      - If charting reveals no fog, skip the map and ask the user how to proceed. (SKILL.md:112)
      - Create the map with destination and notes filled, empty decisions, and sketched fog.
        (SKILL.md:113)
      - Create specifiable tickets first, then wire blocking edges and cross-references in
        a second pass using real ids. (SKILL.md:114)
      - Fire parallel research subagents for new research tickets, storing findings on a pushed,
        never-merged throwaway branch pointed to from the ticket. (SKILL.md:115)
      - End the charting session without resolving any ticket. (SKILL.md:116)
      - When working the map, load only its low-resolution body. (SKILL.md:122)
      - Take the user's named ticket or else the first frontier ticket. (SKILL.md:120, SKILL.md:123)
      - Resolve by the ticket's type label, zooming into related tickets on demand and loading
        skills named in notes. (SKILL.md:124)
      - Record a resolution as an answer comment, close the ticket, and append a pointer to
        decisions so far. (SKILL.md:125)
      - After resolving, add new tickets, graduate fog, rule out-of-scope tickets out, and
        update or delete invalidated tickets. (SKILL.md:126)
