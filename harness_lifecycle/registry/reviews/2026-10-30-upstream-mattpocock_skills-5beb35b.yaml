    analysis:
      blind:
      - Review the diff against a user-supplied fixed point, asking for one if none was given.
        (SKILL.md:19)
      - Use a three-dot diff so the comparison is against the merge-base, and record the commit
        list. (SKILL.md:21)
      - Verify the ref resolves and the diff is non-empty before spawning any reviewers. (SKILL.md:23)
      - 'Locate the originating spec in a fixed order: commit-message issue references, a
        user path, a matching spec file, then ask. (SKILL.md:27-32)'
      - Skip the spec axis and report that no spec is available when the user confirms none
        exists. (SKILL.md:32, SKILL.md:74)
      - Collect every repo file documenting coding standards, always including a standards
        or contributing file when present. (SKILL.md:36)
      - Always apply a fixed baseline of twelve named code smells, each with a description
        and a fix, even when the repo documents no standards. (SKILL.md:38-56)
      - A documented repo standard overrides the smell baseline and suppresses a conflicting
        smell. (SKILL.md:40)
      - Report baseline smells only as labelled possible judgement calls, never hard violations.
        (SKILL.md:41)
      - Skip findings that existing tooling already enforces. (SKILL.md:41, SKILL.md:66)
      - Run the standards and spec reviews as two parallel foreground subagents so their contexts
        stay separate. (SKILL.md:11, SKILL.md:60)
      - Paste the full smell baseline into the standards reviewer's brief because it has no
        other access to it. (SKILL.md:65)
      - The standards reviewer cites the specific standard file and rule for each violation
        and quotes the hunk for each smell. (SKILL.md:66)
      - The spec reviewer reports missing or partial requirements, unrequested behaviour,
        and wrongly implemented requirements, quoting the spec line for each. (SKILL.md:72)
      - Cap each reviewer's report at 400 words. (SKILL.md:66, SKILL.md:72)
      - Present the two reports under separate headings without merging or reranking findings
        across axes. (SKILL.md:78)
      - End with a one-line summary of per-axis counts and the worst issue within each axis,
        never a single cross-axis winner. (SKILL.md:80)
