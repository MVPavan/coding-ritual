      purpose: Upstream setup-ts-deep-modules wires dependency-cruiser into a TypeScript repository
        so packages are deep modules reachable only through entry points, when a user invokes
        it. No skill of ours sets up TypeScript import boundaries, so the pick is none.
      flag: suggested differs
      reason: Overlap suggests authoring-for-agents on one variant trait (pointing at a convention
        from the agent file); it writes agent instructions, not module-boundary tooling.
    analysis:
      blind:
      - Treat every root file of a package as a public entry point and everything in any subfolder
        as private. (SKILL.md:9, SKILL.md:24, SKILL.md:100)
      - Use a conventional two-folder package shape with implementation and tests subfolders.
        (SKILL.md:15-24)
      - Forbid outside code from importing a package's subfolder internals. (SKILL.md:28,
        dependency-cruiser.config.cjs:29-48)
      - Allow a package's own files to import each other freely. (SKILL.md:29, dependency-cruiser.config.cjs:46)
      - Require tests to import only entry points and their own fixtures, never internals,
        even of their own package. (SKILL.md:30, dependency-cruiser.config.cjs:49-59)
      - Make a package's tests folder importable only from tests. (dependency-cruiser.config.cjs:60-67)
      - Forbid dependency cycles. (SKILL.md:31, dependency-cruiser.config.cjs:68-74)
      - Set every boundary rule to error severity. (SKILL.md:26)
      - Prefer several small entry points over a barrel re-exporting a subtree. (SKILL.md:33,
        dependency-cruiser.config.cjs:8-10)
      - Leave package layering as a commented stub for the repo to fill in. (SKILL.md:35,
        dependency-cruiser.config.cjs:76-86)
      - Detect the package manager from the lockfile and use it for every command. (SKILL.md:41)
      - Choose the packages root by whether a source folder exists, confirming with the user
        if another convention is evident. (SKILL.md:42)
      - Merge rules into an existing dependency-cruiser config rather than overwriting it,
        and report what was added. (SKILL.md:43)
      - Install dependency-cruiser as a dev dependency. (SKILL.md:49)
      - Copy the bundled config and edit only the packages-root constant. (SKILL.md:55, dependency-cruiser.config.cjs:12-15)
      - Add a boundary-lint script and fold it into the umbrella check command that runs typecheck,
        without touching tsconfig or aliases. (SKILL.md:61-62)
      - Without an umbrella script, add the lint script and tell the user to put it in CI.
        (SKILL.md:63)
      - Scaffold a committed example package with a delegating entry point, a private implementation
        file, and a test importing only the entry point. (SKILL.md:69-73)
      - Tell the user the example package is a starter to copy or delete. (SKILL.md:75)
      - Prove the rules bite by observing pass, then fail on a temporary deep import, then
        pass after revert. (SKILL.md:79-87)
      - Write a README in the packages folder covering layout, entry-point-only imports, the
        lint command, and discouraging barrels. (SKILL.md:91)
      - Add a one-line pointer to that README from the repo's agent-instructions file, creating
        one if none exists. (SKILL.md:93)
      - Keep the config's group back-references rather than flattening into per-package rules.
        (SKILL.md:99)
      - Keep packages flat, one tier under the root, with no nested packages. (SKILL.md:101,
        dependency-cruiser.config.cjs:14)
      - Use a CommonJS config extension so it works in ES-module repos. (SKILL.md:102)
      - Configure the cruiser to skip node_modules, read tsconfig, and resolve TS and JS extensions.
        (dependency-cruiser.config.cjs:88-94)
