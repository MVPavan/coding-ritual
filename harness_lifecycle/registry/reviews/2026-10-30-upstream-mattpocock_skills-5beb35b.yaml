      - Look for expensive or token-inefficient tool calls and tooling. (SKILL.md:21)
      - Look for steering instructions that change no behaviour. (SKILL.md:22)
      - Look for ways to give the agent missing information access, such as teed logs or read-only
        service access. (SKILL.md:23)
