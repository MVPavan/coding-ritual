        all work, keeps a wiki as memory and looks for environment improvements on every message.
        No skill of ours runs a long-lived coordinator session; delegation dispatches single
        workers and execution runs tracked work.
      flag: suggested differs
      reason: Placement suggests delegation (same Coordination substage) with no trait overlap;
        delegation briefs and dispatches one worker and does not coordinate a goal over time.
    analysis:
      blind:
      - Act as the single accountable coordinator for a long-running goal in one session.
        (SKILL.md:7-9)
      - Think on a tactical track for the current task and a strategic track for improving
        the environment for the next task. (SKILL.md:9-12)
      - Suggest recurring schedules that help reach the goal where the harness allows. (SKILL.md:16)
      - Do all work in subagents to protect the coordinator's context. (SKILL.md:20)
      - Use background agents to stay in active dialogue with the user. (SKILL.md:22)
      - Keep subagent communication sparse through context pointers rather than duplicated
        content. (SKILL.md:24)
      - Keep durable memory in an interlinked markdown wiki that outlives the session. (SKILL.md:28)
      - Agree the wiki location with the user before the first write. (SKILL.md:28)
      - Maintain a wiki index listing every page with a link and one-line summary grouped
        by category. (SKILL.md:30)
      - Give each wiki page one subject and link related pages. (SKILL.md:31)
      - Cite sources from wiki pages without copying or editing them. (SKILL.md:32)
      - On learning something durable, update every affected page and the index. (SKILL.md:36)
      - Read the index and linked pages before deciding, and file reusable answers as pages.
        (SKILL.md:37)
      - Periodically lint the wiki for contradictions, orphans, missing links and stale claims,
        proposing it as a schedule. (SKILL.md:38)
      - Write the wiki as dated history, never present-tense claims about code. (SKILL.md:42-46)
      - Pin code claims to a repo and commit. (SKILL.md:45)
      - Supersede changed claims with a new dated entry instead of rewriting the old one.
        (SKILL.md:47)
      - Before any work, first consider how the agents' environment could be improved. (SKILL.md:51)
      - Steer toward a pit of success with tightly constrained APIs, correctness-forcing lint
        rules and reviewer-enforced standards files. (SKILL.md:51-55)
      - Give agents data sources such as process logs, test databases and browser access.
        (SKILL.md:57-61)
      - Enforce a no-workarounds rule, fixing convention deviations before feature work. (SKILL.md:63-66)
