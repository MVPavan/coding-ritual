  skill:skills/engineering/domain-modeling:
    upstream_tree_hash: b78689833404148c769077355e12dbe5ad996a158a1e21e58ddf169e439d9d8c
    accepted: null
    compared_with: domain-modeling
    pairing:
      overlap:
        domain-modeling: 21
        teach: 5
      placement_match:
      - codebase-design
      - design-evolve
      - domain-modeling
      - prototype
      suggested: domain-modeling
      purpose_match: domain-modeling
      purpose: Upstream actively builds a project's glossary and ADRs while designing, used
        whenever domain terms or hard-to-reverse decisions come up. Our domain-modeling is
        the adapted copy with the same purpose and files.
      flag: null
      reason: null
    analysis:
      blind:
      - Distinguish actively changing the domain model from merely reading the glossary, applying
        this discipline only to the former. (SKILL.md:8)
      - Treat a root glossary map file as the signal of a multi-context repo pointing to per-context
        glossaries and decision folders. (SKILL.md:24-38, GLOSSARY-FORMAT.md:36-58)
      - Keep system-wide decision records at the root and context-specific ones inside each
        context. (SKILL.md:30-37)
      - Create glossary and decision-record files lazily, only when there is first content
        to write. (SKILL.md:40, ADR-FORMAT.md:5, GLOSSARY-FORMAT.md:58)
      - Call out immediately when the user's term conflicts with the existing glossary. (SKILL.md:44-46)
      - Propose a precise canonical term when the user uses vague or overloaded words. (SKILL.md:48-50)
      - Invent concrete edge-case scenarios to stress-test domain relationships and concept
        boundaries. (SKILL.md:52-54)
      - Check user claims about behaviour against the code and surface contradictions. (SKILL.md:56-58)
      - Update the glossary inline the moment a term is resolved rather than batching. (SKILL.md:60-62)
      - Keep the glossary free of implementation detail and never use it as a spec or scratch
        pad. (SKILL.md:64)
      - Offer a decision record only when the decision is hard to reverse, surprising without
        context, and the product of a real trade-off. (SKILL.md:66-74, ADR-FORMAT.md:29-37)
      - Name decision records with sequential zero-padded numbers and slugs, taking the highest
        existing number plus one. (ADR-FORMAT.md:3, ADR-FORMAT.md:25-27)
      - Use a minimal decision-record template of a title and one to three sentences of context,
        decision and reason. (ADR-FORMAT.md:7-15)
      - Add optional status, considered-options or consequences sections only when they add
        real value. (ADR-FORMAT.md:17-23)
      - Use a list of qualifying decision kinds, including architectural shape, cross-context
        integration, lock-in technology, scope boundaries, deliberate deviations, invisible
        constraints and non-obvious rejections. (ADR-FORMAT.md:39-47)
      - Use a glossary template of context name, short description, and bolded terms each
        with a definition and an avoid-list. (GLOSSARY-FORMAT.md:3-23)
      - Pick one preferred word per concept and list synonyms under avoid. (GLOSSARY-FORMAT.md:27)
      - Keep definitions to one or two sentences stating what the term is, not what it does.
        (GLOSSARY-FORMAT.md:28)
      - Admit only project-specific terms, excluding general programming concepts. (GLOSSARY-FORMAT.md:29)
      - Group terms under subheadings when natural clusters appear. (GLOSSARY-FORMAT.md:30)
      - A glossary map lists each context with location and purpose plus the relationships
        between contexts. (GLOSSARY-FORMAT.md:38-52)
      - Infer which context the current topic belongs to and ask if unclear. (GLOSSARY-FORMAT.md:60)
