      suggested: systematic-debugging
      purpose_match: systematic-debugging
      purpose: Upstream diagnosing-bugs runs a phased diagnosis (feedback loop, reproduce,
        hypothesise, instrument, fix with a regression test, clean up) when a bug's cause
        is unclear. Our systematic-debugging covers the same trigger and produces the same
        confirmed cause and proving check.
      flag: null
      reason: null
    analysis:
      blind:
      - Skip phases of the diagnosis only with explicit justification. (SKILL.md:8)
      - Read the domain glossary and nearby architecture decision records when exploring the
        code. (SKILL.md:10)
      - Redact every secret as a placeholder in shown commands, outputs and artifacts. (SKILL.md:14)
      - Build reproduction loops on environment variables so credentials stay out of shown
        text. (SKILL.md:14)
      - Quote only signal-carrying lines from captured artifacts that may hold auth headers.
        (SKILL.md:14)
      - Ask the user when redacted output is insufficient to diagnose. (SKILL.md:16)
      - Build a tight pass/fail feedback loop for the specific bug before anything else, investing
        disproportionate effort in it. (SKILL.md:18-22)
      - Try an ordered ladder of loop types from failing test through HTTP script, CLI snapshot
        diff, headless browser, trace replay, throwaway harness, fuzzing, bisection, differential
        runs, to a human-driven script last. (SKILL.md:24-35)
      - Tighten the loop for speed, symptom-specific assertions, and determinism. (SKILL.md:39-47)
      - For non-deterministic bugs, raise the reproduction rate through repetition, parallelism,
        stress and timing injection until debuggable. (SKILL.md:49-51)
      - When no loop can be built, stop, list what was tried, and ask for environment access,
        a redacted artifact, or permission for temporary production instrumentation. (SKILL.md:53-55)
      - Gate phase 1 on one already-run command shown with output that is red-capable on the
        user's exact symptom, deterministic, fast, and agent-runnable. (SKILL.md:57-64)
      - Stop if reading code to form a theory before the red-capable command exists. (SKILL.md:66)
      - Confirm the loop reproduces the user's described failure rather than a nearby one,
        repeatably, and capture the exact symptom. (SKILL.md:72-76)
      - Minimise the repro by cutting one element at a time and re-running until every remaining
        element is load-bearing. (SKILL.md:78-86)
      - Generate three to five ranked hypotheses before testing any. (SKILL.md:90)
      - Each hypothesis must state a falsifiable prediction in an if-cause-then-change form,
        or be discarded. (SKILL.md:92-96)
      - Show the ranked hypotheses to the user before testing, without blocking if they are
        away. (SKILL.md:98)
      - Each probe maps to one prediction and changes one variable at a time. (SKILL.md:102)
      - Prefer a debugger or REPL, then targeted logs at distinguishing boundaries, never
        blanket logging. (SKILL.md:104-108)
      - Tag every debug log with a unique prefix so cleanup is one search. (SKILL.md:110)
      - For performance regressions, establish a baseline measurement and bisect instead of
        logging. (SKILL.md:112)
      - Write the regression test before the fix only at a seam that exercises the real bug
        pattern. (SKILL.md:116-118)
      - When no correct seam exists, record that as an architectural finding. (SKILL.md:120)
      - If a red was forced by mutating code or a fixture, diff against a pristine copy to
        prove the mutation landed. (SKILL.md:125)
      - Sequence the fix as failing test, watch fail, fix, watch pass, then re-run the original
        unminimised loop. (SKILL.md:124-128)
      - Before declaring done, check the original repro is gone, the regression test passes
        or missing seam is documented, tagged instrumentation is removed, and throwaway prototypes
        are deleted or quarantined. (SKILL.md:132-137)
      - State the confirmed hypothesis in the commit or PR message. (SKILL.md:138)
      - A human-in-the-loop script template drives a person through step prompts and captures
        answers into variables. (scripts/hitl-loop.template.sh:9-30)
      - The human-loop script prints captured values as key=value lines for the agent to parse.
        (scripts/hitl-loop.template.sh:13, scripts/hitl-loop.template.sh:42-44)
      - Capture only observations through the human-loop script and leave sign-in to the person
        as a plain step, since captured values are echoed. (scripts/hitl-loop.template.sh:15-16)
