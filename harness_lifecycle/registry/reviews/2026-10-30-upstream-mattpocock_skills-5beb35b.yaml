      purpose: Upstream writing-for-agents is the reference for writing anything an agent
        consumes, used when creating or editing skills or AGENTS.md. Our authoring-for-agents
        is the same reference for the same edits.
      flag: null
      reason: null
    analysis:
      blind:
      - Treat any reference naming out-of-context material as a pointer whose wording sets
        when and how reliably the agent reaches it. (SKILL.md:12)
      - Fix a weakly reached must-have target by sharpening the pointer wording first, inlining
        only if that fails. (SKILL.md:12)
      - Make each pointer state what the material is and list its distinct trigger branches.
        (SKILL.md:14)
      - Front-load the leading word in a pointer. (SKILL.md:16)
      - Keep one trigger per branch, collapsing synonyms. (SKILL.md:17)
      - Cut identity from a pointer that the body already carries. (SKILL.md:18)
      - Weigh every addition against always-loaded context cost and human cognitive cost.
        (SKILL.md:20-27)
      - Spend human cognitive load only where human judgement matters. (SKILL.md:25)
      - Place content on a hierarchy of in-file steps, in-file reference, then disclosed reference
        behind pointers. (SKILL.md:29-37)
      - Inline what every branch needs and disclose behind a pointer what only some branches
        reach. (SKILL.md:39)
      - Disclose reference that would otherwise bury steps. (SKILL.md:39)
      - Co-locate a concept's definition, rules and caveats under one heading. (SKILL.md:41)
      - Cure sprawl by disclosing reference and splitting by branch or sequence. (SKILL.md:43)
      - End every step on a completion criterion. (SKILL.md:47)
      - Sharpen a vague completion criterion before considering hiding later steps. (SKILL.md:49)
      - Hide post-completion steps only across a real context boundary such as a handoff or
        subagent, and only if rushing is observed. (SKILL.md:49)
      - Raise criterion demand with exhaustive wording to drive legwork, including over flat
        reference. (SKILL.md:50)
      - Prefer criteria that are both checkable and exhaustive. (SKILL.md:52)
      - Split by sequence where later steps tempt rushing the current one, and avoid merging
        sequences that expose later steps. (SKILL.md:56-58)
      - Use pretrained leading words repeated as tokens to anchor behaviour, preferring existing
        words over coined ones. (SKILL.md:61-65)
      - Hunt restated triads and long gestures to collapse into a single leading word. (SKILL.md:67-72)
      - State the positive target behaviour instead of prohibitions, keeping a ban only as
        a hard guardrail paired with its positive. (SKILL.md:74)
      - Keep each meaning in a single source of truth and remove duplication. (SKILL.md:78)
      - Do not restate what the environment can answer cheaply; cache only conventions, reasons
        and gotchas not discoverable by looking. (SKILL.md:79)
      - Check every line for relevance and prune stale sediment. (SKILL.md:80)
      - Delete whole sentences that do not change behaviour versus the model's default, settling
        disputes by running the document. (SKILL.md:81)
      - Replace leading words too weak to beat the default with stronger ones. (SKILL.md:81)
      - Make a skill model-invoked only when the agent or another skill must reach it, otherwise
        user-invoked. (SKILL-MECHANICS.md:7-12)
      - Write a model-invoked skill's description as a model-facing pointer with trigger branches.
        (SKILL-MECHANICS.md:9)
      - Write a user-invoked skill's description as a one-line human summary with triggers
        stripped. (SKILL-MECHANICS.md:10)
      - House reference shared by several skills in one model-invoked reference skill. (SKILL-MECHANICS.md:9)
      - Push reference shared by user-invoked skills into a plain external file. (SKILL-MECHANICS.md:14)
      - Split off a model-invoked skill only for a distinct trigger word actually used or
        when another skill must reach it. (SKILL-MECHANICS.md:16-18)
      - Use one user-invoked router skill naming the others when user-invoked skills become
        too many to remember. (SKILL-MECHANICS.md:20-22)
