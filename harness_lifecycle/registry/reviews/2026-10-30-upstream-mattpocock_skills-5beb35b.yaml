  skill:skills/engineering/wizard:
    upstream_tree_hash: 806f7f7461824054ffaf3344e1e56e5e8a42344e22bdf8d22c6a8117eb9b1c38
    accepted: null
    compared_with: none
    pairing:
      overlap: {}
      placement_match:
      - test-driven-development
      suggested: test-driven-development
      purpose_match: none
      purpose: Upstream wizard generates an interactive bash script that walks a person through
        steps only they can perform (provisioning, credentials, CI secrets, cutovers). No
        skill of ours produces such a script, so the pick is none.
      flag: suggested differs
      reason: The only signal is a placement match with test-driven-development, from a shared
        stage; there is no trait overlap and no skill of ours with the same purpose.
    analysis:
      blind:
      - Generate an interactive bash script that walks a human through steps only they can
        perform. (SKILL.md:8)
      - Reuse a fixed library section of the template unchanged and author only the stages
        below its marker. (SKILL.md:10, SKILL.md:37, template.sh:6-7)
      - Treat the wizard as ephemeral in a scratch or scripts path, committing it only when
        the user wants a repeatable setup. (SKILL.md:12)
      - Scope by reading env files, docs, compose files, framework config and CI workflows
        before asking, treating every CI secret or variable reference as a value to produce.
        (SKILL.md:18-20)
      - For a migration, identify current state, target state and the irreversible actions
        between them. (SKILL.md:21)
      - Show the user the ordered stage list with produced values and let them add, drop or
        reorder. (SKILL.md:23)
      - Gate scoping on knowing, for each value, its source, its destination, and whether
        it is secret. (SKILL.md:25)
      - Write each stage as a concrete click path a stranger could follow. (SKILL.md:29, SKILL.md:31)
      - Never invent UI steps or commands; ask the user or check docs when unsure. (SKILL.md:29)
      - Write one stage per step in dependency order and set the total stage count to match.
        (SKILL.md:35)
      - Open the URL before asking for its value. (SKILL.md:37)
      - Use hidden entry for any secret. (SKILL.md:37, template.sh:121-135)
      - Write each persisted value to the env file. (SKILL.md:37)
      - Push to CI secrets only the values CI actually needs. (SKILL.md:37)
      - Require a yes/no confirmation before any irreversible action. (SKILL.md:37, template.sh:84-90)
      - Keep each stage to one focused task since each stage clears the screen. (SKILL.md:37,
        template.sh:50-57)
      - Syntax-check the script and run shellcheck when available. (SKILL.md:41)
      - Make the script executable. (SKILL.md:42)
      - Do not run the wizard yourself; trace statically that every value lands where scoped
        and every secret name matches a CI reference. (SKILL.md:43)
      - Tell the user how to run it, and for repeatable setups commit it and link it from
        the README. (SKILL.md:44)
      - Show stage-by-stage progress as current over total. (template.sh:52-57)
      - Open URLs cross-platform including WSL, warning to visit manually if no opener works.
        (template.sh:66-76)
      - Offer the existing env value as the default on re-runs so the wizard is resumable.
        (template.sh:44-46, template.sh:92-119)
      - Refuse to decode double-quoted env values containing escapes and re-ask instead. (template.sh:99-101)
      - Upsert env keys idempotently, creating the env file with owner-only permissions and
        preserving existing file mode. (template.sh:137-151)
      - Set CI secrets and variables through the GitHub CLI, recording skips when the CLI
        is missing or unauthenticated. (template.sh:153-179)
      - Close with a summary of values written, secrets set, and items still to do by hand.
        (template.sh:181-192)
      - Wrap all stages in one function invoked on the last line so the whole file parses
        before the first prompt. (template.sh:197-198, template.sh:201-223)
      - Skip colour when output is not a capable terminal and skip screen clears when piped.
        (template.sh:15-20, template.sh:31-37)
