      purpose_match: improve-codebase-architecture
      purpose: Upstream surveys a codebase for deepening candidates and presents them as an
        HTML card report, then interviews the user on the chosen one; it runs when the user
        asks for an architecture review. Our improve-codebase-architecture is the same evidence-backed
        survey.
      flag: null
      reason: null
    analysis:
      blind:
      - Use the design vocabulary terms exactly in every suggestion and avoid the listed substitutes.
        (SKILL.md:13, HTML-REPORT.md:110-112)
      - Do not re-litigate decisions already recorded in decision records. (SKILL.md:14)
      - Scope the scan before scanning, taking a user-named direction when given. (SKILL.md:20-22)
      - Without a direction, mine commit history for hot spots and weight recently changed
        areas, widening if changes are scattered. (SKILL.md:20, SKILL.md:23)
      - Read the domain glossary and local decision records before exploring. (SKILL.md:25)
      - Delegate the codebase walk to a subagent exploring organically for friction. (SKILL.md:27)
      - 'Probe for friction signals: concept-bouncing across small modules, shallow modules,
        testability-only extractions lacking locality, seam leakage, and untested or hard-to-test
        areas. (SKILL.md:29-33)'
      - Apply the deletion test to suspected shallow modules. (SKILL.md:35)
      - Write the report as a self-contained HTML file in the OS temp directory with a timestamped
        name so nothing lands in the repo. (SKILL.md:39, HTML-REPORT.md:3)
      - Open the report for the user with the platform opener and give its absolute path.
        (SKILL.md:39)
      - Build the report with CDN-loaded Tailwind and Mermaid as its only scripts, otherwise
        static. (SKILL.md:41, HTML-REPORT.md:3, HTML-REPORT.md:100)
      - Mix Mermaid for graph-shaped relationships with hand-built HTML/SVG for editorial
        visuals. (SKILL.md:41, HTML-REPORT.md:3)
      - Give every candidate a side-by-side before/after diagram. (SKILL.md:41, SKILL.md:49,
        HTML-REPORT.md:49)
      - Each candidate card carries files, problem, solution, benefits in locality and leverage
        terms, and a recommendation-strength badge of Strong, Worth exploring or Speculative.
        (SKILL.md:43-50, HTML-REPORT.md:44-53)
      - Tag each card with its dependency category. (HTML-REPORT.md:47)
      - End the report with a single top-recommendation card linking to its candidate. (SKILL.md:52,
        HTML-REPORT.md:102-104)
      - Name modules with domain-glossary vocabulary rather than code identifiers. (SKILL.md:54)
      - Surface a candidate that contradicts a decision record only when friction justifies
        reopening it, with a warning callout. (SKILL.md:56, HTML-REPORT.md:53)
      - Propose no interfaces in the report; ask which candidate to explore. (SKILL.md:60)
      - Once a candidate is picked, run an interview over constraints, dependencies, module
        shape, hidden internals and surviving tests. (SKILL.md:64)
      - Add newly named deepened-module concepts and sharpened terms to the glossary inline
        during the interview. (SKILL.md:66-69)
      - When the user rejects a candidate for a durable reason, offer a decision record so
        later reviews do not re-suggest it, skipping ephemeral or self-evident reasons. (SKILL.md:70)
      - Use a report header of repo name, date and a visual legend, with no intro paragraph.
        (HTML-REPORT.md:36-38)
      - Keep card prose to one-sentence problem and solution and wins bullets of six words
        or fewer. (HTML-REPORT.md:50-52)
      - If a diagram needs a paragraph to be understood, redraw it instead of explaining.
        (HTML-REPORT.md:55)
      - Vary diagram patterns across candidates among Mermaid graphs, hand-built boxes, cross-sections,
        mass diagrams and call-graph collapses. (HTML-REPORT.md:57-92)
      - Follow an editorial visual style with restrained colour, about 320px diagrams, and
        schematic uppercase labels. (HTML-REPORT.md:94-99)
      - Phrase wins in glossary terms and avoid generic claims like easier to maintain. (HTML-REPORT.md:121)
      - Strip hedging and convert sentences to bullets and cut bullets where possible. (HTML-REPORT.md:123)
