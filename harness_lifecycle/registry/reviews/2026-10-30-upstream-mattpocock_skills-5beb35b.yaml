  skill:skills/engineering/ask-matt:
    upstream_tree_hash: 7ff2383b40fe9d8f3e753d267d964fb2b44d120a948fd2a57c3b26ddfc318370
    accepted: null
    compared_with: skill-router
    pairing:
      overlap:
        doc:AGENTS.md: 1
        execution: 1
      placement_match:
      - execution
      suggested: execution
      purpose_match: skill-router
      purpose: Upstream ask-matt is a user-invoked router that maps the harness's flows and
        a phase-boundary decision tree for context moves. Our skill-router is the router that
        maps a need to the narrowest skill.
      flag: suggested differs
      reason: Overlap suggests execution on one variant context trait (continue before a lossy
        move) and placement, but execution runs tracked work; the router purpose is skill-router's.
    analysis:
      blind:
      - Before describing a skill or advising that a step be skipped, read that skill's own
        instruction file rather than trusting the router's summary. (SKILL.md:11)
      - A main flow orders work as interview, optional prototype detour, spec, tickets, implementation,
        review and retrospective. (SKILL.md:15-34)
      - Choose the stateful, doc-writing interview when a working directory exists and the
        stateless one when it does not. (SKILL.md:19, SKILL.md:85)
      - Detour through a throwaway prototype when a question needs a runnable answer, bridging
        out and back with a portable handoff file. (SKILL.md:20-23)
      - 'Branch on whether the build spans multiple sessions: if yes, write a spec and split
        it into tickets; if no, implement in the current window. (SKILL.md:24-28)'
      - Work tickets one per fresh context, clearing between them, blockers first. (SKILL.md:26)
      - Alternatively run the whole spec in one orchestrated pass that treats tickets as a
        task graph and fans implementers over the ready frontier onto one integration branch.
        (SKILL.md:27)
      - Keep interview, spec and ticketing in one unbroken context window, not compacting
        or clearing until tickets exist. (SKILL.md:38)
      - Run the retrospective in the session it reviews, before clearing, or point it at that
        session's log afterwards. (SKILL.md:38)
      - If a session nears the roughly 150k-token sharp-reasoning limit before ticketing,
        compact at the nearest phase boundary instead of pushing on degraded. (SKILL.md:40)
      - Triage only issues the user did not author; tickets produced by the ticketing step
        are already agent-ready and skip triage. (SKILL.md:48)
      - After a bug fix, run a retrospective in the same session asking what would have prevented
        it, escalating to architecture work when no good seam exists. (SKILL.md:50)
      - Reserve the map-of-decisions flow for efforts too large for one session, and merge
        its result into spec writing rather than straight into implementation unless the effort
        proved small. (SKILL.md:52-54)
      - Make the context-management decision only at a phase boundary; mid-phase either continue
        or split remaining work to subagents. (PHASE-BOUNDARIES.md:5, SKILL.md:79)
      - 'At a phase boundary choose among five moves: continue, clear, portable handoff, subagent,
        or compact. (PHASE-BOUNDARIES.md:7-15)'
      - Walk an ordered decision tree at the boundary where the first yes wins. (PHASE-BOUNDARIES.md:19)
      - Continue when the next phase needs this phase as a primary source or enough of the
        sharp-reasoning window remains for it. (PHASE-BOUNDARIES.md:21)
      - Clear when everything in the session is disposable for what comes next, noting that
        clearing relevant context irreversibly loses the reasons behind the work. (PHASE-BOUNDARIES.md:23-25)
      - Use a portable handoff only for a harness switch, a directory or repo move, a colleague,
        or forking a side task mid-phase. (PHASE-BOUNDARIES.md:27-34)
      - Send a task to a subagent when it is scoped tightly enough to run unattended, leaving
        the main session untouched. (PHASE-BOUNDARIES.md:36)
      - Compact as the fallback, passing an instruction that tells the summary what the next
        phase needs. (PHASE-BOUNDARIES.md:38-40)
      - Weigh every non-continue move as trading a lossless but noisy primary source for a
        lossy, roomier secondary one. (PHASE-BOUNDARIES.md:42-51)
