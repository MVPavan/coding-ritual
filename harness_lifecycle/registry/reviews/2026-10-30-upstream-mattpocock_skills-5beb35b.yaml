      - Number each question and attach a recommended answer. (SKILL.md:8, SKILL.md:10-22)
      - Wait for the user's answers before the next round. (SKILL.md:8)
      - Format each question with a title, a body that may offer choices, and a separated
        recommendation. (SKILL.md:10-22)
      - Word each question so that answering yes accepts the recommendation. (SKILL.md:24)
      - Recompute the frontier after each round, deferring questions that depend on ones still
        open in the current round. (SKILL.md:26)
      - Look up environment facts yourself through a subagent rather than asking the user.
        (SKILL.md:28)
      - 'Do not block on fact-finding: hold back only questions downstream of the running
        lookup and ask the rest now. (SKILL.md:28)'
      - Put every decision to the user and wait. (SKILL.md:28)
      - End only when the frontier is empty with nothing silently assumed. (SKILL.md:30)
      - Do not act on the result until the user confirms shared understanding. (SKILL.md:30)
