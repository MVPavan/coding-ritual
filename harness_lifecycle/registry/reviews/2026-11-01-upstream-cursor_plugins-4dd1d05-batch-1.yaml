        and that investigator owns exactly one tool (SKILL.md:49)'
      - 'investigator-default-model: The investigator role defaults to `grok-4.7-xhigh-fast`
        (SKILL.md:49)'
      - 'investigator-prompt-assembly: Each investigator''s prompt combines the template,
        one category playbook adapted to the actual tool, the anchor and the original question
        (SKILL.md:51-54)'
      - 'defensive-code-incident-addon: When the target looks defensive, such as guards, retries,
        timeouts, rate limits, flags, egress checks or memory handlers, append the incident
        query guide (SKILL.md:53)'
      - 'category-strength-map: Each category states which shape of motivation it best reveals
        and when it is strongest, which sets expectations and helps name gaps (SKILL.md:58-66)'
      - 'source-control-always-spawned: The source-control investigator always runs, since
        it is the only guaranteed source (SKILL.md:60)'
      - 'written-skip-justification: Skipping an investigator needs an explicit written reason
        that appears in the final sources list (SKILL.md:70)'
      - 'missing-tool-flagged-as-gap: Absence of a tool for a category is reported as a coverage
        gap, with what could not be searched, and not as a choice (SKILL.md:72)'
      - 'provably-irrelevant-bar: A source may be skipped for irrelevance only on proof, as
        probable irrelevance does not qualify (SKILL.md:73)'
      - 'trivial-target-inline-exception: A single-commit target whose PR text fully answers
        the question may be answered directly, but only after confirming all other searches
        would be redundant and saying so (SKILL.md:75)'
      - 'single-synthesizer: One separate agent combines all findings into the answer (SKILL.md:79)'
      - 'synthesizer-default-model: The synthesizer role defaults to `claude-opus-5-5-xhigh`
        (SKILL.md:79)'
      - 'synthesizer-input-package: The synthesizer gets findings including null results and
        justified skips, plus the anchor, the question, the confidence framework and its template
        (SKILL.md:80-84)'
      - 'preserve-confidence-language: The coordinator may lightly edit the synthesis but
        must leave its confidence wording untouched (SKILL.md:88)'
      - 'per-investigator-sources-line: The sources section gives one line per investigator,
        including empty and skipped ones with the reason (SKILL.md:92)'
      - 'change-constraint-set: When the question precedes a code change, convert findings
        into a Preserve, Change, Avoid and Risk list for planning (SKILL.md:94)'
      - 'recency-bias-guard: Do not treat the latest commit as authoritative, and trace the
        earlier decisions that accreted into the current shape (SKILL.md:98)'
      - 'one-tier-per-claim: Every output claim belongs to exactly one confidence tier, which
        decides its section and phrasing (references/epistemics.md:7)'
      - 'direct-tier: A claim is Direct only when an author''s written words state the reason,
        and it is then phrased confidently in present tense with a citation (references/epistemics.md:11-13)'
      - 'supported-tier: A claim is Supported when several indirect items converge with none
        stating it, and it is phrased as derived while citing each item (references/epistemics.md:17-19)'
      - 'inferred-tier: A claim is Inferred when it is a reasonable reading without explicit
        support, and it is phrased with hedges and a visible reasoning chain (references/epistemics.md:23-25)'
      - 'speculative-tier: A claim is Speculative when it is a plausible guess that other
        explanations fit equally well, and it is marked as a guess and usually placed among
        competing hypotheses (references/epistemics.md:29-31)'
      - 'unknown-tier: Searching and finding nothing is a legitimate result, reported with
        exactly what was searched (references/epistemics.md:35-37)'
      - 'confidence-words-need-adjacent-citation: Terms asserting cause, intent, achieved
        effect or group decision are reserved for Direct or Supported claims and sit beside
        a citation (references/epistemics.md:41)'
      - 'hedge-vocabulary-for-inference: An approved set of tentative phrasings marks interpretation
        in the inference section (references/epistemics.md:43)'
      - 'banned-dismissive-words: A short list of words that imply self-evidence or triviality
        is forbidden (references/epistemics.md:47-50)'
      - 'no-first-person-belief: Replace statements of personal opinion with statements about
        what the evidence indicates (references/epistemics.md:51)'
      - 'no-retrofitted-rationale: Do not impose a tidy justification on messy history or
        presume the author chose correctly and reason backward (references/epistemics.md:55)'
      - 'consistency-is-not-intent: A repeated pattern may be copying, so it does not by itself
        show a deliberate choice (references/epistemics.md:55)'
      - 'absence-is-not-evidence: A lack of mention must not be read as proof that something
        was not a concern (references/epistemics.md:55)'
      - 'embedded-hypothesis-check: A guess inside the user''s question is one candidate to
        test independently, then confirm or refute with citations (references/epistemics.md:59)'
      - 'show-both-sides-of-contradictions: Conflicting sources both appear with citations,
        and the user decides between them (references/epistemics.md:63)'
      - 'concrete-gap-record: Each gap names the question, the sources tried, the search terms
        in each and what turned up (references/epistemics.md:67)'
      - 'human-followup-pointer: A reported gap tells the user they may need to ask the author,
        owner or lead, or may drop the question (references/epistemics.md:67)'
      - 'pre-delivery-claim-audit: Before delivery, each claim is checked for a citation,
        or demoted, and for phrasing that matches its tier (references/epistemics.md:71)'
      - 'code-not-evidence-of-own-intent: Remove or reclassify any claim that uses the code''s
        behavior to prove why the code exists (references/epistemics.md:71)'
      - 'empty-gaps-suspicion: An answer that mentions no gaps is treated as a warning sign
        (references/epistemics.md:71)'
      - 'gather-not-conclude: Investigators collect material only, leaving the answer, opinions
        and side-picking to the synthesizer (references/investigator-prompt.md:51)'
      - 'single-source-depth: An investigator goes deep on its assigned source only, knowing
        peers cover others (references/investigator-prompt.md:7)'
      - 'exact-quote-over-summary: A precise quotation with a citation outranks a paragraph
        of paraphrase, and each quote carries a location checkable in seconds (references/investigator-prompt.md:9)'
      - 'wide-then-narrow-search: Begin with a broad sweep, and focus on specific items only
        afterward (references/investigator-prompt.md:36)'
      - 'read-items-in-full: Open each PR, ticket, doc or thread entirely, since the key evidence
        may sit in a comment, subtask or follow-up (references/investigator-prompt.md:37)'
      - 'in-source-links-only: Follow references inside your own source, and log cross-source
        references as leads without chasing them (references/investigator-prompt.md:38)'
      - 'search-log-with-verbatim-queries: Record the exact queries run, and count an empty
        search as a finding (references/investigator-prompt.md:40)'
      - 'record-disagreement-within-source: Keep items that clash, and treat one contradicting
        a pattern as especially valuable (references/investigator-prompt.md:41)'
      - 'counterfactual-strength-test: Before rating a finding strong, ask whether it would
        still appear under a false interpretation and what would look different in that case
        (references/investigator-prompt.md:43)'
      - 'mechanics-are-not-motivation: A diff shows what changed, so seek the reason in messages,
        descriptions, tickets or review comments (references/investigator-prompt.md:47)'
      - 'no-intent-from-code-style: Reading code tells what the target is, and intent may
        be claimed only where an author stated it (references/investigator-prompt.md:48)'
      - 'preserve-ambiguity: Report ambiguous evidence as ambiguous without collapsing it
        to look decisive (references/investigator-prompt.md:49)'
      - 'no-silent-substitution: Do not offer evidence about a neighboring feature as though
        it answers the question asked (references/investigator-prompt.md:50)'
      - 'findings-source-field: The investigator''s report starts by naming the source investigated
        (references/investigator-prompt.md:58)'
      - 'what-i-searched-section: The report states the queries, opened items and places checked,
        which exposes what remains unsearched (references/investigator-prompt.md:61)'
      - 'direct-evidence-record: Each explicit item records its content, location, author,
        date and one-sentence relevance (references/investigator-prompt.md:64-68)'
      - 'circumstantial-evidence-record: Each indirect item records what it is, its location,
        the inference chain and alternative readings (references/investigator-prompt.md:71-75)'
      - 'contradictions-section: The report lists disagreeing items with both citations (references/investigator-prompt.md:78)'
      - 'specific-gaps-section: The report states each failed search with its query and time
        range (references/investigator-prompt.md:81)'
      - 'additional-leads-section: The report hands off pointers meant for another source''s
        investigator or a later pass (references/investigator-prompt.md:84)'
      - 'skipped-sources-input: The synthesizer receives an explicit slot listing unsearched
        sources and why (references/synthesizer-prompt.md:23-25)'
      - 'synthesizer-reads-framework-first: The synthesizer must read the confidence framework
        completely before writing (references/synthesizer-prompt.md:29)'
      - 'citation-required-for-strong-claims: Direct and Supported claims must carry a specific
        citation such as a PR, ticket, URL, permalink, commit or file line (references/synthesizer-prompt.md:32)'
      - 'hedging-required-for-weak-claims: Inferred and Speculative claims must use tentative
        language (references/synthesizer-prompt.md:33)'
      - 'independent-evidence-weighing: The synthesizer forms its own judgment from raw findings,
        which are not conclusions (references/synthesizer-prompt.md:40)'
      - 'one-reference-per-shared-source: When several investigators cite one item, the answer
        gives it a single authoritative reference (references/synthesizer-prompt.md:41)'
      - 'synthesizer-no-side-effects: The synthesizer must not write files, commit or change
        external state (references/synthesizer-prompt.md:44)'
      - 'leave-open-questions-open: Because the user will act on the answer, keep an unresolved
        question unresolved over a confident fill-in (references/synthesizer-prompt.md:45)'
      - 'question-restatement-section: The answer opens by restating the question in a sentence
        or two (references/synthesizer-prompt.md:55)'
      - 'code-orientation-section: The answer gives two or three lines of paths, ranges and
        symbols for a cold reader (references/synthesizer-prompt.md:59)'
      - 'tagged-findings-section: Evidence-backed claims are bulleted with an explicit tier
        tag and a source, separated from inference (references/synthesizer-prompt.md:63-68)'
      - 'inference-section-with-chain: Inferred claims are hedged bullets with their reasoning
        shown, and the section is omitted when empty (references/synthesizer-prompt.md:72-76)'
      - 'competing-hypotheses-section: When the record fits several stories, each gets its
        statement, evidence for and evidence against or missing, with no forced winner (references/synthesizer-prompt.md:80-86)'
      - 'what-we-dont-know-section: A section lists unanswered questions, empty searches and
        unavailable sources with reasons (references/synthesizer-prompt.md:90-94)'
      - 'likely-knowers-listed: The gaps section names people who probably know the answer
        but could not be asked (references/synthesizer-prompt.md:95)'
      - 'sources-consulted-per-category-format: A per-category template gives what was searched
        in each, or a stated reason it was not (references/synthesizer-prompt.md:99-107)'
      - 'confidence-summary: The answer closes with a sentence or two rating confidence by
        sub-claim, including what could not be resolved (references/synthesizer-prompt.md:111-113)'
      - 'pre-return-self-check: A seven-question revision list covers citations, tier phrasing,
        contradictions, gaps, the embedded guess, code-as-intent and tone (references/synthesizer-prompt.md:119-127)'
      - 'repo-evidence-inventory: For repository history, look through commits, PR threads,
        inline markers, decision records, changelogs and ticket ids (references/sources/code-archaeology.md:5-12)'
      - 'tests-as-edge-case-evidence: Test names and assertions are read for the edge cases
        that drove a change (references/sources/code-archaeology.md:9)'
      - 'co-change-signal: Files altered in the same commits are treated as evidence of relatedness
        (references/sources/code-archaeology.md:10)'
      - 'source-control-trust-ranking: Repository history is rated the most trustworthy and
        complete source because of its direct tie to the code (references/sources/code-archaeology.md:14)'
      - 'rename-following-history: Use `git log --follow` to keep history across renames (references/sources/code-archaeology.md:22)'
      - 'pickaxe-string-search: Use `git log -S` to find commits that added or removed an
        exact string (references/sources/code-archaeology.md:25)'
      - 'regex-diff-search: Use `git log -G` to find commits whose diffs match a pattern (references/sources/code-archaeology.md:28)'
      - 'commit-diff-inspection: Use `git show` to view one commit in full (references/sources/code-archaeology.md:34)'
      - 'commit-range-history: Use a two-point `git log -p` to see the changes to a file between
        revisions (references/sources/code-archaeology.md:37)'
      - 'decision-record-search: Search Markdown files for architecture-decision records (references/sources/code-archaeology.md:44)'
      - 'marker-comment-scan: Search the target file with surrounding context for TODO-style
        markers (references/sources/code-archaeology.md:47)'
      - 'related-test-search: Search test files for the target symbol (references/sources/code-archaeology.md:50)'
      - 'warehouse-source-inventory: The warehouse playbook lists product events, usage and
        billing events, experiment data, system tables and pipeline lineage as places to look
        (references/sources/databricks.md:7-11)'
      - 'unqueryable-notebooks-as-gap: A rationale suspected to live in Databricks notebooks
        is reported as a gap, since the SQL tool cannot see them (references/sources/databricks.md:12)'
      - 'poll-long-query-handle: When the Databricks SQL tool returns a statement id, poll
        for the result without re-running the query (references/sources/databricks.md:16)'
      - 'probe-schema-before-query: Confirm table and column names with listing and describe
        statements, and never report from an unverified table (references/sources/databricks.md:18-23)'
      - 'time-bound-warehouse-queries: Every query filters to a window around the ship date,
        usually about thirty days each side and wider only with strong reason (references/sources/databricks.md:25)'
      - 'prefer-typed-models-over-raw: Query the deduplicated typed dbt models, dropping to
        raw events only when no model exists or refresh lag matters (references/sources/databricks.md:27)'
      - 'dbt-model-column-conventions: A reference lists the standard columns, property naming
        and client-context fields to save a describe round-trip (references/sources/databricks.md:29-33)'
      - 'usage-trajectory-pattern: Plot daily event counts around the merge, reading a sudden
        rise as launch and a decay as deprecation (references/sources/databricks.md:39)'
      - 'threshold-origin-distribution: Compare the pre-PR median, p99 and maximum of a property
        with a guard''s constant to see if the number came from data (references/sources/databricks.md:40)'
      - 'experiment-exposure-lookup: Find the exposure table, then pull counts by variant
        for the flag near the PR date (references/sources/databricks.md:41)'
      - 'query-history-evidence: For data moves or performance rewrites, filter past executed
        queries to a tight window and rank by duration or bytes read (references/sources/databricks.md:42)'
      - 'lineage-lead-handback: A dbt model''s rationale in git is handed to the source-control
        investigator instead of being pursued (references/sources/databricks.md:43)'
      - 'error-count-drop-signal: A fall in an error-classifying event after a defensive PR
        counts as evidence that it resolved that class (references/sources/databricks.md:49)'
      - 'flag-decision-row-signal: An exposure row showing a shipped or concluded decision
        for the target''s flag around ship date counts as good evidence (references/sources/databricks.md:50)'
      - 'instrumentation-does-not-prove-cause: Logging of an event shows interest only, so
        pair it with a commit or PR citation before claiming causation (references/sources/databricks.md:54)'
      - 'silent-instrumentation-check: Before reading a volume jump as a launch, check for
        PRs that merely began logging in that window (references/sources/databricks.md:55)'
      - 'schema-drift-awareness: A property on today''s model may be missing from older data,
        or be found only in the raw JSON (references/sources/databricks.md:56)'
      - 'refresh-lag-fallback: For very recent events, query the raw table and deduplicate
        by id because the models update on a schedule (references/sources/databricks.md:57)'
      - 'retention-cliff-is-gap: A window older than the data''s retention or the model''s
        creation is reported as a gap so that it is not read as no activity (references/sources/databricks.md:59)'
      - 'warehouse-finding-record: Each result records type, table, exact query, window, ship-date
        correlation and strength as direct, circumstantial or weak (references/sources/databricks.md:65-70)'
      - 'numeric-summary-no-raw-rows: Report compact counts, percentiles and first and last
        timestamps, without dumping rows (references/sources/databricks.md:68)'
      - 'telemetry-artifact-inventory: Look through metrics, monitors, dashboards, traces,
        logs, incidents and notebooks, where a metric''s or monitor''s mere existence shows
        concern (references/sources/datadog.md:7-13)'
      - 'owning-service-first: Begin by finding the responsible services and their dependencies
        (references/sources/datadog.md:19-24)'
      - 'dashboards-and-monitors-before-raw-data: Check curated views next and note their
        thresholds, which often explain a clamped value (references/sources/datadog.md:26-33)'
      - 'metric-timeline-correlation: Compare a metric''s trajectory with the change date
        as supporting evidence (references/sources/datadog.md:35-43)'
      - 'narrow-time-bounded-logs: Use log pattern search on symbols or error text within
        a window around the change, aggregating only for counts (references/sources/datadog.md:45-52)'
      - 'span-and-trace-inspection: Use span statistics and specific traces for timeout, retry,
        slow-path and cross-service questions (references/sources/datadog.md:54-62)'
      - 'incident-search-for-defensive-code: For defensive targets, search incidents around
        the time the code was added (references/sources/datadog.md:64-71)'
      - 'monitor-matches-constraint-signal: A monitor whose condition mirrors the code''s
        limit counts as good evidence (references/sources/datadog.md:75)'
      - 'author-dashboard-signal: A dashboard by the target''s author whose widgets track
        what the code guards counts as good evidence (references/sources/datadog.md:76)'
      - 'spike-then-stable-signal: A production spike just before merge followed by stable
        values counts as good evidence (references/sources/datadog.md:77)'
      - 'incident-reference-signal: An incident naming the code, its symbols or its error
        strings counts as good evidence (references/sources/datadog.md:78)'
      - 'preceding-log-pattern-signal: A pre-change log pattern the guard would prevent counts
        as good evidence (references/sources/datadog.md:79)'
      - 'correlation-needs-neighbor-check: A before-and-after shift is only suggestive, so
        inspect other PRs landing in the same window (references/sources/datadog.md:83)'
      - 'chart-framing-caution: A chart shows what its creator cared about and does not explain
        a particular line of code (references/sources/datadog.md:84)'
      - 'vanished-telemetry-is-gap: Data missing for the relevant window because of renames,
        deletion or short retention counts as a gap and not a null result (references/sources/datadog.md:85)'
      - 'aggressive-log-narrowing: Limit log lookups with service, tag and date filters, and
        aggregate in place of raw dumps (references/sources/datadog.md:86)'
      - 'measured-not-caused: A metric proves interest only, so check it against commit and
        PR dates (references/sources/datadog.md:87)'
      - 'telemetry-finding-record: Each item records type, name, identifier, owner, dates,
        the bearing condition or query, and how strong the connection is (references/sources/datadog.md:92-97)'
      - 'incident-ticket-labels: Look for tracker items labelled as incident, severity, postmortem
        action or reliability (references/sources/incident-postmortem.md:3)'
      - 'incident-channel-date-search: Search severity and incident channels near the date
        the target first appeared (references/sources/incident-postmortem.md:4)'
      - 'incident-commit-message-signals: Treat commit subjects about incidents, added guards,
        or a revert followed by a re-application as strong signals (references/sources/incident-postmortem.md:5)'
      - 'ticket-evidence-inventory: Tracker evidence includes descriptions, attached project
        docs, hierarchy, comments, labels, status updates and linked PRs (references/sources/linear.md:5-11)'
      - 'linked-tickets-first: Fetch ticket ids named in seed commits or PRs before anything
        else, including their comments (references/sources/linear.md:19)'
      - 'multi-phrasing-ticket-search: Search by feature name, symbol and business term using
        several wordings (references/sources/linear.md:20)'
      - 'walk-up-to-parent-ticket: From a tactical sub-issue, fetch the parent, which often
        carries the motive (references/sources/linear.md:21)'
      - 'read-project-documents: Check documents attached to an issue''s project, where specs
        often sit (references/sources/linear.md:22)'
      - 'labels-and-milestones-as-motive: Read labels for the type of motive and milestones
        for deadlines (references/sources/linear.md:23)'
      - 'ticket-good-evidence-shapes: Good evidence includes a stated business problem, a
        recorded decision comment, an initiative-named parent, an attached spec and motive-bearing
        labels (references/sources/linear.md:27-31)'
      - 'ticket-scope-drift-check: Read a ticket''s whole history because it may have reopened
        with a different scope (references/sources/linear.md:35)'
      - 'boilerplate-rationale-discount: Generic text in a mandatory rationale field is not
        accepted as a real answer (references/sources/linear.md:36)'
      - 'stale-ticket-date-check: Compare ticket dates with the code''s ship date, since old
        plans change (references/sources/linear.md:37)'
      - 'follow-duplicate-chains: Trace closed-as-duplicate links to the canonical ticket
        (references/sources/linear.md:38)'
      - 'inaccessible-item-as-gap: Report tickets you cannot access as a gap and do not guess
        at their contents (references/sources/linear.md:39)'
      - 'ticket-finding-record: Each ticket records id, title, exact motive quote, labels,
        parent, project, author, dates and link (references/sources/linear.md:44-48)'
      - 'document-evidence-inventory: Long-form evidence includes requirement docs, specs,
        decision records, meeting notes, team pages, postmortems, runbooks and strategy docs
        (references/sources/notion.md:5-12)'
      - 'document-keyword-set: Query by feature, symbols, author handles, error or user-facing
        terms, and time bounds when the ship date is known (references/sources/notion.md:20-25)'
      - 'read-full-page-not-preview: Fetch whole pages, since reasoning often sits mid-document
        (references/sources/notion.md:26)'
      - 'follow-backlinks-and-subpages: Check child pages and backlinks for alternatives,
        appendices and implementation notes (references/sources/notion.md:27)'
      - 'query-meeting-note-databases: Query related databases for meeting notes about the
        decision (references/sources/notion.md:28)'
      - 'author-personal-spaces: Check the PR author''s personal notes for earlier exploratory
        thinking (references/sources/notion.md:29)'
      - 'document-good-evidence-shapes: Good evidence includes a matching problem section,
        rejected approaches, a postmortem naming the fix, dated decision notes and a filled
        decision record (references/sources/notion.md:33-37)'
      - 'outdated-doc-cross-check: Compare a spec with the actual PR because specs often predate
        implementation and go stale (references/sources/notion.md:41)'
      - 'doc-reality-divergence-flag: When a document and the code differ, flag it for the
        synthesizer to surface (references/sources/notion.md:42)'
      - 'specificity-over-template-fluff: Discount filler in required sections and look for
        specific content (references/sources/notion.md:43)'
      - 'broad-search-for-unlinked-docs: Use broad keywords because the best document may
        have no inbound link (references/sources/notion.md:44)'
      - 'pick-final-draft-by-date: Among several documents on a topic, use the finalized or
        most recently updated one (references/sources/notion.md:45)'
      - 'restricted-page-as-gap: Log a page you cannot open as a gap (references/sources/notion.md:46)'
      - 'document-finding-record: Each document records title, URL, authors, update date,
        verbatim motive with its location, linked pages and final or draft status (references/sources/notion.md:51-55)'
      - 'orient-org-and-project: When the error-tracker project and organization are unknown,
        look them up first (references/sources/sentry.md:7-12)'
      - 'error-query-construction: Build searches from handled exception classes, function
        or class names, checked messages and the file path (references/sources/sentry.md:20)'
      - 'error-lifecycle-against-ship-date: Check first and last seen, affected releases and
        frequency trend to see if the stop lines up with the change (references/sources/sentry.md:22-29)'
      - 'stack-trace-relevance-check: Open a full event to see if its trace crosses the target
        and its tags and breadcrumbs match the guarded condition (references/sources/sentry.md:31-37)'
      - 'release-cross-reference: Compare releases near the commit date with the PR''s merge
        date (references/sources/sentry.md:39-45)'
      - 'ai-root-cause-as-hypothesis-only: Use Seer analyses sparingly as inference, with
        actual events and traces as the primary evidence (references/sources/sentry.md:47-53)'
      - 'error-finding-record: Each issue records id, title, project, seen timestamps, event
        count with sampling, releases, a verbatim trace excerpt, ship-date correlation, link
        and author notes (references/sources/sentry.md:58-66)'
      - 'inspect-chat-tool-schema-first: Chat tooling varies, so check which one exists and
        its schema, and whether it needs authentication, before searching (references/sources/slack.md:5)'
      - 'auth-failure-stop-and-report: If the tool cannot authenticate, stop and report it
        as unsearchable, inventing no findings (references/sources/slack.md:17)'
      - 'author-bounded-chat-search: Search the PR author''s messages around the merge date
        to shrink the scope (references/sources/slack.md:7)'
      - 'pr-url-chat-search: Search for the PR''s link or number (references/sources/slack.md:8)'
      - 'error-string-chat-search: Search for an error string the code handles, which tends
        to surface incident threads (references/sources/slack.md:9)'
      - 'chat-retention-note: Report the date before which messages appear to have been deleted
        by retention (references/sources/slack.md:13)'
      - 'private-messages-known-limitation: Accept that decisions in private messages cannot
