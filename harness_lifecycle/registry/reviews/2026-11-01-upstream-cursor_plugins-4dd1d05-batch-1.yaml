      purpose: Upstream edits text by numbered rules to remove patterns that read as machine-written.
        Ours has no such unit until prose-pass is built; authoring-for-agents owns agent-facing
        text only.
      flag: suggested differs
      reason: 'Compared with none: prose-pass, the row target, does not exist yet, and --with
        takes only an existing skill. Suggested html-artifact by the computed signals only.
        Blind lines dropped as not traits: `scan-then-rewrite` (Not material: the order of
        one edit pass, with no gate or output of its own.).'
    analysis:
      blind:
      - 'preserve-meaning-and-tone: Edits keep the original sense and fit the intended tone
        (SKILL.md:9)'
      - 'stable-rule-numbers: Rule numbers are permanent identifiers that other documents
        can cite, and deleting a rule leaves its number unused (SKILL.md:13)'
      - 'rule-3-trailing-participle-clauses: Rule 3 deletes, or backs with real sources, tacked-on
        present-participle phrases that claim significance (SKILL.md:17)'
      - 'rule-5-unnamed-authorities: Rule 5 requires naming the source of any claim credited
        to unnamed groups, or deleting the claim (SKILL.md:18)'
      - 'rule-7-machine-vocabulary-list: Rule 7 replaces a fixed list of overused elevated
        words with plain ones (SKILL.md:22)'
      - 'rule-8-inflated-copulas: Rule 8 swaps grand verbs standing in for being or having
        with those two plain verbs (SKILL.md:23)'
      - 'rule-9-negative-parallelism: Rule 9 removes the two-part construction that denies
        one thing to promote another, and states the point straight (SKILL.md:24)'
      - 'rule-10-forced-triads: Rule 10 lists as many items as naturally exist and does not
        force a group of three (SKILL.md:25)'
      - 'rule-11-synonym-cycling: Rule 11 keeps one term for one referent and does not rotate
        through synonyms (SKILL.md:26)'
      - 'rule-12-false-ranges: Rule 12 replaces a span construction lacking a real scale with
        a direct list (SKILL.md:27)'
      - 'rule-13-no-em-dashes: Rule 13 bans em dashes and their substitutes, including parentheses,
        en dashes and hyphens as dashes, leaving only periods and commas to separate thoughts
        (SKILL.md:31)'
      - 'rule-14-colon-restraint: Rule 14 allows colons before lists or examples and rewrites
        mid-sentence uses, also removing comparison framing (SKILL.md:32)'
      - 'rule-15-boldface-restraint: Rule 15 stops bolding every proper noun or acronym (SKILL.md:33)'
      - 'rule-16-inline-header-lists: Rule 16 converts bullets whose bold label merely restates
        the line into prose, while allowing a period-ended label followed by new detail (SKILL.md:34)'
      - 'rule-17-sentence-case-headings: Rule 17 requires sentence case in headings (SKILL.md:35)'
      - 'rule-18-no-decorative-emoji: Rule 18 strips ornamental emoji from headings and bullets
        (SKILL.md:36)'
      - 'rule-19-straight-quotes: Rule 19 replaces typographic quotation marks with straight
        ones (SKILL.md:37)'
      - 'rule-20-chatbot-phrases: Rule 20 removes assistant pleasantries, offers of further
        help and excited discovery lines (SKILL.md:41)'
      - 'rule-22-no-flattery: Rule 22 drops praise and agreement openers, and answers directly
        (SKILL.md:42)'
      - 'rule-23-filler-phrases: Rule 23 shortens wordy stock phrases and deletes empty importance
        announcements (SKILL.md:46)'
      - 'rule-24-stacked-hedges: Rule 24 reduces piled-up qualifiers to a single modal (SKILL.md:47)'
      - 'rule-25-generic-conclusions: Rule 25 replaces optimistic sign-offs with specific
        plans or facts (SKILL.md:48)'
      - 'rule-26-abstract-metaphor-nouns: Rule 26 replaces a listed set of pseudo-technical
        figurative nouns with their concrete equivalents (SKILL.md:52)'
      - 'rule-27-mechanism-over-feeling: Rule 27 rewrites sentences that convey an impression
        so that they state a mechanism or number, and cuts any that cannot become an instruction,
        fact or figure (SKILL.md:56)'
      - 'rule-27-portability-test: Also under rule 27, a sentence that would fit another project''s
        docs without change gets cut (SKILL.md:56)'
      - 'rule-28-one-idea-per-sentence: Rule 28 splits or trims any sentence the reader must
        reread to parse (SKILL.md:57)'
      - 'rule-29-active-voice: Rule 29 turns passive constructions into ones naming the actor,
        keeping passive only for an actor nobody knows or cares about (SKILL.md:58)'
      - 'rule-30-adverbs-to-strong-verbs: Rule 30 cuts adverbs, using a stronger verb or the
        measured figure in their place (SKILL.md:59)'
      - 'rule-31-plain-word-choice: Rule 31 swaps fancier synonyms for common words (SKILL.md:60)'
      - 'rule-32-literal-over-mannered: Rule 32 replaces aphorisms, rhetorical fragments,
        personified code, figurative verbs and stock framing with literal phrasing (SKILL.md:61)'
      - 'rule-33-no-over-compression: Rule 33 restores articles, verbs and whole sentences
        and spells out arrows, symbols and abbreviations (SKILL.md:62)'
