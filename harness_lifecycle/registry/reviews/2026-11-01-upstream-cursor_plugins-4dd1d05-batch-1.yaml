  the sketch branch of codebase-design and Feature's build step, each adopted trait in our
  words. The owner rules the recommendations as one set, naming only the exceptions. A row
  aimed at a unit not yet built carries guide `ok` and no rewording (a pending rewording cannot
  hash a missing target), and a modified adopt names its variant in `reason` and `modification`,
  with `via` null because its fact is absent.
