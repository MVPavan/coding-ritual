    analysis:
      blind:
      - 'senior-onboarding-altitude: Pitch the answer so an experienced engineer new to the
        area gains a working mental model, stopping short of a line-by-line source commentary
        (SKILL.md:9)'
      - 'read-only-helpers: Every spawned helper is a general-purpose agent locked to read-only
        access (SKILL.md:11)'
      - 'role-model-config-lookup: Each helper role reads its model from a named line in a
        shared model-config rule, falling back to a stated default when the rule or line is
        absent (SKILL.md:11)'
      - 'explorer-default-model: The explorer role defaults to `grok-4.7-xhigh-fast` (SKILL.md:11)'
      - 'explainer-default-model: The explainer role defaults to `claude-opus-5-5-xhigh` (SKILL.md:11)'
      - 'model-alias-leaves-field-unset: When the configured value is an alias such as `auto`
        or `inherit-parent`, the spawn omits its model field (SKILL.md:11)'
      - 'rejected-model-fallback-chain: If the spawn tool refuses a model id, use the default
        and disclose the swap, and if the default is refused too, take the nearest same-family
        id from the error text (SKILL.md:11)'
      - 'per-helper-reasoning-and-speed: Set each helper''s thinking depth and its speed tier
        to suit its job, following a separate mode skill''s guidance (SKILL.md:11)'
      - 'announce-interpretation-and-proceed: When scope is unclear, state the reading you
        took and keep exploring so that the user can redirect afterward (SKILL.md:15)'
      - 'complexity-triage: Sort the question into simple, meaning one module or a narrow
        query, or complex, meaning multi-file, cross-cutting or a full overview, and route
        it accordingly (SKILL.md:17-18)'
      - 'single-agent-simple-path: For a simple question, skip the explorers and spawn one
        explainer that both investigates and writes in a single pass (SKILL.md:17)'
      - 'tie-breaks-to-simple-path: An uncertain complexity call resolves to the cheaper path
        (SKILL.md:20)'
      - 'angle-decomposition: For a complex question, divide the subsystem into two to four
        distinct slices, one per explorer (SKILL.md:24)'
      - 'wait-for-all-before-synthesis: Writing starts only after every explorer has reported
        (SKILL.md:28)'
      - 'single-synthesizing-explainer: One explainer receives all explorer findings and writes
        the only answer (SKILL.md:28)'
      - 'present-with-light-edits-only: The coordinator passes the explainer''s text on with
        minor clarity or context edits and no substantial rewrite (SKILL.md:32)'
      - 'drop-inapplicable-sections: The fixed answer structure may lose any section that
        does not apply to the question (SKILL.md:36)'
      - 'merge-overlapping-findings: The explainer folds duplicated explorer descriptions
        and separate slices into one unified account (references/explainer-prompt.md:19)'
      - 'resolve-contradictions-in-code: When explorers disagree, the explainer settles the
        conflict by checking the code itself (references/explainer-prompt.md:19)'
      - 'targeted-gap-checks-no-reexploration: The explainer may read and search to confirm
        a detail or fill a hole, without redoing the exploration (references/explainer-prompt.md:23)'
      - 'overview-section-as-read-decision: Open with one or two paragraphs covering what
        the thing is, its job and its reason for existing, enough for a reader to decide whether
        to continue (references/explainer-prompt.md:30)'
      - 'key-concepts-section: Give short definitions of only those types, services and abstractions
        needed to follow the rest (references/explainer-prompt.md:33)'
      - 'flow-walkthrough-section: The longest section traces the trigger, the ordered steps,
        the data path and the decision points (references/explainer-prompt.md:36)'
      - 'prose-with-code-pointers: Describe flow in prose naming specific files and functions,
        with no pseudocode and with code blocks only where a snippet is indispensable (references/explainer-prompt.md:38)'
      - 'conditional-flow-diagram: Add a mermaid diagram for structured multi-component flows,
        or ASCII for simple relationships, and omit it when prose already suffices (references/explainer-prompt.md:40)'
      - 'starter-file-map: Provide a short map limited to the files and directories needed
        to begin working in the area (references/explainer-prompt.md:43)'
      - 'gotchas-section-if-any: List surprising behavior, history and pitfalls, omitting
        the section when there is nothing to report (references/explainer-prompt.md:46)'
      - 'name-concrete-actors: Use actual component and method names rather than generic role
        nouns or abstract talk about abstractions (references/explainer-prompt.md:50-51)'
      - 'explain-the-cause-of-complexity: When something is hard, give the reason for the
        difficulty and do not merely describe it (references/explainer-prompt.md:52)'
      - 'surface-open-questions: Gaps and open questions from explorers stay visible in the
        final explanation (references/explainer-prompt.md:55)'
      - 'assigned-angle-only: Each explorer knows peers cover other slices and goes deep on
        its own without trying for full coverage (references/explorer-prompt.md:7)'
      - 'component-inventory-output: The explorer lists key abstractions, each with its name,
        location and a brief purpose (references/explorer-prompt.md:20)'
      - 'step-trace-output: The explorer reports execution as ordered steps giving function,
        file, action, next call and the data passed along (references/explorer-prompt.md:23)'
      - 'files-read-log: The explorer records every file it read for the explainer''s use
        (references/explorer-prompt.md:26)'
      - 'boundaries-output: The explorer reports where the subsystem connects to the rest
        of the codebase, with inputs and outputs (references/explorer-prompt.md:29)'
      - 'non-obvious-output: The explorer calls out behavior that is surprising, historically
        motivated or easily misread (references/explorer-prompt.md:32)'
      - 'open-questions-output: The explorer honestly declares what it failed to trace (references/explorer-prompt.md:35)'
