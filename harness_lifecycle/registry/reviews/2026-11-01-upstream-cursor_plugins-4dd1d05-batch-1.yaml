  skill:pstack/skills/architect:
    upstream_tree_hash: 5c11a2714696b0c7108e9b906707340ff3f558d60f81888947db0a0f95763fa9
    accepted: null
    compared_with: codebase-design
    pairing:
      overlap:
        authoring-for-agents: 1
        codebase-design: 1
        principle-boundary-discipline: 4
        principle-minimize-reader-load: 1
        principle-model-the-domain: 1
        principle-separate-before-serializing-shared-state: 2
        principle-subtract-before-you-add: 1
        principle-type-system-discipline: 1
      placement_match:
      - codebase-design
      - design-evolve
      - domain-modeling
      - principle-boundary-discipline
      - principle-make-operations-idempotent
      - principle-minimize-reader-load
      - principle-model-the-domain
      - principle-redesign-from-first-principles
      - principle-separate-before-serializing-shared-state
      - principle-type-system-discipline
      - prototype
      suggested: principle-boundary-discipline
      purpose_match: codebase-design
      purpose: Upstream sketches types, signatures and module shape through parallel runners
        and then implements against the result. Our codebase-design is the lens for the same
        module-interface decisions and gains a sketch branch that stops before code (ruling
        5).
      flag: suggested differs
      reason: Compared with codebase-design by purpose. Overlap is one trait, depth-as-leverage,
        against four for principle-boundary-discipline, whose traits units cite and never
        list. Suggested principle-boundary-discipline by the computed signals only.
    analysis:
      blind:
      - 'stub-body-design-sketch: Draft types, signatures, classes and module edges using
        unimplemented bodies and pseudocode before writing real code (SKILL.md:9)'
      - 'phase-todolist-at-start: Open a task list with one item for each of five phases before
        beginning (SKILL.md:13-19)'
      - 'grounding-gate: Understand each affected system through a full architectural explanation,
        and do not count naming a file as grounding (SKILL.md:23)'
      - 'rationale-grounding-for-ownership-changes: When a design changes who owns what or
        how layers divide, also investigate why the existing shape exists so that its reason
        becomes a constraint (SKILL.md:23)'
      - 'greenfield-grounding-exception: Grounding may be skipped only for true greenfield
        work with nothing to integrate (SKILL.md:25)'
      - 'multi-model-candidate-competition: Produce candidates through parallel runners on
        different models, fed the grounding artifacts and synthesized into one design package
        (SKILL.md:29)'
      - 'runner-model-config-line: Runner models come from a dedicated line in the shared
        model-config rule, overriding the competition''s generic runner line (SKILL.md:31)'
      - 'runner-default-model-pair: Without that line, the runners are `claude-opus-5-5-xhigh`
        and `grok-4.7-xhigh-fast` (SKILL.md:31)'
      - 'at-least-two-distinct-designs: Require two or more structurally different candidates
        before synthesis even if the first looks adequate (SKILL.md:33)'
      - 'whole-shape-alternatives: Alternatives must differ in overall shape, and variations
        inside one shape do not qualify (SKILL.md:33)'
      - 'red-flag-screen-before-synthesis: Check every candidate against a design-flaw list
        before combining them (SKILL.md:35)'
      - 'agent-contributor-assumption: Judge designs assuming the next editor is an agent
        that sees only opened files, imitates whatever example is closest and picks the quickest
        route that compiles (SKILL.md:35)'
      - 'locally-right-is-globally-right: Prefer a design in which an edit that seems correct
        from one file is correct for the repository (SKILL.md:35)'
      - 'interface-depth-comparison: Rank viable candidates by how much complexity sits behind
        how small a public surface (SKILL.md:37)'
      - 'rich-interface-over-layers: A capable interface may be preferred because it keeps
        call chains short by gathering capability in one place (SKILL.md:37)'
      - 'synthesis-decision-recorded: The combination step''s decision is written into the
        rationale (SKILL.md:39)'
      - 'no-checkpoint-by-default: Implementation follows the synthesized design with no human
        stop (SKILL.md:43)'
      - 'opt-in-signoff-checkpoint: If the invoker explicitly asks, show the synthesized design
        and wait for approval (SKILL.md:45)'
      - 'scaffold-as-own-commit: The synthesized sketch may be committed separately before
        implementation (SKILL.md:47)'
      - 'planned-breakage-during-fill-in: Scoped, planned breakage while filling in the sketch
        is acceptable (SKILL.md:47)'
      - 'pushback-triggers-regrounding: Human objection to the shape, during or after a checkpoint,
        counts as grounding evidence and forces a return to grounding and sketching before
        more code (SKILL.md:49)'
      - 'sketch-as-contract: Implementation replaces stubs and pseudocode, and the agreed
        sketch governs that work (SKILL.md:53)'
      - 'surface-deviations-with-triage: Raise any departure from the sketch and ask if the
        fault lies with the sketch, an overlooked requirement or an overreaching implementation
        (SKILL.md:53)'
      - 'scrap-on-persistent-friction: Discard the sketch when implementation repeatedly produces
        friction it cannot absorb, without patching a wrong design (SKILL.md:57)'
      - 'pattern-not-instance-threshold: The scrap decision rests on recurrence and not on
        isolated problems, and a few edge cases or complex data do not condemn a design (SKILL.md:59)'
      - 'tell-repeated-workaround: The same workaround form recurring across unrelated code
        signals a wrong design (SKILL.md:61)'
      - 'tell-special-case-branches: Several unrelated edge cases each needing a special branch
        signals a wrong design (SKILL.md:62)'
      - 'tell-type-escape-hatches: Types that compile only with loose types, casts or fields
        that are optional yet always set signal a wrong design (SKILL.md:63)'
      - 'tell-lock-on-unshared-state: Wanting a lock on state the sketch called unshared signals
        a wrong design (SKILL.md:64)'
      - 'tell-callers-know-internals: Callers needing the abstraction''s internal rules signals
        a wrong design (SKILL.md:65)'
      - 'tell-repeated-deviations: Two or more independent departures of the same form signal
        a wrong design (SKILL.md:66)'
      - 'scrap-reexplain-what-exists: After scrapping, produce a fresh explanation of what
        has been built (SKILL.md:72)'
      - 'redesign-with-day-one-assumptions: Redesign as though the newly learned constraints
        had been known from the beginning (SKILL.md:73)'
      - 'shrink-before-growth: The replacement sketch must first shrink below the old sketch''s
        size, and only then expand (SKILL.md:74)'
      - 'rerun-competition-after-scrap: Return to the candidate competition after scrapping
        (SKILL.md:75)'
      - 'output-scales-with-change-size: Small changes yield one file of types and signatures,
        and larger work yields a module map plus type definitions (SKILL.md:79)'
      - 'rationale-ships-with-sketch: A prose rationale accompanies the type sketch as a deliverable
        (SKILL.md:79)'
      - 'red-flag-means-revise-or-reject: Any hit on the design-flaw list is grounds to rework
        or drop the shape (references/design-red-flags.md:3)'
      - 'shallow-module-flag: Reject wide interfaces hiding little, judging depth by hidden
        capability and policy relative to surface size (references/design-red-flags.md:7)'
      - 'deep-module-not-deep-call-chain: Distinguish concentrating capability behind one
        interface from spreading understanding across layers (references/design-red-flags.md:9)'
      - 'shallow-module-signs: Signs of shallowness are callers coordinating several methods
        for one operation, options exposing internal stages and an interface that does not
        spare learning the implementation (references/design-red-flags.md:13-15)'
      - 'information-leakage-flag: Reject designs in which one internal decision appears in
        several modules and changing it needs coordinated edits (references/design-red-flags.md:19)'
      - 'no-wire-types-in-public-api: Keep transport types, storage layouts, framework values
        and protocol specifics private, and convert external data to domain types behind the
        interface (references/design-red-flags.md:21)'
      - 'temporal-decomposition-flag: Reject modules organized by execution order, and group
        by owned knowledge even when methods run at different times (references/design-red-flags.md:25-27)'
      - 'pass-through-method-flag: Remove same-shape forwarding methods, unless they add policy,
        adaptation or a distinct abstraction (references/design-red-flags.md:31-33)'
      - 'split-ownership-flag: Each piece of state gets one owner, so that others read it
        or request changes, and neither duplicate writers nor copies arise (references/design-red-flags.md:37-39)'
      - 'two-ways-flag: Keep a single way to do a task, moving callers off and deleting the
        others in the same change (references/design-red-flags.md:43-45)'
      - 'importable-internals-flag: Make internals unreachable so that an outside import fails
        the build (references/design-red-flags.md:49-51)'
      - 'hand-synced-list-flag: Derive duplicate lists from one, or make the build fail when
        underivable lists disagree (references/design-red-flags.md:55-57)'
      - 'one-page-rationale: The rationale is limited to one page with sentence-case headings
        and no boilerplate (references/rationale-template.md:3)'
      - 'problem-section-with-constraints: One paragraph states the goal, what makes the shape
        non-obvious and any grounding constraints such as interop types, unbreakable callers
        and invariants (references/rationale-template.md:7)'
      - 'usage-first-spec: Write a quickstart and two or three realistic call sites before
        the types, derive the types from them, and reconcile any divergence toward the usage
        (references/rationale-template.md:11)'
      - 'shape-section-data-first: Describe the architecture beginning with data structures,
        then the flow of data through signatures, naming the load-bearing decisions (references/rationale-template.md:15)'
      - 'invariant-validation-and-non-goal-statement: State which invariants live in types,
        where validation sits and what the system deliberately omits (references/rationale-template.md:15)'
      - 'explicit-interface-depth-judgment: State what the surface hides, what it exposes
        and why it is no larger than needed (references/rationale-template.md:15)'
      - 'cite-principle-no-restatement: Attach the governing principle to each decision by
        name without repeating it (references/rationale-template.md:15)'
      - 'synthesis-decision-section: Record the chosen base candidate with its reason, what
        was grafted from the rest and the reasons for each rejection (references/rationale-template.md:19)'
      - 'accepted-tradeoff-bullets: Each tradeoff is one bullet in an accept-this-in-exchange-for-that
        form, including choices a later reader might mistake for an oversight (references/rationale-template.md:23)'
      - 'required-alternatives-section: Name at least one concrete losing shape with a one-line
        reason, judged on interface depth, excluding flavors of one shape and other runners''
        candidates (references/rationale-template.md:27)'
      - 'forced-answer-phrasing: When constraints allow just one alternative, say explicitly
        that it was the only viable shape and why (references/rationale-template.md:27)'
      - 'open-questions-phrased-as-questions: Items and risks needing human judgment are posed
        as questions, so that the reply resolves them (references/rationale-template.md:31)'
      - 'one-sentence-next-step: State in one sentence what gets built first from the sketch
        (references/rationale-template.md:35)'
      - 'isolated-runner-workspace: Each runner works in its own git worktree or, failing
        that, a per-runner subdirectory, so that candidates stay independent (references/runner-prompt.md:3)'
      - 'runner-reads-workflow-first: A runner reads the enclosing design workflow in full
        before starting (references/runner-prompt.md:5)'
      - 'candidate-package-contents: Each runner delivers a type sketch, signatures, a module
        map and a templated rationale (references/runner-prompt.md:5)'
      - 'discipline-axes-for-base-selection: The orchestrator compares candidates on the listed
        design disciplines to choose a base (references/runner-prompt.md:7)'
      - 'data-structures-first: Settle core types first and trace each dominant access pattern
        through them, treating a planned future map, index or cache as proof that the structure
        is wrong (references/runner-prompt.md:10)'
      - 'pull-complexity-into-callee: Favor a simple interface even when the implementation
        becomes harder (references/runner-prompt.md:11)'
      - 'per-actor-state-with-read-merge: If two actors might write the same state and the
        outcome is not harmless, default to separate state merged at read time (references/runner-prompt.md:12)'
      - 'visible-boundaries-in-sketch: Use unimplemented errors, TODO pseudocode and intent-and-invariant
        doc comments so that data can be traced by reading only types and signatures (references/runner-prompt.md:13)'
      - 'invariant-enforcement-ranking: Prefer hard-to-misuse types over runtime checks, and
        runtime checks over comments (references/runner-prompt.md:14)'
      - 'validate-at-boundaries-trust-inside: Check data at the edge and rely on types internally
        (references/runner-prompt.md:15)'
      - 'pure-core-thin-shell: Write business logic as pure functions behind a thin outer
        layer (references/runner-prompt.md:15)'
      - 'single-source-of-truth: Each invariant has one authoritative home, and the rest is
        derived and not synchronized (references/runner-prompt.md:16)'
      - 'idempotent-transitions-check: Where applicable, ask what happens on a repeat run
        or a mid-way crash and make state changes idempotent (references/runner-prompt.md:17)'
      - 'three-file-call-chain-limit: Flatten the hierarchy if following the flow takes more
        than three files (references/runner-prompt.md:18)'
      - 'no-hedging-across-runners: Each runner produces its model''s strongest design, because
        differences drive the selection and a safe middle defeats the purpose (references/runner-prompt.md:20)'
