          brief through user-selected members in isolation, parallel where useful; the brief
          asks each member for its strongest answer, not a hedge toward what a panel might
          favour, because differences between members are the evidence, and no member sees
          another''s answer (.claude/skills/model-council/SKILL.md:8-9, 18-24). For a built
          artifact such as a design sketch it adds pick-and-graft (.claude/skills/model-council/SKILL.md:31-32):
          each member writes only to its own location, and a judge and then the coordinator
          score every candidate on stated criteria and pick a base (.claude/skills/model-council/references/pick-and-graft.md:6-23).
