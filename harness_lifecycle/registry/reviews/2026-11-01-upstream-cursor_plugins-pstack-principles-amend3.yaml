themes: "Corrects three sealed reports: `2026-10-31-upstream-cursor_plugins-pstack-principles.yaml`\n\
  (the original), `…-amend.yaml` and `…-amend2.yaml`. It carries the rows of theirs\nthat\
  \ must survive (the `owning-layer-fix` target correction and R15) and revises\nR10's two\
  \ policy rows; every other row and ruling stands as ruled where it is.\nOwner rulings of\
  \ 2026-11-01 on critic 1b-build (Sol, gpt-6.1-sol, REVISE),\nfindings 1, 2 and 4.\n\n##\
  \ Review history of the three earlier reports (finding 2)\n\nTheir sealed critic fields\
  \ do not describe the reviews that took place. The\nsealed files stay byte-identical; this\
  \ is the true record.\n\n- **Original** (sealed 2026-10-31; both critic fields say `pass`\
  \ by\n  gpt-6.1-sol, 2026-10-31). Sol reviewed the analysis and the comparison\n  twice\
  \ on 2026-10-31 and returned REVISE both times: critic-1b (9 MAJOR,\n  5 MINOR) and critic-1b-r2\
  \ (2 MAJOR, one note). The coordinator accepted\n  the round-3 fixes on 2026-10-31 without\
  \ a further critic pass. The true\n  verdict is `accepted` by the coordinator, after Sol's\
  \ last round, REVISE.\n- **`-amend`** (sealed 2026-11-01; both fields say `pass` by the\n\
  \  coordinator, \"no separate critic round\"). No critic reviewed it before\n  sealing.\
  \ Sol first reviewed it in critic 1b-build on 2026-11-01: REVISE.\n- **`-amend2`** (sealed\
  \ 2026-11-01; both fields say `pass` by the\n  implementer, \"no separate critic round\"\
  ). No critic reviewed it before\n  sealing. Sol first reviewed it in critic 1b-build on\
  \ 2026-11-01: REVISE\n  (finding 4 is on its R15 row).\n\nAn owner ruling gives decision\
  \ authority; it is not a critic's review. The\nregistry now records acceptance after a failed\
  \ critic round as its own\nverdict, `accepted`, with who accepted, when, and the last critic\
  \ round\n(README §5c). This report's own critic fields are filled by an independent\nSol\
  \ check before it is sealed.\n\n## R10 revised: build a tool when it pays (finding 1)\n\n\
  The sealed policy wrote a tool for every non-trivial edit, analysis or check,\neven when\
  \ an existing test or check already proved the work, which competes\nwith reuse first and\
  \ proportional effort. Owner ruling: the AGENTS.md line\nbecomes \"Use existing deterministic\
  \ tools and checks where they suffice.\nBuild a rerunnable tool when it materially reduces\
  \ repeated work or supplies\nproof a reviewer needs, and keep its output\", followed by\
  \ the unchanged\nscript-over-fanout sentence (`AGENTS.md:43-46`).\n\nUnder T5 this is an\
  \ adaptation of both policy rows: the line delivers neither\n`tool-over-hand-work` (a tool\
  \ for all non-trivial work) nor `scripted-proof`\n(a script preferred for every proof) whole.\
  \ Both now adopt into one new\nvariant, `tool-when-it-pays`, whose `distinct_from` names\
  \ both; one trait,\nsince the line is one mechanism (reuse first, build when it pays, keep\
  \ the\noutput). `script-over-fanout` is delivered unchanged and keeps its row in\nthe original.\
  \ `build-a-lever`'s description and the router row\n(`mvp-mode/SKILL.md`, Skills by situation)\
  \ are narrowed to match: a tool when\nit saves repeated work or supplies missing proof,\
  \ never by default. Its\ntechnique traits are unchanged.\n\nBoth rows are `absent` with\
  \ the variant under `also_in`: the comparison\ncounts a variant only in the compared skill\
  \ (none here), so the adopt is\npending although the line is in place, and its completion\
  \ follows at once.\n\n## R15 revised: independent work, and an honest guide verdict (finding\
  \ 4)\n\n`-amend2` recorded `guide: ok` on the delegation default while its own text\nconceded\
  \ that C-14 limits Opus delegation to sizeable independent tasks.\nOwner ruling: the router\
  \ line says \"hand independent work to a subagent\";\nnothing else in it changes (`.claude/skills/mvp-mode/SKILL.md:35-39`).\
  \ That\nnarrows the mechanism, so under README §4a it is a new variant,\n`delegate-independent-by-default`;\
  \ `delegate-by-default` keeps its meaning\nand stays defined for the history that adopted\
  \ into it.\n\nThe guide verdict is now `conflict` [U-07, C-14]: the line meets C-14's\n\
  independence condition and keeps small work and verification local, but\ndelegating mid-sized\
  \ independent work by default departs from \"only sizeable\ntasks\". The owner keeps the\
  \ default anyway, and the row records that as an\nowner override with the ruling and its\
  \ date, a representation the guide-check\ncontract now has (README §5c). GUIDE §0: the guide\
  \ does not by itself change\nrepository policy; the override records the departure rather\
  \ than hiding it.\n\n## Recording correction carried: owning-layer-fix\n\nCarried unchanged\
  \ from `-amend`: `fix-root-causes#owning-layer-fix` is\ncovered by AGENTS.md, its provider,\
  \ so the delivered adopt targets\n`doc:AGENTS.md`, not the compared skill. The line is now\
  \ `AGENTS.md:37-38`.\n\n## Recount\n\n110 rows: 95 adopt, 10 reject, 5 defer, unchanged.\
  \ Modified adoptions\n(`into`) rise from 12 to 14 (`tool-over-hand-work` and `scripted-proof`\
  \ into\n`tool-when-it-pays`); `bulk-to-subagents` changes destination variant.\n"
