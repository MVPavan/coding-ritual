        a settings file. Ours already ships such a hook as project configuration, and the
        plugin installer merges our hooks into a repository's settings file; a hook is not
        a skill and cannot be compared.
      flag: suggested differs
      reason: 'Compared with none, as on 2026-11-12: our equivalent is a hook, outside the
        registry''s skill comparison. Suggested create-verification-skill by the computed
        signals only.'
