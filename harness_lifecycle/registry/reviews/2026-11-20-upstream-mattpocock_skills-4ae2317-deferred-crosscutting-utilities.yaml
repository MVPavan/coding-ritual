        reason: 'Owner ruling 2026-11-20 (conversation), deferred review, bead cr-r2pa.3.3:
          re-deferred with a new revisit condition, replacing the 2026-11-13 defer. The rule
          matters where a harness hook is wired into an existing settings file. Beads setup
          checks that its session hook is wired there (.claude/skills/beads/references/setup.md:73-77);
          the plugin installer writes it: it copies the template settings file when the repository
          has none (mvp-harness/plugins/mvp-plugin/scripts/install-harness.sh:218-220) and
          otherwise merges it as JSON, adding the harness hooks block only when the file has
          no hooks block and the marketplace entry only when missing, and leaving every other
          setting as it was (mvp-harness/plugins/mvp-plugin/scripts/install-harness.sh:221-244).
          An existing hooks block is kept and reported for a hand merge, not merged into (mvp-harness/plugins/mvp-plugin/scripts/install-harness.sh:252).
          Whether to merge into that block''s arrays is a question for the installer''s review
          at the end-of-project plugin sync, as for the two instruction-file rows of round
          2026-11-20-deferred-improvement.'
