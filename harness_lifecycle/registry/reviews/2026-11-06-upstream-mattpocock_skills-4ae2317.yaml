themes: Two new or newly analysed skills and eight small changes. Every changed skill now
  starts its subagents in a fresh context window, which these rows put in delegation as the
  one line the owner ruled; chief-of-staff adds a sampled, failures-first retro that goes
  into the planned reflect skill. Software-factory stays on the owner's provisional hold apart
  from its three brakes and task questions, which go into the autonomous-run playbook, and
  setup-matt-pocock-skills is analysed for the first time against our Beads tracking. The
  recommendations are meant to be ruled as one set, with any exceptions named.
