      - 'runner-q-cost-shape: Ask the billing unit, whether model-wait time is billed, and
        whether tokens are included. (RUNNERS.md:73)'
      - 'runner-q-disposability: Ask how disposability is achieved and whether persistence
        can be kept to caches. (RUNNERS.md:74)'
      - 'runner-q-reach: Ask what network a run can reach, how secrets arrive, and who else
        can read them. (RUNNERS.md:75)'
      - 'runner-q-other-slots: Ask which other slots the runner covers, counting its triggers
        and its run page. (RUNNERS.md:76)'
      - 'runner-primary-sources: Take answers from limits, pricing, SDK reference, security
        docs, changelogs and billing docs, over landing pages. (RUNNERS.md:80-84)'
      - 'runner-staleness-order: Recheck the fast-changing facts first: prices, beta status,
        timeouts, trigger integrations and startup times. (RUNNERS.md:88-92)'
      - 'measure-startup-times: Measure vendor-claimed startup times when they matter. (RUNNERS.md:92)'
      - 'trust-traits-over-numbers: Trust the slowly changing type traits over any figure
        in the survey. (RUNNERS.md:94)'
      - 'observability-survey-dated-orientation: Treat the dated survey as orientation only
        and research current options independently. (OBSERVABILITY-PLATFORMS.md:3)'
      - 'split-by-human-need: Choose the observability type by whether the human needs a log,
        an agent trace, or a trace joined to the wider system. (OBSERVABILITY-PLATFORMS.md:5)'
      - 'platform-as-ticket-source: When a run must act on what the platform sees, make the
        platform a ticket source so a monitor files a ticket the run reads. (OBSERVABILITY-PLATFORMS.md:5)'
      - 'name-hook-with-product: Name the data hook alongside the product when filling the
        slot. (OBSERVABILITY-PLATFORMS.md:9)'
      - 'hook-harness-otel: Export telemetry from the agent harness itself over OpenTelemetry.
        (OBSERVABILITY-PLATFORMS.md:11)'
      - 'hook-platform-push: Let the model platform send traces to an OTLP destination. (OBSERVABILITY-PLATFORMS.md:12)'
      - 'hook-sdk-wrapper: Add one tracing call in the runner''s code. (OBSERVABILITY-PLATFORMS.md:13)'
      - 'hook-stop-transcript-plugin: Ship the session transcript from a harness hook at each
        stop. (OBSERVABILITY-PLATFORMS.md:14)'
      - 'hook-gateway: Point the model base URL at a logging proxy for code-free capture of
        model calls only. (OBSERVABILITY-PLATFORMS.md:15)'
      - 'otlp-common-wire: Treat OpenTelemetry as the common transport, since harness and
        platform exports land in any OTLP backend. (OBSERVABILITY-PLATFORMS.md:17)'
      - 'tolerate-span-name-drift: Expect agent span names to drift while the conventions
        settle. (OBSERVABILITY-PLATFORMS.md:17)'
      - 'pick-no-platform: Use a deliberate none when runs are few, one human watches, and
        the question is only whether it failed and what it printed. (OBSERVABILITY-PLATFORMS.md:23)'
      - 'outgrow-none-signals: Move off none when search across runs, a per-run cost rollup,
        or longer retention is needed. (OBSERVABILITY-PLATFORMS.md:23)'
      - 'verify-runner-retention: Verify retention days per runner product. (OBSERVABILITY-PLATFORMS.md:27)'
      - 'pick-tracing-platform: Choose a tracing platform when the question is why the agent
        acted, across many runs, or token spend needs a per-run rollup. (OBSERVABILITY-PLATFORMS.md:33)'
      - 'self-host-for-transcripts: Self-host an open-source tracing platform to keep transcripts
        in-house. (OBSERVABILITY-PLATFORMS.md:33)'
      - 'budget-per-run-not-request: Budget tracing per run rather than per request, because
        agent runs are span-heavy. (OBSERVABILITY-PLATFORMS.md:35)'
      - 'verify-tracing-platform: Verify free-tier limits, billing unit, self-hosting tier
        and current ownership. (OBSERVABILITY-PLATFORMS.md:39)'
      - 'pick-general-apm: Choose an existing APM when the team already pays for it, runs
        must join app traces, or a monitor already reads from it. (OBSERVABILITY-PLATFORMS.md:45)'
      - 'nest-run-in-caller-trace: Propagate trace context so a run nests inside its caller''s
        trace. (OBSERVABILITY-PLATFORMS.md:45)'
      - 'check-apm-volume-pricing: Weigh factory volume against the bill, since it is negligible
        on an existing APM and a surprise on a new one. (OBSERVABILITY-PLATFORMS.md:47)'
      - 'verify-apm-agent-view: Verify agent view status, harness setup guides and free-tier
        volumes. (OBSERVABILITY-PLATFORMS.md:51)'
      - 'pick-llm-gateway: Choose a gateway for per-run spend caps, one key vault, or a harness
        with no export of its own. (OBSERVABILITY-PLATFORMS.md:57)'
      - 'pair-gateway-with-tracing: Pair a gateway with a tracing or APM type to cover tool
        calls. (OBSERVABILITY-PLATFORMS.md:57)'
      - 'verify-gateway-maintained: Verify SaaS per-request pricing and whether the product
        is still actively developed. (OBSERVABILITY-PLATFORMS.md:61)'
      - 'obs-q-already-enough: Ask whether the runner or orchestrator already shows enough,
        and record a deliberate none if so. (OBSERVABILITY-PLATFORMS.md:67)'
      - 'obs-q-export-path: Ask which hooks the harness and product share, whether tool calls
        arrive as spans, and whether prompts need an opt-in. (OBSERVABILITY-PLATFORMS.md:68)'
      - 'obs-q-self-hosting: Ask about licence, tier and runtime for self-hosting. (OBSERVABILITY-PLATFORMS.md:69)'
      - 'obs-q-cost-estimate: Estimate per-run cost from one span per tool call, multiplied
        by runs per day. (OBSERVABILITY-PLATFORMS.md:70)'
      - 'obs-q-retention: Compare days kept on each tier with how far back the human looks.
        (OBSERVABILITY-PLATFORMS.md:71)'
      - 'obs-primary-sources: Take answers from pricing pages, harness integration docs, monitoring
        docs, the semantic conventions, repos and changelogs. (OBSERVABILITY-PLATFORMS.md:73)'
      - 'obs-staleness-order: Recheck the fast-changing facts first: limits, prices, beta
        flags, ownership, billing units, retention and span names. (OBSERVABILITY-PLATFORMS.md:75)'
