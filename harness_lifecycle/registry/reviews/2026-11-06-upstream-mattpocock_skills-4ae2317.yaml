  skill:skills/engineering/setup-matt-pocock-skills:
    upstream_tree_hash: 9659e7025d4cf1c0a0b40ddff32ed4b8debb87a4b20d7a52ff89c506a638df69
    accepted: null
    compared_with: domain-modeling
    pairing:
      overlap:
        beads: 1
        brainstorming: 2
        brief-me: 1
        codebase-design: 1
        doc:AGENTS.md: 3
        domain-modeling: 3
        grilling: 2
        improve-codebase-architecture: 3
        planning: 1
        prototype: 1
        teach: 1
        unslop: 1
        wayfinder: 4
      placement_match:
      - authoring-for-agents
      - harness-evaluate
      - harness-scan
      - harness-skill-compare
      - harness-status
      - migrate-claude-to-codex
      suggested: wayfinder
      purpose_match: none
      purpose: 'Upstream scaffolds per-repository configuration (tracker, triage labels, domain-doc
        locations) that its other skills read. We have no setup skill: our skills read AGENTS.md
        and .repo-context/ directly, and we track with Beads.'
      flag: suggested differs
      reason: Compared with domain-modeling because its domain-doc consumer rules are the
        only part with a counterpart; no skill of ours matches the setup purpose. Wayfinder
        shares four tracker-convention traits only because the tracker documents serve upstream's
        own wayfinder; ours keeps those on Beads. Suggested wayfinder by the computed signals
        only.
    analysis:
      blind:
      - 'scaffold-tracker-config: Record per-repo where issues live for other skills to read.
        (SKILL.md:11)'
      - 'scaffold-label-config: Record per-repo the label strings for the five triage roles.
        (SKILL.md:12)'
      - 'scaffold-domain-config: Record per-repo where the glossary and ADRs live and how
        to consume them. (SKILL.md:13)'
      - 'explore-present-confirm-write: Follow the fixed order of exploring, presenting, confirming
        and only then writing. (SKILL.md:15)'
      - 'read-state-no-assumptions: Read whatever exists rather than assuming the repo''s
        starting state. (SKILL.md:21)'
      - 'probe-git-remote: Inspect remotes and git config to identify the hosting and the
        repo. (SKILL.md:23)'
      - 'probe-instruction-files: Check for root agent instruction files and an existing skills
        section in either. (SKILL.md:24)'
      - 'probe-glossary-files: Check for the glossary and glossary map at the repo root and
        their legacy names. (SKILL.md:25)'
      - 'offer-legacy-doc-rename: Offer to move a legacy file to its new name with git and
        rewrite the names in the domain doc. (SKILL.md:25)'
      - 'probe-adr-directories: Look for ADR directories at the root and under source folders.
        (SKILL.md:26)'
      - 'probe-prior-output: Check whether this skill''s earlier output already exists. (SKILL.md:27)'
      - 'probe-local-tracker-convention: Treat a scratch directory as a sign of a local-markdown
        tracker. (SKILL.md:28)'
      - 'probe-companion-skill-installed: Check whether the triage skill is installed, which
        decides whether its section runs. (SKILL.md:29)'
      - 'probe-monorepo-signals: Look for workspace files or populated packages, and treat
        their absence as single-context. (SKILL.md:30)'
      - 'summarise-findings-first: Summarise what is present and missing before asking anything.
        (SKILL.md:34)'
      - 'one-section-one-answer: Take config sections in order, one answer at a time. (SKILL.md:34)'
      - 'lead-with-recommended-answer: Open each section with a recommended answer the user
        can accept in a word. (SKILL.md:36)'
      - 'explain-only-real-branches: Give a one-line explainer only when the choice truly
        branches. (SKILL.md:36)'
      - 'skip-settled-sections: Skip any section exploration already settled. (SKILL.md:36)'
      - 'propose-tracker-from-remote: Propose GitHub or GitLab based on where a remote points.
        (SKILL.md:42)'
      - 'tracker-option-menu: Offer GitHub, GitLab, local markdown or another tracker when
        no remote settles it or the user prefers. (SKILL.md:42-47)'
      - 'freeform-other-tracker: Record any other tracker''s workflow as one paragraph of
        the user''s prose. (SKILL.md:47)'
      - 'record-tracker-choice: Write the choice to a fixed doc path. (SKILL.md:49)'
      - 'pr-surface-flag-off: Ship GitHub and GitLab templates with a flag for PRs as a request
        surface, defaulted off. (SKILL.md:49)'
      - 'do-not-raise-pr-flag: Leave the flag unmentioned, for a user to flip in the file
        later. (SKILL.md:49)'
      - 'wire-up-missing-remote: Get the URL from the user and initialise git and the remote
        when the picked host has no remote. (SKILL.md:51)'
      - 'tracker-reachability-done-check: Treat the host CLI printing the project from inside
        the directory as the done condition. (SKILL.md:51)'
      - 'stop-when-unreachable: Stop and tell the user what is missing when the repo cannot
        be reached. (SKILL.md:51)'
      - 'skip-labels-without-skill: Skip the label section when the triage skill is not installed.
        (SKILL.md:53)'
      - 'single-question-label-gate: Ask exactly one yes-or-no question about keeping the
        default labels. (SKILL.md:55-57)'
      - 'labels-equal-role-names: Default each of the five label strings to its role name
        and write them as-is on yes. (SKILL.md:59)'
      - 'collect-overrides-on-no: Collect label overrides only on no, so existing labels are
        applied instead of duplicated. (SKILL.md:59)'
      - 'single-context-without-asking: Write the single-context layout without asking. (SKILL.md:61)'
      - 'multi-context-on-signals-only: Offer multi-context only when monorepo signals were
        found, then confirm the layout. (SKILL.md:63)'
      - 'show-draft-before-writing: Show drafts of the skills block and every doc file before
        writing. (SKILL.md:67-70)'
      - 'user-edits-drafts: Let the user edit drafts before anything is written. (SKILL.md:72)'
      - 'edit-file-precedence: Edit `CLAUDE.md` if present, otherwise `AGENTS.md`. (SKILL.md:78-79)'
      - 'ask-when-no-instruction-file: Ask the user which instruction file to create when
        neither exists. (SKILL.md:80)'
      - 'no-second-instruction-file: Never create the other instruction file when one already
        exists. (SKILL.md:82)'
      - 'update-block-in-place: Update an existing skills block in place rather than appending
        a duplicate. (SKILL.md:84)'
      - 'preserve-surrounding-user-edits: Leave user edits to surrounding sections untouched.
        (SKILL.md:84)'
      - 'instruction-block-template: Use a template with a one-line summary and a doc pointer
        per configured area. (SKILL.md:88-102)'
      - 'labels-block-conditional: Include the label sub-block and doc only when the triage
        skill is installed and its section ran. (SKILL.md:104)'
      - 'create-missing-labels: Create each configured label the hosted tracker lacks. (SKILL.md:106)'
