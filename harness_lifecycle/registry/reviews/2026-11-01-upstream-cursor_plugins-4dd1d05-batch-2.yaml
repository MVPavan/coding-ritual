themes: 'These rows serve two capabilities. Vetting a measured number before it is reported,
  compared or acted on: principle-explain-the-number keeps what makes a number evidence, and
  performance-optimization takes the procedure. Keeping a reviewable record of a long run''s
  decisions: a decision-trail skill owns the append-only log, its end-of-run audit and its
  independent review.'
skills:
  skill:pstack/skills/benchmark-checklist:
    upstream_tree_hash: 2eaf797ecf11c132329a252ab286cdebbd4c83277910eecf260cc6b28f2a3162
    accepted: null
    compared_with: principle-explain-the-number
