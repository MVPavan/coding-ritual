      - principle-attack-the-premise
      - principle-explain-the-number
      - systematic-debugging
      suggested: principle-explain-the-number
      purpose_match: performance-optimization
      purpose: 'Upstream vets a measured number before it is reported or acted on. Ours splits
        that: the principle says what makes a number evidence, and the performance skill''s
        vetting branch takes the procedure.'
      flag: Compared with the principle, which owns what makes a number evidence, so what
        it holds whole is a delivered row; the pending procedure lands in performance-optimization,
        the purpose match, which holds no row's trait yet.
      reason: Comparing with performance-optimization would make the principle's traits absent,
        and a delivered adopt needs its fact present. Suggested principle-explain-the-number
        by the computed signals only.
    analysis:
      blind:
      - 'answers-from-run-evidence: Every checklist question must be settled with data from
        an actual run, and reasoning about the code does not count. (SKILL.md:9)'
      - 'single-run-ballpark-allowance: When the user asked only for a rough figure, a single
        run is sufficient. (SKILL.md:11)'
      - 'ballpark-keeps-error-and-work-checks: Even a rough single-run figure must still pass
        the error check and the did-the-work-run check. (SKILL.md:11)'
      - 'ballpark-discloses-run-count: A rough figure must state that it rests on one run.
        (SKILL.md:11)'
      - 'ballpark-escalates-when-suspicious: On the rough path the remaining questions may
        be dropped unless the run''s result looks off, in which case they apply. (SKILL.md:11)'
      - 'option-choice-excluded-from-ballpark: A measurement used to choose between options
        can never take the rough path. (SKILL.md:11)'
      - 'claim-written-before-measuring: Before any run, write out the exact result sentence
        you expect to publish, including metric and dataset. (SKILL.md:15)'
      - 'questions-test-the-claim-sentence: The checklist questions are applied against that
        pre-written sentence rather than against the raw numbers. (SKILL.md:15)'
      - 'read-measurement-script-first: Read the measuring script beforehand and record what
        it times, what it counts and what it leaves out. (SKILL.md:16)'
      - 'machine-load-precheck: Check the load average and the core count before measuring.
        (SKILL.md:17)'
      - 'identify-competing-load: If the machine is busy, find out which work is occupying
        it. (SKILL.md:17)'
      - 'interleave-under-unavoidable-noise: If the competing work cannot be stopped, interleave
        the compared sides so both experience the same interference. (SKILL.md:17)'
      - 'disclose-noise-interleaving: State in the report that interleaving was used because
        of unstoppable background load. (SKILL.md:17)'
      - 'name-the-limiter: Identify the specific resource or code path that stops the result
        from being twice as good. (SKILL.md:21)'
      - 'profile-in-unreported-run: Do profiling and tracing in a separate run whose numbers
        are never reported, because instrumentation distorts timing. (SKILL.md:21)'
      - 'per-process-cpu-signal: Inspect CPU use per process when hunting the limiter. (SKILL.md:21)'
      - 'runtime-profiler-signal: Use a language or system profiler when hunting the limiter.
        (SKILL.md:21)'
      - 'io-wait-signal: Inspect I/O wait when hunting the limiter. (SKILL.md:21)'
      - 'syscall-count-signal: Inspect system call counts when hunting the limiter. (SKILL.md:21)'
      - 'map-hotspot-to-source: Trace the observed hot spot back to the source code responsible.
        (SKILL.md:21)'
      - 'load-generator-saturation-check: Monitor the load generator as well, since a saturated
        generator means the measurement describes the generator and not the target. (SKILL.md:21)'
      - 'limiter-before-dismissing-change: When a change leaves the number unmoved, find the
        limiter before concluding the change has no value. (SKILL.md:21)'
      - 'production-build-and-flags-parity: Run every side with production builds, flags and
        environment. (SKILL.md:22)'
      - 'production-batching-and-transaction-parity: Run every side with production batching
        and transaction settings. (SKILL.md:22)'
      - 'production-connection-pool-parity: Run every side with production connection pool
        settings. (SKILL.md:22)'
      - 'production-cache-temperature-parity: Run every side with caches as warm or as cold
        as production has them. (SKILL.md:22)'
      - 'same-versions-and-data-parity: Run every side on identical versions and identical
        data. (SKILL.md:22)'
      - 'default-config-invalidates-comparison: If one side runs on defaults, treat the result
        as a comparison of configurations rather than of implementations. (SKILL.md:22)'
      - 'settings-limiter-means-untuned: A limiter that turns out to be a setting, such as
        per-row commits, a debug build or an absent index, classifies that side as untuned.
        (SKILL.md:22)'
      - 'tune-and-remeasure-before-winner: An untuned side must be tuned and measured again
        before a winner is named. (SKILL.md:22)'
      - 'no-winner-if-untunable: If tuning a side is not possible, that run may not produce
        a winner. (SKILL.md:22)'
      - 'no-claim-narrowing-for-adoption: When the user is deciding what to adopt, restricting
        the claim to the current as-shipped settings does not cure an untuned comparison.
        (SKILL.md:22)'
      - 'bandwidth-sanity-arithmetic: Compare computed bytes per second against disk and network
        capacity. (SKILL.md:23)'
      - 'core-budget-sanity-arithmetic: Multiply operations per second by cost per operation
        and compare the product against available cores. (SKILL.md:23)'
      - 'removed-share-gain-bound: Check the claimed saving against the time the changed part
        took, since removing a fraction of a run caps the speedup accordingly. (SKILL.md:23)'
      - 'past-limit-means-wrong-target: A result beyond a computed limit is read as having
        measured something else, such as a cache, a no-op or a defect. (SKILL.md:23)'
      - 'count-failures-and-non-success: Tally failures and non-success responses, because
        fast rejections and slow timeouts both skew timing. (SKILL.md:24)'
      - 'verify-output-correctness: Check that outputs are correct and not merely present.
        (SKILL.md:24)'
      - 'add-missing-error-count: If the measuring script has no error count, add one. (SKILL.md:24)'
      - 'minimum-five-runs-per-side: Run each compared side at least five times. (SKILL.md:25)'
      - 'alternate-side-order: Alternate the sides run by run so warmup, lazy initialization,
        caches and drift favor neither. (SKILL.md:25)'
      - 'report-median-and-range: Report the median and the range across runs. (SKILL.md:25)'
      - 'gap-under-variation-is-no-difference: A gap smaller than run-to-run variation is
        reported as no measurable difference. (SKILL.md:25)'
      - 'statistical-test-when-close: When the outcome is close, use a rank-sum test or the
        statistics built into the measuring harness. (SKILL.md:25)'
      - 'end-to-end-beside-micro: Whenever a micro result is produced, also measure the whole
        path a user waits on. (SKILL.md:26)'
      - 'realistic-size-and-concurrency: The end-to-end measurement uses realistic data sizes
        and concurrency. (SKILL.md:26)'
      - 'report-micro-as-share: Express the micro result as a proportion of the whole path.
        (SKILL.md:26)'
      - 'share-caps-user-visible-gain: A component''s share of a request is treated as the
        ceiling on how much the request can improve. (SKILL.md:26)'
      - 'confirm-work-inside-timed-region: Confirm the work executed within the timed span,
        for example that the server got the request, rows were persisted and bytes were read.
        (SKILL.md:27)'
      - 'confirm-result-consumed: Confirm the code actually used the result, guarding against
        unconsumed generators, unawaited promises and results a JIT can drop. (SKILL.md:27)'
      - 'timeout-phantom-number-guard: Treat a number produced by a timeout as possibly describing
        work that never ran. (SKILL.md:27)'
      - 'verdict-first: The report opens with the verdict. (SKILL.md:31)'
      - 'four-value-verdict-vocabulary: The verdict is one of faster, slower, no measurable
        difference or inconclusive. (SKILL.md:31)'
      - 'number-carries-unit-runs-range-limiter: A reported figure comes with its unit, run
        count, range and limiter. (SKILL.md:32)'
      - 'inconclusive-without-limiter: A claimed difference whose limiter cannot be named
        must be called inconclusive. (SKILL.md:33)'
      - 'inconclusive-when-side-untuned: A verdict must be inconclusive when any side ran
        untuned. (SKILL.md:33)'
      - 'inconclusive-without-error-or-work-check: A verdict must be inconclusive when the
        error check or the did-the-work-run check could not be done. (SKILL.md:33)'
      - 'name-the-gap: An inconclusive verdict states which check or condition caused it.
        (SKILL.md:33)'
      - 'one-primary-number-in-pr-body: A pull request description carries a single primary
        number. (SKILL.md:34)'
      - 'supporting-evidence-outside-pr-body: Runs, range and limiter evidence go in a linked
        artifact or notes file rather than the pull request description. (SKILL.md:34)'
      - 'vet-baseline-before-planning: In a performance-issue flow, the baseline is put through
        the checklist before any plan is built from it. (SKILL.md:38)'
      - 'vet-every-later-number: In a performance-issue flow, each number after the baseline
        is also put through the checklist. (SKILL.md:38)'
      - 'vet-harness-before-freeze: In an iterative optimization loop, the harness is put
        through the checklist before it is frozen. (SKILL.md:39)'
      - 'frozen-harness-prints-error-and-work-counts: In an iterative optimization loop, the
        frozen harness emits error and work counts so each keep-or-revert decision gets those
        two checks automatically. (SKILL.md:39)'
