  skill:pstack/skills/show-me-your-work:
    upstream_tree_hash: 930a002ef775753f56b0a766aa47d9416965207fe54491d92d3021450bd0b698
    accepted: null
    compared_with: none
    pairing:
      overlap:
        doc:.repo-context/coding-style.md: 1
      placement_match:
      - beads
      suggested: beads
      purpose_match: none
      purpose: Upstream keeps a reviewable decision log for a long run, audited and independently
        reviewed. Ours has no unit for this until decision-trail is built.
      flag: suggested differs
      reason: 'Compared with none: decision-trail, the row target, does not exist yet, and
        --with takes only an existing skill. Suggested beads by the computed signals only.'
    analysis:
      blind:
      - 'single-canonical-log: Work keeps exactly one authoritative decision log. (SKILL.md:9)'
      - 'tsv-one-row-per-decision: The log is one tab-separated file where each decision takes
        one row. (SKILL.md:13)'
      - 'single-line-cells: No cell may span more than one line. (SKILL.md:13)'
      - 'evidence-as-pointer: The evidence cell holds a resolvable reference such as a commit,
        PR number, file and line, or artifact, trace or screenshot path, and never narrative.
        (SKILL.md:13, SKILL.md:21)'
      - 'header-template-seed: A new log starts from a supplied file holding only the header
        row. (SKILL.md:15, references/decision-log-template.tsv:1)'
      - 'six-column-schema: Rows have the fixed columns timestamp, phase, decision, why, evidence
        and result. (SKILL.md:17-22, references/decision-log-template.tsv:1)'
      - 'iso8601-timestamp-column: The timestamp column uses ISO8601. (SKILL.md:17)'
      - 'phase-or-workstream-column: A column attributes each row to its phase or workstream.
        (SKILL.md:18)'
      - 'one-line-decision-column: The decision column says in one line what was chosen or
        done. (SKILL.md:19)'
      - 'plain-reason-column: The why column gives the reason plainly, and a guiding principle
        is spelled out instead of cited as a jargon tag. (SKILL.md:20)'
      - 'result-as-outcome-or-predicate-state: The result column records an outcome or a state
        such as passing tests, reverted, zero visual diff, inconclusive or open. (SKILL.md:22)'
      - 'worked-example-rows: A sample log shows the expected plain style, including a row
        for discarding a helper''s output after checking the real files. (SKILL.md:26-32)'
      - 'teammate-voice-log-text: Rows are written as you would describe the action to a colleague,
        in concrete terms and free of machine-sounding or abstract language. (SKILL.md:36)'
      - 'helper-script-for-rows: A script takes the log path and five cell values and appends
        a well-formed row. (SKILL.md:38, scripts/log.sh:1-3)'
      - 'manual-append-sanitization-caveat: Appending by hand is allowed, but cells from generated
        or user-supplied text need the same byte-level care the script applies. (SKILL.md:38)'
      - 'log-decision-points-not-actions: Rows are for decision points and checkpoints, not
        for each action taken. (SKILL.md:40)'
      - 'checkpoint-row-categories: Row-worthy events are a chosen fork, a finished unit with
        its verification result, a pivot or revert with its cause, a surfaced blocker and
        a fixed gate. (SKILL.md:40)'
      - 'one-row-per-loop-iteration: Looping runs write one row for each iteration. (SKILL.md:40)'
      - 'skip-trivial-rows: Trivial or self-evident steps get no row. (SKILL.md:40)'
      - 'strict-shell-failure-mode: The script aborts on any command failure, unset variable
        or pipeline failure. (scripts/log.sh:4)'
      - 'argument-count-guard: The script prints usage and exits non-zero unless given exactly
        six arguments. (scripts/log.sh:6-9)'
      - 'auto-create-log-directory: The script creates the log''s parent directory when it
        is missing. (scripts/log.sh:14-17)'
      - 'header-on-empty-log: The script writes the header row when the log is missing or
        empty. (scripts/log.sh:21-23)'
      - 'header-write-never-truncates: The header is written in append mode, so a false empty-file
        test on a network mount costs a stray header and no rows. (scripts/log.sh:19-22)'
      - 'automatic-utc-timestamp: The script stamps each row with the current UTC time so
        the caller does not supply it. (scripts/log.sh:25)'
      - 'strip-cell-control-whitespace: The script replaces tabs, newlines and carriage returns
        in each cell with spaces. (scripts/log.sh:26, scripts/log.sh:34)'
      - 'spreadsheet-formula-neutralization: The script prefixes a single quote to any cell
        starting with a formula-triggering character, so hostile evidence text cannot execute
        when opened in a spreadsheet. (SKILL.md:38, scripts/log.sh:26-38)'
      - 'append-only-row-write: The script adds the row with an append redirect. (scripts/log.sh:40-42)'
      - 'run-boundary-definition: A run is one agent conversation with its later turns and
        summaries, while a pickup, replacement agent or new chat counts as a new run. (SKILL.md:42)'
      - 'start-row-on-existing-log: A run adding to a log that already has rows first writes
        a row with the phase `start`. (SKILL.md:42)'
      - 'start-row-after-foreign-start: A run writes a fresh `start` row when its next row
        follows another run''s `start` row. (SKILL.md:42)'
      - 'reread-log-tail-on-return: A run returning to a log in a later turn first reads the
        last rows to detect writes by other runs. (SKILL.md:42)'
      - 'start-row-names-foreign-range: A `start` row records the timestamp range of the preceding
        rows that this run did not write. (SKILL.md:42)'
      - 'start-row-evidence-identifies-run: The evidence cell of a `start` row identifies
        the current run, for example by agent id. (SKILL.md:42)'
      - 'reserved-start-phase: The phase value `start` is used for no other purpose. (SKILL.md:42)'
      - 'uncommitted-working-artifact-default: By default the log is a working file kept out
        of version control. (SKILL.md:46)'
      - 'default-log-path: The default location is a fixed-name TSV in the work directory.
        (SKILL.md:46)'
      - 'per-task-path-when-concurrent: When several efforts run at once, each log goes in
        a hidden audit directory under a task-slug filename. (SKILL.md:46)'
      - 'commit-only-for-reviewer-trust: The log is committed only when the work is ambitious
        enough that a reviewer needs the trail to trust the outcome. (SKILL.md:48)'
      - 'append-only-history: Rows are never edited or deleted, and a wrong call is corrected
        by a later row that supersedes it. (SKILL.md:52)'
      - 'prefer-committed-script-evidence: Evidence generated by committed scripts is favored
        over hand-made one-off evidence. (SKILL.md:53)'
      - 'end-of-run-log-audit: Before handing back, the run checks its log for truthfulness
        against what happened. (SKILL.md:57)'
      - 'audit-reads-own-transcript: The audit uses this run''s transcript from the active
        workspace''s transcript directory, whose location comes from the system prompt. (SKILL.md:57)'
      - 'no-cross-project-transcript-glob: The audit must not search across all project transcript
        folders, because that exposes unrelated private conversations. (SKILL.md:57)'
      - 'audit-scoped-to-own-stretches: The audit covers only the row stretches belonging
        to this run, delimited by its `start` rows or the log''s first row and the next `start`
        row of another run. (SKILL.md:57, SKILL.md:63)'
      - 'row-maps-to-real-event: Each audited row must correspond to a decision or action
        that actually occurred. (SKILL.md:59)'
      - 'evidence-resolves-and-supports: Each audited row''s evidence must resolve and must
        show what the row asserts. (SKILL.md:60)'
      - 'unlogged-fork-is-gap: A fork, pivot or abandoned path that shaped the work without
        a row is a gap that the audit adds. (SKILL.md:61)'
      - 'audit-corrects-by-superseding: The audit changes nothing in place, even for an invented
        row, and instead adds a superseding row stating what really happened with a resolving
        pointer. (SKILL.md:63)'
      - 'supersede-foreign-row-on-evidence: A row outside the audited stretches is superseded
        only when this run''s own work shows it to be wrong. (SKILL.md:63)'
      - 'different-model-family-reviewer: Before handing back, a subagent from a different
        model family reviews the run, and the author''s self-review does not replace it. (SKILL.md:67)'
      - 'reviewer-reads-trail-and-transcript: The reviewer''s inputs are the audit trail and
        the run''s transcript. (SKILL.md:67)'
      - 'attention-scan-not-redo: The reviewer looks for what is suboptimal or risky for the
        user''s attention and does not repeat the work. (SKILL.md:67)'
      - 'reviewer-effort-and-speed-choice: Each reviewer''s reasoning level and speed tier
        are chosen to suit the job. (SKILL.md:67)'
      - 'flag-weak-evidence: The reviewer flags logged decisions with thin or missing evidence.
        (SKILL.md:69)'
      - 'flag-unproven-verification: The reviewer flags verification that was skipped or claimed
        without proof in the transcript. (SKILL.md:70)'
      - 'flag-hindsight-risky-choices: The reviewer flags choices that look premature, scope-expanding
        or symptom-masking in hindsight. (SKILL.md:71)'
      - 'flag-skim-invisible-gaps: The reviewer flags gaps a user would miss on a casual read.
        (SKILL.md:72)'
      - 'attention-section-closes-reply: Every reply for a run that produced a trail ends
        with a section called Attention. (SKILL.md:74)'
      - 'reviewer-model-name-line: The Attention section opens with a line of its own naming
        the reviewer''s model. (SKILL.md:74)'
      - 'flags-point-to-rows-or-moments: Each listed flag cites specific rows or moments.
        (SKILL.md:74)'
      - 'no-flags-allowed-model-name-required: An empty flag list is acceptable, but the reviewer''s
        model name may not be omitted. (SKILL.md:74)'
      - 'reader-walkthrough-method: A human reviewer reads from top to bottom, follows the
        evidence pointers and spot-checks. (SKILL.md:78)'
      - 'github-table-rendering: Committing the TSV gives reviewers a table view on GitHub.
        (SKILL.md:78)'
      - 'terminal-column-rendering: The `column` command with a tab separator displays the
        log as a table in a terminal. (SKILL.md:78)'
      - 'single-owner-of-trail-format: Other skills needing an audit trail refer to this one
        by name and do not define their own trail or repeat its columns. (SKILL.md:82)'
