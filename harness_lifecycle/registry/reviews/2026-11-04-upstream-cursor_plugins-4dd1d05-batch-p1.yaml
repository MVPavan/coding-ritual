  skill:pstack/skills/teach:
    upstream_tree_hash: c5390d21db37db654adb05ac21f150561ab70fb64f419f13a6821579726e8c0c
    accepted: null
    compared_with: teach
    pairing:
      overlap:
        doc:AGENTS.md: 1
        prose-pass: 3
      placement_match:
      - teach
      suggested: prose-pass
      purpose_match: teach
      purpose: 'Upstream makes a person understand a body of work, in one plain account at
        their pace. Our `teach` has that aim in its one-concept and session shapes, though
        it also runs courses. Our `explain-code` has another aim: a cited answer for changing
        code safely, which supplies the digging and which upstream calls separate skills.'
      flag: suggested differs
      reason: 'Compared with teach on purpose and not on the name: both aim at a person understanding,
        and the rows here are about how it reads. `explain-code` is what `teach` would call
        for the facts, and a call is not a trait. Suggested prose-pass by the computed signals
        only.'
    analysis:
      blind:
      - 'understanding-only-goal: Aim at the person''s comprehension and make no changes to
        the work. (SKILL.md:9)'
      - 'what-how-why-coverage: Cover what the thing is, how it operates and why it has that
        design. (SKILL.md:9)'
      - 'single-blended-account: Merge the findings of the investigations into one continuous
        explanation, not separate reports. (SKILL.md:11)'
      - 'lead-with-what-matters-to-reader: Open on the material most relevant to this particular
        person. (SKILL.md:11)'
      - 'free-rewording-except-confidence-language: Reword findings freely for teaching but
        carry the source''s hedges and confidence terms through unchanged, because they are
        results. (SKILL.md:11)'
      - 'pick-few-takeaways: Choose a small number of things the person should come away understanding
        before explaining. (SKILL.md:13)'
      - 'infer-learner-context-from-conversation: Work out the person''s purpose and prior
        knowledge from the conversation, not by questioning them. (SKILL.md:13)'
      - 'skip-known-material: Omit what the person evidently already knows. (SKILL.md:13)'
      - 'depth-follows-the-question: Spend the explanation''s depth on the area the person
        asked about. (SKILL.md:13)'
      - 'orient-then-delegate-investigation: Read the code only enough to get oriented and
        let dedicated how-it-works and why-it-is-so investigations do the digging. (SKILL.md:14)'
      - 'parallel-investigations-combined: Run the how and why investigations concurrently
        and merge what they return. (SKILL.md:14)'
      - 'size-investigation-to-question: Run both investigations for a subsystem and possibly
        only one for a small change. (SKILL.md:14)'
      - 'narrow-rationale-search-by-default: Keep the slow rationale search limited, expanding
        it solely when the reasoning is what the person is after. (SKILL.md:14)'
      - 'scope-narrowing-in-the-request: Express the narrowing in the question handed to the
        rationale search so that it records which categories it skipped. (SKILL.md:14)'
      - 'plain-definition-first: Begin by naming the thing and defining it in general terms,
        using its common name if one exists. (SKILL.md:15)'
      - 'tie-general-to-local-case: After the general definition, connect it to how this codebase
        uses the idea. (SKILL.md:15)'
      - 'build-up-explanation-order: Proceed from definition to mechanism, then deeper reasons,
        then edge cases. (SKILL.md:15)'
      - 'problem-and-mechanism-per-part: For each part, explain the problem it addresses and
        how it actually operates. (SKILL.md:15)'
      - 'walkthrough-of-user-action: When it helps the idea land, trace what happens step
        by step as someone performs the action. (SKILL.md:15)'
      - 'no-symbol-inventory: Do not substitute a list of functions and constants for an explanation,
        since that is reference material. (SKILL.md:15)'
      - 'no-framing-labels: Do not print stock labels announcing the key idea or summary.
        (SKILL.md:15)'
      - 'smallest-complete-answer-then-stop: Give a one or two sentence complete answer first,
        then stop, adding layers only when asked. (SKILL.md:15)'
      - 'no-wall-of-text: Never deliver a large unbroken block of explanation. (SKILL.md:15)'
      - 'offer-depth-follow-lead: Invite the person to continue deeper or change topic, and
        let them steer. (SKILL.md:16)'
      - 'no-quizzes: Do not test the person or ask them to repeat the idea back. (SKILL.md:16)'
      - 'no-pacing-theater: Do not announce pauses or declare sentences that must be mastered;
        actually stop when a pause is wanted. (SKILL.md:16)'
      - 'no-importance-flagging: Do not announce a part as hard, important or interesting;
        simply state it. (SKILL.md:16)'
      - 'one-shot-delivery-mode: With no live person present, deliver the explanation whole
        and place any offer of more depth at the end. (SKILL.md:16)'
      - 'show-the-real-artifact: Bring up the actual diff, source or debugger if that conveys
        the point most quickly. (SKILL.md:17)'
      - 'draw-when-faster-than-words: Add a figure when a picture would land faster than prose,
        and omit one for a single simple point. (SKILL.md:17)'
      - 'incremental-diagram-series: For three or more moving parts, draw a sequence in which
        each diagram repeats the last and adds exactly one part. (SKILL.md:17)'
      - 'no-all-at-once-diagram: Do not rely on one complete diagram, particularly one held
        back to the end, because it serves as reference. (SKILL.md:17)'
      - 'medium-matches-idea: Choose the figure type by the nature of the idea, and use several
        kinds when each helps. (SKILL.md:17)'
      - 'mermaid-for-labelled-flows: Use a mermaid diagram for flows or structures whose meaning
        sits in the labels. (SKILL.md:17)'
      - 'generated-whiteboard-image-for-spatial-ideas: For spatial ideas such as layout, overlap
        or before and after, use an image-generation tool in a marker-on-whiteboard style.
        (SKILL.md:17)'
      - 'few-short-labels-in-generated-images: Keep labels in generated pictures few and short,
        since long text comes out garbled. (SKILL.md:17)'
      - 'generate-rather-than-describe-picture: Actually produce the spatial image instead
        of describing it in prose. (SKILL.md:17)'
      - 'incremental-rule-covers-generated-images: Apply the one-part-at-a-time sequence to
        generated images as well. (SKILL.md:17)'
      - 'plain-spoken-colleague-voice: Write in plain spoken English as if explaining to a
        coworker. (SKILL.md:19)'
      - 'tight-not-terse: Remove filler and hedging while keeping the piece that makes the
        idea click. (SKILL.md:19)'
      - 'concrete-mechanism-over-metaphor: State the actual mechanism, not a metaphor, framing
        or preview of what comes next. (SKILL.md:19)'
      - 'target-density-exemplar: Supply a worked sample sentence pair that fixes the wanted
        information density. (SKILL.md:19)'
      - 'sentence-case-no-em-dashes: Use normal sentence capitalization and no em dashes.
        (SKILL.md:19)'
      - 'comma-budget-and-split: Favor periods, allow at most two commas per sentence, and
        break a sentence up when clauses accumulate. (SKILL.md:19)'
      - 'one-name-per-concept: Give each concept a single name and keep using it. (SKILL.md:19)'
      - 'no-mirror-sentences-or-tidy-closers: Avoid symmetrical constructions and neat concluding
        lines. (SKILL.md:19)'
      - 'directions-not-printed: Treat the skill''s step wording as instructions, never echoing
        it as headers or stock phrases. (SKILL.md:19)'
      - 'reply-is-the-explanation: Return the explanation itself, never an account of what
        was done or delivered. (SKILL.md:21)'
      - 'main-point-first-reply: Open the reply on its central point before the fuller account.
        (SKILL.md:21)'
      - 'end-with-threads-to-chase: Include the lines of inquiry worth pursuing further. (SKILL.md:21)'
