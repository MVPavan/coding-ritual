  skill:pstack/skills/typescript-best-practices:
    upstream_tree_hash: fb35e49d1b6a48fa42d81fff0e4e9834b8f98e0ebcf188203680f1f4265df690
    accepted: null
    compared_with: principle-type-system-discipline
    pairing:
      overlap:
        principle-boundary-discipline: 2
        principle-model-the-domain: 1
        principle-type-system-discipline: 4
      placement_match:
      - principle-sequence-verifiable-units
      - test-driven-development
      suggested: principle-type-system-discipline
      purpose_match: principle-type-system-discipline
      purpose: Upstream is a TypeScript rule table with a pattern reference. Ours is the language-neutral
        principle those rules start from; `.repo-context/coding-style.md` is the language-specific
        document, for Python.
      flag: null
      reason: 'Compared with principle-type-system-discipline: upstream itself opens by applying
        that principle, and only a skill can be compared.'
    analysis:
      blind:
      - 'literal-discriminant-unions: Represent variants as a union tagged by a literal field
        so contradictory states cannot be written. (SKILL.md:14, references/patterns.md:30-41)'
      - 'no-optional-field-bags: Do not model variant state with booleans plus optional fields.
        (SKILL.md:14, references/patterns.md:33-34)'
      - 'one-discriminant-name: Settle on a single tag field name and use it consistently.
        (references/patterns.md:43)'
      - 'branded-primitives: Intersect primitives with a readonly brand property so distinct
        identifiers cannot be swapped. (SKILL.md:15, references/patterns.md:7-10)'
      - 'reuse-existing-brand-shape: Follow the established brand property shape and invent
        no other convention. (references/patterns.md:26)'
      - 'brand-only-through-verifying-guard: Obtain a brand only from a type guard that truly
        checks the value, never from a cast. (SKILL.md:15, references/patterns.md:12-14)'
      - 'validate-brand-once-then-trust: Check the brand at the boundary and let downstream
        code accept the type without re-checking. (SKILL.md:15, references/patterns.md:7,
        references/patterns.md:21-23)'
      - 'constructive-illegal-state-removal: Compose the type only from legal pieces in place
        of runtime guards or hoped-for refinement types. (SKILL.md:16, references/patterns.md:47)'
      - 'nonempty-variadic-tuple: Express a non-empty list as a tuple of one element plus
        a rest element. (SKILL.md:16, references/patterns.md:49-63)'
      - 'single-narrowing-guard-for-plain-arrays: Where an ordinary array arrives, narrow
        it once with a guard so the fact travels in the type. (references/patterns.md:66-70)'
      - 'even-length-as-pairs: Express an even-length list as an array of two-element tuples.
        (SKILL.md:16, references/patterns.md:72-76)'
      - 'range-as-start-plus-duration: Express a time range as a start and a duration so a
        negative range cannot be written. (SKILL.md:16, references/patterns.md:78-86)'
      - 'brand-only-on-real-confusion-risk: Leave a number unbranded unless a raw number could
        actually be passed in its place. (references/patterns.md:88)'
      - 'derive-readings-over-representation: Expose other views of the data through helpers
        or derivations on top of the chosen representation. (references/patterns.md:88)'
      - 'keep-loose-type-while-total: Stay with a plain array as long as every operation on
        it is defined for all inputs. (SKILL.md:17, references/patterns.md:92-96)'
      - 'strengthen-on-lie-tells: Tighten the input type only where a non-null assertion,
        cast or impossible-case throw appears. (SKILL.md:17, references/patterns.md:98-110)'
      - 'weaken-result-as-alternative: Return a possibly undefined result as the other way
        of making the signature total. (references/patterns.md:112)'
      - 'external-data-is-unknown: Type all outside data as unknown and never as any. (SKILL.md:18,
        references/patterns.md:116-122)'
      - 'narrow-before-use: Narrow unknown values before accessing them so the compiler checks
        the access. (references/patterns.md:116, references/patterns.md:124-129)'
      - 'external-source-enumeration: Count RPC payloads, parsed JSON, posted messages, IPC,
        file contents, environment variables and database results as external. (references/patterns.md:132)'
      - 'check-for-schema-library-first: Before hand-writing a field-by-field guard, find
        out which runtime schema library the repository uses and which schemas already exist.
        (SKILL.md:19, references/patterns.md:136)'
      - 'schema-owns-validation-and-type: Have one schema own validation and infer the static
        type from it. (SKILL.md:19, references/patterns.md:136-151)'
      - 'no-drifting-triplicate: Do not maintain a schema, a parallel interface and a guard
        that can disagree. (references/patterns.md:136)'
      - 'safe-parse-for-expected-failure: Use the non-throwing parse variant when failure
        is an ordinary branch. (references/patterns.md:153)'
      - 'use-repo-schema-helper-equivalent: Use the matching inference helper when the repository
        has a different schema library. (references/patterns.md:153)'
      - 'no-new-schema-dependency-for-one-guard: Do not add a schema dependency for the sake
        of a single guard. (references/patterns.md:153)'
      - 'no-as-casts: Disallow type assertions except after validation has established the
        claim. (SKILL.md:20, references/patterns.md:157)'
      - 'no-partial-property-guard: Reject a guard that checks only some fields while claiming
        the full type. (references/patterns.md:165-168)'
      - 'annotate-validator-with-proved-type: When the type is written first, annotate the
        validator with it so the compiler rejects a validator proving less. (references/patterns.md:179-185)'
      - 'diagnose-cast-before-removing: When removing a cast, first find out why inference
        falls short. (references/patterns.md:187)'
      - 'cast-fix-add-discriminant: If a discriminant is missing, add it and move to a tagged
        union. (references/patterns.md:189)'
      - 'cast-fix-narrow-wide-source: If the source type is too broad, narrow it. (references/patterns.md:190)'
      - 'cast-fix-parse-untyped-boundary: At an untyped boundary, parse using the schema responsible
        for that shape, adding one only where none exists. (references/patterns.md:191)'
      - 'cast-fix-brand-or-satisfies: If the type truly cannot be expressed, use a brand or
        the satisfies operator. (references/patterns.md:192)'
      - 'narrowing-preference-order: Prefer discriminant checks, then the in operator, then
        typeof or instanceof, then a user-defined guard, with a cast last and only after validation.
        (SKILL.md:21, references/patterns.md:196-209)'
      - 'guards-must-verify: Require a type guard to really prove what it asserts, treating
        a false guard as worse than a cast. (SKILL.md:22, references/patterns.md:213-219)'
      - 'guard-naming-convention: Name guards with an is or has prefix. (SKILL.md:22)'
      - 'prefer-discriminant-over-guard: Use discriminant narrowing instead of a guard when
        it is available. (references/patterns.md:221)'
      - 'never-assignment-exhaustiveness: In a switch''s default arm, assign the switched
        value to a local typed never so a new variant becomes a compile error. (SKILL.md:23,
        references/patterns.md:225-257)'
      - 'exhaustiveness-arm-by-switch-kind: Return the never value in value-producing switches
        and void it in statement switches. (references/patterns.md:235-238, references/patterns.md:251-254,
        references/patterns.md:259)'
      - 'satisfies-over-as: Use the satisfies operator to check a value against a type while
        keeping its literal types. (SKILL.md:24, references/patterns.md:263-272)'
      - 'parse-at-boundary-into-domain-type: Parse data at its point of entry into a named
        domain type. (SKILL.md:25, references/patterns.md:276)'
      - 'loose-record-stops-at-parse: Allow a string-keyed unknown record, under any alias,
        to exist only up to that parse. (SKILL.md:25)'
      - 'trust-types-inside-no-revalidation: Rely on the types past the boundary and do not
        validate again deep in call chains. (SKILL.md:25, references/patterns.md:276, references/patterns.md:280)'
      - 'wire-parse-ignores-unknown-fields: Parse wire formats with unknown fields ignored
        so forward-compatible changes do not break old clients. (references/patterns.md:278)'
      - 'persisted-json-versioned: Store persisted JSON as a versioned blob. (references/patterns.md:279)'
      - 'persisted-json-guarded-parse: Surround the parse of persisted JSON with try/catch.
        (references/patterns.md:279)'
      - 'derive-from-generated-schema-types: When a proto, OpenAPI, GraphQL or migration definition
        already gives a shape, use its generated types and do not duplicate them. (references/patterns.md:284-301)'
      - 'type-utilities-before-new-interface: Try Pick, Omit, Parameters, ReturnType, Awaited
        and typeof before declaring a new interface. (SKILL.md:26, references/patterns.md:303)'
      - 'object-arguments: Pass a single object in place of positional arguments so order
        is irrelevant and calls read clearly. (SKILL.md:27, references/patterns.md:307-326)'
      - 'hot-path-positional-exception: Skip object arguments on per-frame rendering, tokenizers,
        parsers and other tight loops where allocation matters. (SKILL.md:27, references/patterns.md:328)'
      - 'no-mocking-what-can-run: Avoid mocks for anything that can be run, and mock only
        what cannot run locally. (SKILL.md:28)'
      - 'real-test-primitives-with-leak-checks: Prefer the framework''s real test primitives
        along with leak and disposable checks. (SKILL.md:28)'
      - 'verify-ui-in-running-build: Confirm UI behavior in an actual running build. (SKILL.md:28)'
      - 'structured-logger-with-debug-context: Emit diagnostics through a structured logger
        carrying sufficient detail to trace a problem starting from an id. (SKILL.md:29)'
      - 'no-console-log-in-shipped-code: Forbid console.log in code that ships. (SKILL.md:29)'
