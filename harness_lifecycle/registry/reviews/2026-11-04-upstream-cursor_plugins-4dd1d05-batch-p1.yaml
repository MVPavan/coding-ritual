themes: 'These rows serve four aims: a person can follow what they are told (`teach`, `i-have-adhd`,
  and the new `in-your-own-words` and `sharpen`), work picks up where it stopped (the new
  `recall`), claims of safety and of being finished carry proof (`review`, `test-driven-development`,
  and the new `figure-it-out` playbook, adopted whole), and a repeated mistake is fixed at
  the highest level that works (`authoring-for-agents`, `principle-type-system-discipline`,
  and the new `principle-no-comments` with its `no-comments` sweep). The new units follow
  the owner''s rulings of 2026-11-05 and, for `recall`, 2026-11-06. Capabilities still with
  no home among ours are deferred to the owner''s review of deferred and rejected traits (`cr-r2pa.3.3`),
  and any wording that follows goes through `cr-r2pa.3.4`. The recommendations are ruled as
  one set, with named exceptions. Adopts into a unit not built yet carry no frozen wording,
  so the critic of each new body, which `harness_lifecycle/playbook.md` requires, must map
  every such row, including its modification and the delivery wording in its reason, to delivered
  `file:line` evidence before completion; a deviation returns for a ruling, and the build
  brief cites the sealed report.'
