    analysis:
      blind:
      - 'repo-change-over-reminder: Answer repeated corrections by altering the repository
        so the next agent cannot make the mistake. (SKILL.md:9)'
      - 'worst-case-contributor-model: Assume each contributor is an agent limited to the
        files it opened, imitating the closest example and choosing the quickest route to
        a successful compile. (SKILL.md:11)'
      - 'locally-right-is-globally-right: Arrange the repository so a change that looks correct
        from one file is correct everywhere. (SKILL.md:11)'
      - 'mine-mistake-evidence: Collect mistakes from recent history, reverts, review remarks,
        agent instruction files and comments explaining workarounds. (SKILL.md:15)'
      - 'group-into-mistake-classes: Cluster the found mistakes into classes. (SKILL.md:15)'
      - 'two-occurrence-threshold: Count a class only after it has happened at least twice.
        (SKILL.md:15)'
      - 'highest-level-fix-ladder: Try fixes in order of architecture, types, lint or CI,
        tests and finally docs, stopping at the highest level that works. (SKILL.md:17-22)'
      - 'single-owner-for-state: Give each piece of state exactly one owner. (SKILL.md:19)'
      - 'one-supported-way-per-task: Allow one sanctioned way of doing each task. (SKILL.md:19)'
      - 'hide-internals-so-wrong-import-fails: Encapsulate internals so an incorrect import
        does not work. (SKILL.md:19)'
      - 'single-source-for-synced-lists: Replace lists kept in sync by hand with one source
        of truth. (SKILL.md:19)'
      - 'delete-copyable-old-ways: Remove outdated approaches and dead code an agent might
        imitate. (SKILL.md:19)'
      - 'unwritable-bad-state-types: Use types so the wrong state cannot be expressed. (SKILL.md:20)'
      - 'check-error-names-the-replacement: Where wrong code can still compile, add a CI check
        or lint rule whose message points at the specific file, type or function to use. (SKILL.md:20)'
      - 'ratchet-on-common-patterns: When a pattern is already widespread, fail only on changes
        that add more of it. (SKILL.md:20)'
      - 'fix-or-delete-insensitive-tests: Repair or remove a test that stays green when its
        behavior breaks. (SKILL.md:21)'
      - 'fix-or-delete-implementation-coupled-tests: Repair or remove a test that goes red
        when only internals change. (SKILL.md:21)'
      - 'docs-last-judgment-only: Reserve docs and agent rules for judgment calls as the final
        option, since skipping them makes nothing fail. (SKILL.md:22)'
      - 'most-frequent-classes-first: Fix the classes that occur most often in this pass.
        (SKILL.md:26)'
      - 'one-commit-per-class: Land each class''s fix in its own commit. (SKILL.md:26)'
      - 'prove-check-on-real-past-mistake: Show each new check failing against a mistake that
        actually occurred. (SKILL.md:26)'
      - 'same-command-local-and-ci: Run the identical command on a developer machine and in
        CI. (SKILL.md:26)'
      - 'inline-exception-with-reason: Record an exception on the offending line along with
        its justification. (SKILL.md:26)'
      - 'expiring-exceptions: Give every exception an expiry date. (SKILL.md:26)'
      - 'human-approved-exceptions: Require a person''s approval for each exception. (SKILL.md:26)'
      - 'rule-to-enforcer-table: Maintain in the agent instruction file a table pairing each
        rule with what enforces it. (SKILL.md:30)'
      - 'correction-adds-rule: On each operator correction, fix the mistake and also add the
        rule. (SKILL.md:30)'
      - 'unenforced-repeat-escalation: If a corrected rule already existed without enforcement,
        count it as a repeat and solve it at the top workable level within that change. (SKILL.md:30)'
      - 'retire-impossible-rules: Remove a rule once its mistake can no longer occur. (SKILL.md:30)'
      - 'report-class-evidence-level-rationale: Report for every class the supporting evidence,
        the chosen level and why no higher level worked. (SKILL.md:32)'
