    analysis:
      blind:
      - 'design-playbook-before-code: When no existing playbook fits, produce a phased workflow
        as the first deliverable, ahead of any code. (SKILL.md:9)'
      - 'todolist-with-principles-first: Open a todo list whose first item is reading a principles
        section, then add each phase as an item. (SKILL.md:13)'
      - 'ground-before-commit: Do the grounding before starting, and do not begin the run
        until the framing can be stated. (SKILL.md:17)'
      - 'falsifiable-done-predicate: Define done as a claim that can be shown false. (SKILL.md:19)'
      - 'quantified-scope-with-blockers: State scope in rough units and effort along with
        blockers grounding turned up. (SKILL.md:20)'
      - 'rigor-scaled-to-reversibility: Pick a rigor level biased high, raised for one-way
        doors and wide impact and lowered for reversible low-stakes steps. (SKILL.md:21)'
      - 'rigor-means-gates-and-artifacts: Define rigor as concrete gates and artifacts, not
        extra effort. (SKILL.md:21)'
      - 'present-framing-and-tradeoffs: Show the human the framing and its tradeoffs ahead
        of a long run. (SKILL.md:23)'
      - 'reversible-work-proceeds: Continue reversible work without waiting on the human.
        (SKILL.md:23)'
      - 'single-checkpoint-on-long-run: Give a multi-hour run one checkpoint with the human.
        (SKILL.md:23)'
      - 'atomic-landable-units: Split the work into atomic units that can each land independently.
        (SKILL.md:27)'
      - 'riskiest-unknown-first: Order the units so the largest unknown is tackled first.
        (SKILL.md:27)'
      - 'scaffold-and-verification-before-features: Put scaffolding and verification ahead
        of feature work. (SKILL.md:27)'
      - 'harness-with-pre-change-baseline: Build the verification harness first and capture
        a baseline before changing anything, so results read as old against new. (SKILL.md:29)'
      - 'design-contest-for-one-way-doors: For design choices that cannot be undone, run a
        design skill that pits alternatives against each other. (SKILL.md:30)'
      - 'skip-design-contest-on-settled-work: Skip that design contest for mechanical work
        of known shape, and do not repeat it on a settled design. (SKILL.md:30)'
      - 'fan-out-across-seams-only: Decide what runs in parallel, parallelizing only where
        the work has seams and not over-fanning. (SKILL.md:31)'
      - 'worktree-per-worker: Give each parallel worker its own worktree or branch. (SKILL.md:31)'
      - 'per-subagent-reasoning-and-speed: Choose each subagent''s reasoning level and speed
        tier for its job according to a shared guide. (SKILL.md:31)'
      - 'written-phase-list-for-review: Write down the designed phases as the thing the human
        reviews. (SKILL.md:32)'
      - 'design-steps-into-todolist: Insert the designed steps as concrete todo items between
        the loop and audit entries. (SKILL.md:34)'
      - 'rolling-log-rows: Add a trail row as each step lands, not all at the end. (SKILL.md:34)'
      - 'hypothesis-per-unit: Treat each unit as an experiment with a stated hypothesis. (SKILL.md:38)'
      - 'smallest-change-per-experiment: Make the smallest change that tests the hypothesis.
        (SKILL.md:38)'
      - 'measure-against-predicate-on-artifact: Measure each change against the done predicate
        using the real artifact. (SKILL.md:38)'
      - 'keep-or-revert-rule: Keep a change that moved things forward and revert one that
        did not. (SKILL.md:38)'
      - 'verify-unit-before-next: Verify each unit before starting another instead of batching
        checks for the end. (SKILL.md:38)'
      - 'artifact-inspection-over-self-report: Verify by looking at the artifact and never
        by accepting a self-report. (SKILL.md:40)'
      - 'too-easy-pass-suspicion: When something passes too easily, question the observation
        method before crediting the system. (SKILL.md:40)'
      - 'judge-paired-with-delegation: Pair delegated work with a judge. (SKILL.md:41)'
      - 'reset-and-harden-on-gate-gaming: When a worker games the gate, reset it and strengthen
        the contract. (SKILL.md:41)'
      - 'fix-wrong-gate-separately: When the gate itself is wrong, correct it in its own change
        and do not route around it. (SKILL.md:41)'
      - 'three-value-verdict: Report results as verified, not verified or inconclusive, with
        inconclusive never counting as a pass. (SKILL.md:42)'
      - 'no-hidden-negatives: Do not conceal negative results. (SKILL.md:42)'
      - 'commit-the-trail: For ambitious work, commit the trail so it is visible to the reviewer
        within the pull request. (SKILL.md:46)'
      - 'whole-result-on-real-product: Check the finished whole against the opening predicate
        on the real product, beyond the harness. (SKILL.md:50)'
      - 'encode-recurring-corrections: Turn any recurring correction into a gate, lint rule,
        check or script. (SKILL.md:50)'
      - 'closing-reply-fields: Reply with the designed playbook, rigor level and reason, trail
        path, what is verified against the predicate and what is open. (SKILL.md:52)'
