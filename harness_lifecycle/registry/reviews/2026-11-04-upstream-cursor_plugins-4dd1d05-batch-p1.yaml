    analysis:
      blind:
      - 'current-state-capsule-goal: Rebuild recent working context into a compact statement
        of the present position and what comes next. (SKILL.md:9)'
      - 'read-only-what-threads-need: Limit reading to what the in-scope threads require,
        then stop. (SKILL.md:11)'
      - 'two-record-context-model: Treat context as living in both the agent''s own chat history
        and a shared record of tracker, chat, docs, source control and error reports. (SKILL.md:13)'
      - 'transcript-location-convention: Locate past chats in a per-workspace folder of line-per-message
        JSONL transcripts whose name derives from the workspace path. (SKILL.md:15)'
      - 'classify-and-route-away: First rule out resuming one known chat, making a durable
        skill from habits and writing a human-facing work summary, since those are other tasks.
        (SKILL.md:17)'
      - 'skip-mining-with-supplied-capsule: If the user already gave paths, branch and the
        change, use that and do no mining. (SKILL.md:17)'
      - 'lock-scope-before-search: Fix the time window, topic and workspace before any searching.
        (SKILL.md:18)'
      - 'seven-day-default-window: Treat recent as a real range with a default of seven days.
        (SKILL.md:18)'
      - 'active-workspace-only-default: Default to the current workspace and read another
        project''s transcripts only when asked. (SKILL.md:18)'
      - 'state-scope-back: Say the locked scope to the user. (SKILL.md:18)'
      - 'no-silent-narrowing: Never quietly reduce a request for everything into a recent
        subset. (SKILL.md:18)'
      - 'parallel-cheap-model-fan-out: Spawn concurrent subagents on a fast, inexpensive model,
        each covering a slice of the chat history. (SKILL.md:19)'
      - 'order-by-real-mtime: Sort candidates by actual modification time using ls -t, never
        by identifier name. (SKILL.md:19)'
      - 'grep-then-read-matching-regions: Search for the topic first, then open only chats
        that match and only the parts of them that bear on it. (SKILL.md:19)'
      - 'exclude-current-and-noise-chats: Leave out the current chat along with subagent,
        evaluation and test chats. (SKILL.md:19)'
      - 'uniform-per-chat-schema: Require from each subagent one block per chat recording
        topic, goal, decisions, unresolved threads, difficulties and corrections, and produced
        artifacts. (SKILL.md:19)'
      - 'chat-id-citation-per-block: Have each returned block cite its chat identifier. (SKILL.md:19)'
      - 'direct-search-for-small-corpus: With one or two chats, search directly without fanning
        out. (SKILL.md:19)'
      - 'raw-transcripts-stay-in-subagents: Keep raw transcripts out of the main thread, which
        receives only findings. (SKILL.md:19)'
      - 'per-subagent-reasoning-and-speed: Choose each subagent''s reasoning level and speed
        tier for its job according to a shared guide. (SKILL.md:19)'
      - 'default-shared-record-sweep: Search the shared record by default if a feature, file,
        subsystem, area or bug is named, including for a request about the user''s own work.
        (SKILL.md:20)'
      - 'reuse-source-investigators: Hand the sweep to an existing set of per-source investigators
        and their playbooks. (SKILL.md:20)'
      - 'retarget-investigator-question: Change the investigators'' question from design rationale
        to current state, failed attempts and ongoing user reports. (SKILL.md:20)'
      - 'sweep-parallel-to-mining: Run the shared-record sweep at the same time as chat-history
        mining. (SKILL.md:20)'
      - 'one-investigator-per-source: Dedicate one investigator to each source. (SKILL.md:20)'
      - 'null-results-count: Treat an empty search result as a finding. (SKILL.md:20)'
      - 'disclose-unavailable-source: Skip an unavailable connected source and say that it
        was skipped. (SKILL.md:20)'
      - 'pure-activity-sweep-exemption: Omit the shared-record sweep only for activity recall
        that names no target. (SKILL.md:20)'
      - 'verify-artifacts-against-live-state: Check the surfaced PRs, branches and tickets
        with git and gh. (SKILL.md:21)'
      - 'full-transcript-for-agent-behavior: When the answer depends on what an agent actually
        did, read the complete transcript and not a trimmed local copy. (SKILL.md:21)'
      - 'brief-grouped-by-thread-on-topic: Organize the brief by thread and stay on the named
        topic. (SKILL.md:22)'
      - 'brief-section-order: Present capsule, thread status, problems and next move in that
        order, with further detail below or cut. (SKILL.md:26)'
      - 'capped-capsule-section: Hold the opening capsule to five bullets at most. (SKILL.md:28)'
      - 'status-tagged-thread-lines: Give each thread one line with exactly one tag from merged,
        open PR, in flight, verified uncommitted, reverted or planned. (SKILL.md:29)'
      - 'capped-recurring-problems: List at most five recurring problems, including persistent
        user symptoms and reverted fixes, so the next try starts from the last failure. (SKILL.md:30)'
      - 'single-concrete-next-move: End with the one most useful concrete next action. (SKILL.md:31)'
      - 'exclude-adjacent-unless-blocking: Leave out a neighboring feature or ticket unless
        it blocks this one. (SKILL.md:33)'
      - 'cut-detail-before-threads: When the brief passes a screen, remove detail ahead of
        removing threads. (SKILL.md:33)'
      - 'source-specific-citations: Cite chat findings by identifier and shared-record findings
        by PR number, ticket, chat permalink or error-tracker issue. (SKILL.md:33)'
      - 'sanitize-before-public-output: Remove private context before any public output. (SKILL.md:33)'
      - 'reply-is-the-brief: Return only the brief in its required form. (SKILL.md:35)'
