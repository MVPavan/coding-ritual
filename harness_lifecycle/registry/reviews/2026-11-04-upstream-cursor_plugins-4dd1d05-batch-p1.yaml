    analysis:
      blind:
      - 'beyond-the-callers-focus: Spend the effort on breakage text search cannot reveal,
        not on listing callers. (SKILL.md:13)'
      - 'distrust-plausible-writeup: Treat a convincing writeup as worthless by itself, because
        it reads the same whether or not it is true. (SKILL.md:17)'
      - 'evidence-ladder-per-safety-fact: Grade each safety-bearing fact as asserted, cited
        to a line, failure walked through, executed in a script or test, or reproduced in
        the running app. (SKILL.md:21-27)'
      - 'push-as-far-as-cheap-and-disclose: Take each fact as far up that ladder as is cheap
        and state where it stopped. (SKILL.md:21)'
      - 'small-real-library-script: Normally reach the executed level with one short script
        that imports the library shipped with the app and invokes precisely the function at
        issue. (SKILL.md:29)'
      - 'failing-loud-proof: Make the script or test fail noisily if the claim is wrong. (SKILL.md:26)'
      - 'read-whole-change-including-unstated: Go through the diff, the symbols added, changed
        and deleted, and the behavior change the diff does not spell out. (SKILL.md:33)'
      - 'pull-pr-and-commit-history: Retrieve the related PR and commits while reading the
        change. (SKILL.md:33)'
      - 'single-safety-fact-search: Find the one fact that makes the change safe and clears
        most risky cases, and spend the time there, not on a long list of possibilities. (SKILL.md:34)'
      - 'read-dependency-source-and-pin: Read the called library''s source and confirm its
        pinned version and whether it is locally patched. (SKILL.md:35)'
      - 'timing-and-lifecycle-analysis: Work out when things execute, including microtasks,
        unmount and teardown, and framework differences. (SKILL.md:35)'
      - 'non-symbol-coupling-trace: Follow links symbol search misses: API JSON, database
        columns, wire formats, another language reading the same bytes, feature flags and
        code several hops away. (SKILL.md:35)'
      - 'likelihood-and-cost-per-risk: Give each risk an honest probability and an honest
        cost. (SKILL.md:36)'
      - 'confirmed-and-cleared-split: Keep confirmed risks apart from those checked and cleared.
        (SKILL.md:36)'
      - 'real-line-citations: Cite actual file and line locations. (SKILL.md:36)'
      - 'empty-search-is-an-answer: Count a search that finds nothing as a result. (SKILL.md:36)'
      - 'no-invented-callers-or-apis: Never fabricate a caller or an API. (SKILL.md:36)'
      - 'run-and-paste-proof: Write a script or test against the real code, run it and include
        what happened. (SKILL.md:37)'
      - 'multi-model-review-for-wide-changes: For a big or wide change, put the same question
        to more than one model and merge the answers. (SKILL.md:38)'
      - 'handback-what-it-does: Say what changed, including the non-obvious part. (SKILL.md:42)'
      - 'handback-safety-fact-with-grade: State the safety fact, its ladder level and its
        proof, or mark it unproven. (SKILL.md:43, SKILL.md:50)'
      - 'handback-risk-fields: For each risk give how it breaks, file and line, likelihood
        and severity, how to check it, and the proof for those that matter. (SKILL.md:44)'
      - 'handback-cleared-list: List what was checked and why it is fine. (SKILL.md:45)'
      - 'handback-pre-merge-check: Give the cheapest test or reproduction able to expose the
        actual bug, along with any script written. (SKILL.md:46)'
      - 'strip-private-before-public: Remove private material before the writeup goes anywhere
        public. (SKILL.md:48)'
