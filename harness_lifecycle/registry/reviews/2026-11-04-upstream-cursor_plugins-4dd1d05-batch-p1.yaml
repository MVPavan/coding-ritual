      reason: 'Compared with test-driven-development: the same job and the most overlap.'
    analysis:
      blind:
      - 'executable-bug-before-code-change: When a bug has a clear and cheap test path, make
        the failure runnable before touching production code. (SKILL.md:9)'
      - 'fails-before-passes-after-goal: Aim for one focused regression test that is red before
        the fix and green after. (SKILL.md:9)'
      - 'impracticality-skip-conditions: Add no new test when it would demand wide harness
        setup, fragile mocks, slow full-stack infrastructure, state only production has, unclear
        reproduction or heavy unrelated fixture changes. (SKILL.md:11)'
      - 'bug-understanding-checklist: Identify intended behavior, current behavior, the affected
        path and the smallest observable reproduction. (SKILL.md:15)'
      - 'narrowest-existing-check-type: Prefer the closest kind of test already used for that
        codepath. (SKILL.md:16)'
      - 'no-from-scratch-test-path: Do not build a test path from nothing merely to follow
        the workflow. (SKILL.md:16)'
      - 'test-first-smallest-catching-test: Write first the smallest focused test able to
        catch this bug. (SKILL.md:17)'
      - 'encode-intent-not-implementation: Have the test express intended behavior, not mirror
        how the code works today. (SKILL.md:17)'
      - 'confirm-failure-for-right-reason: Run the new test before fixing and, if it passes
        or fails for another reason, correct the test or reproduction first. (SKILL.md:18)'
      - 'minimal-contract-preserving-fix: Make the smallest production change that gives the
        intended behavior and preserves neighboring contracts. (SKILL.md:19)'
      - 'rerun-to-confirm-pass: Run the regression test again after the fix and confirm it
        is green. (SKILL.md:20)'
      - 'closest-executable-fallback-check: When a failing test is impractical, substitute
        a targeted script, repro command, browser automation, snapshot diff, log assertion
        or narrow integration check. (SKILL.md:24)'
      - 'no-test-over-bad-test: Prefer adding nothing to a test that mostly exercises mocks,
        encodes internals, depends on timing or global state, requires costly infrastructure
        for minor fixes, or would be discarded right after. (SKILL.md:26)'
      - 'no-tests-bent-to-wrong-code: Do not alter tests only so they agree with incorrect
        behavior. (SKILL.md:30)'
      - 'no-weakened-assertions: Keep existing assertions as strong unless expected behavior
        truly changed for a clear reason. (SKILL.md:31)'
      - 'focused-regression-no-churn: Keep the regression test on the bug without broad fixture
        changes or added unrelated coverage. (SKILL.md:32)'
      - 'flaky-bug-determinism: For a flaky bug, remove nondeterminism from the test as far
        as possible and document which signal it pins. (SKILL.md:33)'
      - 'focused-first-then-sibling-coverage: When a bug reveals a wider failure class, land
        the focused regression first and only then consider related coverage. (SKILL.md:34)'
      - 'report-failing-before-evidence: Name the check that failed before the fix and the
        failure it gave. (SKILL.md:40)'
      - 'report-passing-after-evidence: Name the passing run after the fix and any nearby
        validation done. (SKILL.md:41)'
