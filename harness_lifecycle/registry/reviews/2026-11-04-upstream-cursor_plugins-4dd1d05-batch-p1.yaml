    pairing:
      overlap:
        delegation: 1
        interrogate: 1
      placement_match:
      - interrogate
      - review
      suggested: interrogate
      purpose_match: none
      purpose: Upstream runs a comment-deleting audit through a spawned role and acts on its
        findings. Ours has no comment audit; `review` reports findings on a change and removes
        nothing by itself. The owner's ruling of 2026-11-05 makes it a principle for the rules
        and a manual skill for the sweep, without the persona.
      flag: suggested differs
      reason: 'Compared with none: `review` only overlaps on handling findings, and nothing
        of ours audits comments. Suggested interrogate by the computed signals only.'
    analysis:
      blind:
      - 'default-review-scope: Work on whatever files or diff the caller supplied; failing
        that, compare the working tree and current changes with the base branch, which defaults
        to main. (SKILL.md:15)'
      - 'dedicated-comment-critic-role: Spawn a fixed subagent role, named comment-sicko,
        to do the comment audit, and pass it the scope. (SKILL.md:9, SKILL.md:19)'
      - 'defer-to-fresh-critic: Give weight to the critic''s fresh perspective over the caller''s
        own attachment. (SKILL.md:11)'
      - 'no-restating-role-rules: Do not repeat the critic''s rules in the spawn request.
        (SKILL.md:19)'
      - 'per-subagent-reasoning-and-speed: Choose each subagent''s reasoning level and speed
        tier for its job according to a shared guide. (SKILL.md:19)'
      - 'inspect-report-and-diff: Check both the critic''s report and its actual diff before
        accepting anything. (SKILL.md:20)'
      - 'reject-application-code-edits: Refuse any change the critic made to application code.
        (SKILL.md:20)'
      - 'reject-scope-escapes: Refuse critic work outside the given scope. (SKILL.md:20)'
      - 'reject-exception-protected-deletions: Refuse deletions of comments protected by a
        stated exception. (SKILL.md:20)'
      - 'reject-misstated-kill-reasons: Refuse a report whose reason for a mandatory deletion
        is wrong. (SKILL.md:20)'
      - 'reject-guilt-flags-on-kept-code: Refuse flags that treat intentionally retained code
        as being at fault. (SKILL.md:20)'
      - 'reshape-flags-stay-actionable: Keep flags asking to restructure surprising first-party
        code open, without bringing their comments back. (SKILL.md:20)'
      - 'keep-requires-unchangeable-proof: Allow a comment to survive only with proof it concerns
        something the team cannot alter. (SKILL.md:20)'
      - 'audit-missed-suppressions: Check the scope for lint and TypeScript suppression comments
        the critic overlooked. (SKILL.md:20)'
      - 'safety-suppressions-must-be-killed: Treat suppressions that bear on correctness or
        safety as mandatory-removal findings. (SKILL.md:20)'
      - 'restore-only-with-exact-exception: Bring back a deleted comment only when an exact
        exception and proof within scope exist. (SKILL.md:20)'
      - 'investigate-thin-importance-comments: Before accepting a thinly justified kill or
        keep of a comment marked important or do-not-remove, investigate its symbol''s behavior
        and history. (SKILL.md:20)'
      - 'ambiguity-defaults-to-deletion: Leave an ambiguous kill deleted, and delete a keep
        that is refuted or stays ambiguous. (SKILL.md:20)'
      - 'single-rerun-with-named-failure: After rejecting a report, revert it and rerun the
        critic once, stating what went wrong. (SKILL.md:20)'
      - 'second-rejection-fails-run: If the second report is also rejected, report it as open
        and fail the whole skill. (SKILL.md:20)'
      - 'direct-fix-for-trivial-flags: Resolve simple accepted flags at once through edits
        such as removing an unused path or parameter, or calling the genuine API. (SKILL.md:21)'
      - 'one-design-sketch-for-accepted-set: When a fix needs a design, run one design pass
        over all accepted flags and nearby code, stopping at the sketch. (SKILL.md:21)'
      - 'design-and-implementation-separated: Keep shaping with the design pass and leave
        implementation to the later step. (SKILL.md:21)'
      - 'smallest-root-cause-fix: Implement the smallest in-scope fix that addresses the underlying
        cause. (SKILL.md:22)'
      - 'remove-all-named-workarounds: Eliminate every workaround the findings name. (SKILL.md:22)'
      - 'out-of-scope-cause-reported: If the true cause lies beyond scope, ship the minimal
        fix available inside it and list the remainder as open. (SKILL.md:22)'
      - 'principles-never-widen-scope: Treat guiding principles as intent only, never permission
        to expand the boundary or fix other instances. (SKILL.md:22)'
      - 'no-symptom-guards: Never add a guard that merely masks a symptom. (SKILL.md:22)'
      - 'constraint-comment-recognition: Treat comments that forbid removal, forbid rewording
        or require consulting someone as a distinct class. (SKILL.md:23)'
      - 'leave-unchangeable-constraint-keeps: Leave kept comments that concern things outside
        the team''s control. (SKILL.md:23)'
      - 'offer-cheapest-enforcement: For other constraint comments, propose the least costly
        enforcement available in scope, whether a type, runtime check, test or CI lint. (SKILL.md:23)'
      - 'encoding-approval-gate: Wait for approval of the encoding in live use, and require
        advance approval from the caller when unattended or under evaluation. (SKILL.md:23)'
      - 'encode-then-delete: When approved, add the enforcement and then remove the comment.
        (SKILL.md:23)'
      - 'unencoded-constraint-deleted-and-reported: Without approval, delete the comment,
        report the constraint as open and sketch any out-of-scope work. (SKILL.md:23)'
      - 'closing-report-fields: Report how many comments were deleted and restored, reruns,
        the design sketch, fixes, offered and completed encodings, constraints left unenforced
        and remaining open items. (SKILL.md:24)'
