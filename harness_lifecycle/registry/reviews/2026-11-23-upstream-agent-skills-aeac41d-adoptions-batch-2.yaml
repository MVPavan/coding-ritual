themes: 'agent-skills browser-testing-with-devtools, analysed for the first time (21 traits),
  ruled under the owner''s ruling of 2026-11-22 (bead cr-r2pa.3.3): an optional browser check
  in Visual parity, used when a browser tool is installed and skipped cleanly without one.
  Adopted: the live check, driving the page as a user, screenshots from the driven browser,
  console and network findings, two navigation and content-safety rules and a browser-specific
  secrets rule, into the playbook; the content-authority rule already held by AGENTS.md. Rejected:
  tool setup and profile flags, page-script rules for scripts the branch never runs, the debugging,
  performance, accessibility and test-plan procedures our own units hold, and the gates that
  would make the check mandatory.'
