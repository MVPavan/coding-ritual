# Our skills: one entry per real .claude/skills/<name> folder (aliases and
# legacy stubs get none). Records in skill-records/ are generated from this
# file and each SKILL.md description. Rules: README §2-§3;
# docs/workstreams/skill-curation/stages-design.md §Skills file.

authoring-for-agents:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: agent-doc-authoring
  aliases: []
  status: active
  boundary: "Writes or changes our own agent instructions and their triggers; judging upstream capabilities is the harness-* skills, and porting assets to Codex is migrate-claude-to-codex."
beads:
  domain: core
  stage: X
  substage: Continuity
  secondary: []
  family: handoff
  aliases: []
  status: active
  boundary: "Tracks durable work state and how to resume it; a reviewable log of one run's decisions is decision-trail, which a bead note may point at."
brainstorming:
  domain: core
  stage: Intake
  substage: Clarification
  secondary: []
  family: spec-authoring
  aliases: [idea-refine]
  status: active
  boundary: "Explores and compares options when scope or behaviour is open and ends at decisions; writing settled decisions up as a durable spec is to-spec, and an explicitly requested interview that challenges the owner's own plan is grilling."
build-a-lever:
  domain: core
  stage: Building
  substage: Implementation
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Builds and proves a rerunnable tool (script, codemod, generator or check) that does or proves real work; a throwaway experiment answering a design question is prototype, and test-first proof of a behaviour change is tdd."
check-invariants:
  domain: engineering
  stage: Verification
  substage: Testing
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Runs the project overlay's mechanically checkable invariants and reports pass or fail; judging what a test asserts is principle-test-behavior-not-implementation."
codebase-design:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: interface-design
  aliases: []
  status: active
  boundary: "Decides module interfaces, encapsulation and testability in code; domain terms and ADRs are domain-modeling, revising design documents is design-evolve, and runnable experiments are prototype."
codebase-research:
  domain: engineering
  stage: Discovery
  substage: Research
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Durable, manually invoked reports on an external codebase; how this repository's own code works is how and why it has its shape is why, outside sources for a decision are research, and improvement proposals are improve-codebase-architecture."
decision-trail:
  domain: core
  stage: X
  substage: Continuity
  secondary: []
  family: handoff
  aliases: []
  status: active
  boundary: "Keeps one run's decisions as an append-only log, audits it and gets it independently reviewed; work state is beads, a plan's run is implement, a compact attempt record is performance-optimization, and reviewing other artifacts is review."
delegation:
  domain: core
  stage: X
  substage: Coordination
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Hands one piece of work to another agent or model: role, roster model, vendor, brief, dispatch and the check of what ran; whether to delegate is the calling workflow's choice, councils are model-council and perspective-council, and choosing a unit is mvp-mode."
design-evolve:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Folds supplied discussions and decisions into the next self-contained version of existing design documents; it makes no new design decision (codebase-design, domain-modeling)."
domain-modeling:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: domain-language
  aliases: []
  status: active
  boundary: "Owns domain terminology, the glossary and ADRs; module structure is codebase-design, and revising a design document is design-evolve."
implement:
  domain: engineering
  stage: X
  substage: Coordination
  secondary: []
  family: plan-execution
  aliases: [phase-execution, run-phases]
  status: active
  boundary: null
how:
  domain: engineering
  stage: Discovery
  substage: Research
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "One cited, read-only answer about how something in this project works now, or which option fits once scope is settled. Why it has its shape is why, a report on an external codebase is codebase-research, a saved answer is the investigation playbook, outside sources are research, an unexplained failure is systematic-debugging, open scope is brainstorming, and a wanted change goes back through the router."
why:
  domain: engineering
  stage: Discovery
  substage: Research
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "One cited, read-only answer about why something in this project is the way it is, or what was decided about it, from the project's own record (git, Beads, decision records, docs). How it works now is how, evidence from outside the project is research, past agent sessions are recall once it exists, an unexplained failure is systematic-debugging, and a saved answer is the investigation playbook."
grilling:
  domain: core
  stage: Intake
  substage: Clarification
  secondary: []
  family: grilling
  aliases: [grill-me, grill-with-docs]
  status: active
  boundary: "Interrogates the owner's plan question by question, only on explicit request; open option exploration is brainstorming, and a written critique of an artifact is review."
harness-evaluate:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Decides one reference capability (adopt, reject, defer, sync); finding candidates is harness-scan, and a deep side-by-side analysis is harness-skill-compare."
harness-publish:
  domain: core
  stage: Delivery
  substage: Release
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: null
harness-scan:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Finds drift and unruled candidates in one reference harness and reports them; the decision is harness-evaluate, and the quick view across all harnesses is harness-status."
harness-skill-compare:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Compares skills' triggers, behaviour and curation choices in depth as evidence; it records no decision (harness-evaluate) and scans no harness (harness-scan)."
harness-status:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Summarises drift across every reference harness in one table without moving pins; candidates within one harness are harness-scan."
html-artifact:
  domain: core
  stage: X
  substage: Communication
  secondary: []
  family: visual-explanation
  aliases: []
  status: active
  boundary: "Produces a standalone rendered HTML document; an inline sketch in the conversation is show-me, and shaping replies for an ADHD reader is brief-me."
brief-me:
  domain: core
  stage: X
  substage: Communication
  secondary: []
  family: conversational-repair
  aliases: []
  status: active
  boundary: "Shapes every reply for an ADHD reader once invoked (next action first, small concrete steps); it produces no document or diagram (html-artifact, show-me)."
improve-codebase-architecture:
  domain: engineering
  stage: Operations
  substage: Maintenance
  secondary: []
  family: architecture-audit
  aliases: []
  status: active
  boundary: null
interrogate:
  domain: core
  stage: Verification
  substage: Review
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Reports only what a run proved, where review judges by reading and reports every finding. grilling questions a person and runs nothing. prototype answers an open question before a choice, while this attacks a chosen change or design, and an adversary may build a throwaway probe without running that skill. systematic-debugging starts from a known failure and finds its cause, while this looks for failures and stops at the repro, and an unexplained finding goes back to the caller. model-council has members and a judge reach one answer or artifact, while this has no judge and no pick, and keeps every verified finding."
land:
  domain: engineering
  stage: Delivery
  substage: Integration
  secondary: []
  family: git-mechanics
  aliases: []
  status: active
  boundary: "Turns verified changes into titled, ordered commits or a commit plan, only on finished work; a tree already in conflict is resolving-merge-conflicts, plugin releases are harness-publish, running the work is implement, and commit size and order come from principle-sequence-verifiable-units."
migrate-claude-to-codex:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Ports existing Claude harness assets to Codex form; writing or changing the instructions themselves is authoring-for-agents."
model-council:
  domain: core
  stage: X
  substage: Coordination
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Runs an explicitly requested council of named models or agents with a judge; a council of perspectives or roles is perspective-council, and dispatching each member is delegation; on request it also turns candidates into one artifact, which a build's playbook then uses."
mvp-mode:
  domain: core
  stage: X
  substage: Coordination
  secondary: []
  family: skill-routing
  aliases: []
  status: active
  boundary: "Routes a task to the playbook, principle or skill that fits and lists what exists; it holds no policy (AGENTS.md) or technique, spawns no agents (delegation) and convenes no council."
performance-optimization:
  domain: engineering
  stage: Building
  substage: Diagnosis
  secondary: []
  family: performance
  aliases: []
  status: active
  boundary: "Handles measured resource problems: locate a cost, or profile, change and re-measure against a target, vetting the numbers on the way; a caller may bring another measurable outcome. What makes a number evidence is principle-explain-the-number. A standalone causal investigation of a failure, flaky behaviour or a regression is systematic-debugging; a live capture a caller asks for gathers evidence even from a failing process and leaves the cause to the caller's debugging call. An artifact captured earlier is trace-forensics."
perspective-council:
  domain: core
  stage: X
  substage: Coordination
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Runs an explicitly requested council of perspectives or roles (a war room); a council of named models with a judge is model-council."
principle-attack-the-premise:
  domain: engineering
  stage: Building
  substage: Diagnosis
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "A gate applied once fixes resting on one belief keep failing: name and test that belief; finding a failure's cause is systematic-debugging, and the fix loop is the bug-fix playbook."
principle-boundary-discipline:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Where data is checked and trusted (boundary validation, parsing, internal trust, public types, pure core); interface shape and depth are codebase-design, and type-level rules are principle-type-system-discipline."
principle-exhaust-the-design-space:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Lays out materially different ways to meet a decision with no precedent in this project, of any kind, and chooses with reasons; building running variants to compare by feel is prototype, and comparing interface designs for a consequential choice is codebase-design."
principle-experience-first:
  domain: engineering
  stage: Design
  substage: Specification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Weighs product, UX and scope tradeoffs from the consumer's side; writing the spec is to-spec, and comparing variants by feel is prototype."
principle-explain-the-number:
  domain: engineering
  stage: Building
  substage: Diagnosis
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Decides when a measured number counts as evidence; running the optimisation loop is performance-optimization."
principle-fix-root-causes:
  domain: engineering
  stage: Building
  substage: Diagnosis
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Says where a failure's cause lies (the why-chain, the legitimate-state test, persisted state after a restart); the diagnosis procedure is systematic-debugging and fixing a reported bug end to end is the bug-fix playbook."
principle-make-operations-idempotent:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Makes state-changing operations safe to rerun and to stop partway; concurrent writers are principle-separate-before-serializing-shared-state."
principle-migrate-without-shims:
  domain: engineering
  stage: Design
  substage: Decomposition
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Replaces an internal API or runs a declared migration without compatibility layers; ordinary unit sequencing is principle-sequence-verifiable-units, and the plan itself is to-plan."
principle-minimize-reader-load:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Judges code by the layers and state a reader must trace; module interface decisions are codebase-design."
principle-model-the-domain:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Chooses data structures and module boundaries around domain knowledge before logic; domain terms and ADRs are domain-modeling, and interface depth is codebase-design."
principle-redesign-from-first-principles:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Reworks an existing design around a new requirement as if it had been founding; revising design documents is design-evolve."
principle-separate-before-serializing-shared-state:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Removes or structurally serializes shared writes in code and tooling being designed; how agent work is divided is delegation and AGENTS.md."
principle-sequence-verifiable-units:
  domain: engineering
  stage: Building
  substage: Implementation
  secondary: [Decomposition]
  family: null
  aliases: []
  status: active
  boundary: "Slices and orders multi-step work into checked units, and those units into commits: vertical slices, prefactoring first, expand, migrate then contract, and migration batches sized by blast radius; test-first proof of one change is tdd, a declared migration group is principle-migrate-without-shims, and writing the plan or the tracked stages that apply it is to-plan or to-roadmap."
principle-subtract-before-you-add:
  domain: engineering
  stage: Design
  substage: Decomposition
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Removes what the change touches before adding; decomposing work into a plan is to-plan."
principle-test-behavior-not-implementation:
  domain: engineering
  stage: Verification
  substage: Testing
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Judges what a test asserts and whether it earns its place; the test-first cycle is tdd."
principle-type-system-discipline:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Moves rules into the type checker in a typed language; where raw input becomes typed values is principle-boundary-discipline."
unslop:
  domain: core
  stage: X
  substage: Communication
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Edits a reply or document a person will read, keeping its meaning; agent-facing text is authoring-for-agents, a standalone rendered page is html-artifact, shaping replies for an ADHD reader is brief-me, and folding decisions into design documents is design-evolve."
prototype:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: [Research]
  family: design-validation
  aliases: []
  status: active
  boundary: "Builds a runnable throwaway experiment that answers one design question; the decision it informs belongs to codebase-design or domain-modeling. It recommends among variants it built; building the chosen one is separate work."
research:
  domain: core
  stage: Discovery
  substage: Research
  secondary: []
  family: source-research
  aliases: []
  status: active
  boundary: null
resolving-merge-conflicts:
  domain: engineering
  stage: Delivery
  substage: Integration
  secondary: []
  family: git-mechanics
  aliases: []
  status: active
  boundary: "Resolves a merge, rebase or cherry-pick already in conflict and finishes that operation; turning ordinary verified changes into commits is land."
review:
  domain: core
  stage: Verification
  substage: Review
  secondary: [Specification, Decomposition]
  family: code-review
  aliases: [document-review, receiving-code-review]
  status: active
  boundary: "An ordinary or critical look, judged by reading, reporting every finding; to break a change and keep only run-proven findings is interrogate."
security:
  domain: engineering
  stage: Verification
  substage: Review
  secondary: [Architecture]
  family: security-hardening
  aliases: []
  status: active
  boundary: null
show-me:
  domain: core
  stage: X
  substage: Communication
  secondary: []
  family: visual-explanation
  aliases: []
  status: active
  boundary: "Draws the current topic inline in the conversation; a standalone rendered document is html-artifact."
skill-router:
  domain: core
  stage: X
  substage: Coordination
  secondary: []
  family: skill-routing
  aliases: []
  status: retired
  boundary: "Retired into mvp-mode, which now routes every task; kept as a manual-only pointer so its lineage and history stay readable. It delivers none of its former traits."
systematic-debugging:
  domain: engineering
  stage: Building
  substage: Diagnosis
  secondary: []
  family: debugging
  aliases: []
  status: active
  boundary: "Finds the cause of an unclear failure, a failed fix or flaky behaviour; slowness or resource use against a target is performance-optimization; a live capture a caller asks for, or where a resource goes with no failure, is performance-optimization's diagnosis-only branch."
teach:
  domain: core
  stage: U
  substage: Tutoring
  secondary: []
  family: learning-content
  aliases: [teach-session]
  status: active
  boundary: null
tdd:
  domain: engineering
  stage: Building
  substage: Implementation
  secondary: [Specification]
  family: tdd
  aliases: []
  status: active
  boundary: "Runs the test-first cycle for risky behaviour changes, regression proof and characterization; ordering multi-step work and commits into checked units is principle-sequence-verifiable-units."
to-plan:
  domain: engineering
  stage: Design
  substage: Decomposition
  secondary: []
  family: plan-authoring
  aliases: []
  status: active
  boundary: "Writes a durable implementation plan for settled work: one roadmap phase, one standalone change or one batch of units, and no plan document when a bounded task or a roadmap row already says enough; turning an approved spec into phases, stages and their order is to-roadmap, ordering the units is principle-sequence-verifiable-units, what to remove before adding is principle-subtract-before-you-add, and migrating without shims is principle-migrate-without-shims. A plan in checked form names per-unit evidence and one `implement` scope; running it is `implement`."
to-roadmap:
  domain: engineering
  stage: Design
  substage: Decomposition
  secondary: []
  family: plan-authoring
  aliases: []
  status: active
  boundary: "Turns an approved spec into tracked phases and stages with acceptance, their order and real dependency edges, seeded in Beads after approval, for a new workstream or extending an existing one; ordering the stages is principle-sequence-verifiable-units, writing the implementation plan for one phase or one change is to-plan, and writing the spec itself is to-spec."
to-spec:
  domain: core
  stage: Design
  substage: Specification
  secondary: []
  family: spec-authoring
  aliases: []
  status: active
  boundary: "Writes decisions already settled into a durable spec and gates its approval; exploring or comparing choices still open is brainstorming, turning an approved spec into tracked phases and stages is to-roadmap, and its implementation plan is to-plan."
triage:
  domain: core
  stage: Intake
  substage: Triage
  secondary: []
  family: issue-state-management
  aliases: []
  status: active
  boundary: null
wayfinder:
  domain: core
  stage: Discovery
  substage: Charting
  secondary: []
  family: task-decomposition
  aliases: []
  status: active
  boundary: null
wake:
  domain: core
  stage: X
  substage: Continuity
  secondary: []
  family: handoff
  aliases: []
  status: active
  boundary: "Holds a run's bounds and its one closing timer; what a return does is its caller's, a run's log is `decision-trail`, and a run the engine owns uses the engine's monitor."
