  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Folds supplied discussions and decisions into the next self-contained version of existing design documents; it makes no new design decision (codebase-design, domain-modeling)."
domain-modeling:
  domain: engineering
  stage: Design
  substage: Architecture
  secondary: []
  family: domain-language
  aliases: []
  status: active
  boundary: "Owns domain terminology, the glossary and ADRs; module structure is codebase-design, and revising a design document is design-evolve."
execution:
  domain: engineering
  stage: X
  substage: Coordination
  secondary: []
  family: plan-execution
  aliases: [phase-execution, run-phases]
  status: active
  boundary: null
grilling:
  domain: core
  stage: Intake
  substage: Clarification
  secondary: []
  family: grilling
  aliases: [grill-me, grill-with-docs]
  status: active
  boundary: "Interrogates the owner's plan question by question, only on explicit request; open option exploration is brainstorming, and a written critique of an artifact is review."
harness-evaluate:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Decides one reference capability (adopt, reject, defer, sync); finding candidates is harness-scan, and a deep side-by-side analysis is harness-skill-compare."
harness-publish:
  domain: core
  stage: Delivery
  substage: Release
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: null
harness-scan:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Finds drift and unruled candidates in one reference harness and reports them; the decision is harness-evaluate, and the quick view across all harnesses is harness-status."
harness-skill-compare:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Compares skills' triggers, behaviour and curation choices in depth as evidence; it records no decision (harness-evaluate) and scans no harness (harness-scan)."
harness-status:
  domain: core
  stage: Improvement
  substage: Codification
  secondary: []
  family: null
  aliases: []
  status: active
  boundary: "Summarises drift across every reference harness in one table without moving pins; candidates within one harness are harness-scan."
html-artifact:
  domain: core
  stage: X
  substage: Communication
  secondary: []
  family: visual-explanation
  aliases: []
  status: active
  boundary: "Produces a standalone rendered HTML document; an inline sketch in the conversation is show-me, and shaping replies for an ADHD reader is i-have-adhd."
i-have-adhd:
  domain: core
  stage: X
  substage: Communication
  secondary: []
  family: conversational-repair
  aliases: []
  status: active
