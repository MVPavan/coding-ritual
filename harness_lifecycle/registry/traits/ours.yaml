  notes:
    source-reader-return-shape: "Its sealed row lands in SKILL.md; it is written in references/source-reader.md, the reader brief SKILL.md step 3 loads, and restated there. The brief also says a citation names the line that holds the claim and a guess is marked as a guess, never cited as drift: this trait's citation requirement with AGENTS.md's certainty policy (certainty-labelling), so neither is a trait of its own (critic-85e)."
    check-never-weakened-to-pass: "Reused for the maintenance pass (R3, a short guardrail restated per unit): a failing journey is fixed only when source proves the map wrong, never by loosening the journey, its check or its expected value (SKILL.md step 6)."
    live-service-isolation: "Reused for the maintenance pass (ruling A): every product command goes through the target's own helper; when the product uses a live service and the target lacks the generated-skill Isolation controls, the pass does not drive and stops blocked, naming the missing control (SKILL.md step 5)."
    dry-run-skips-observed: "Reused for the maintenance pass (Q1): each drive re-observes what the skill records an offline or dry-run mode skipping, by generated-skill Evidence, and a drive without that observation is no proof (SKILL.md step 5)."
    undriven-feature-marked: "Reused for the maintenance pass (ruling B, with the coordinator's ruling on cases): a feature keeps its index mark while any of its cases is undriven, its file naming each such case with route and prerequisite; driving a case writes its observed results there and takes it off the list (SKILL.md step 5)."
    change-proven-by-second-read: "Reused for the maintenance pass (ruling C, blind delta 88): each saved change names the product command that shows the saved item itself; a view of counts or a fingerprint, or the helper's own query, is not one (SKILL.md step 5, loading feature-map Proof by surface)."
    unreadable-change-unverified: "Reused for the maintenance pass (ruling C), unconditionally: with no read-only product view, the feature file says so and the coverage report lists the change unverified, never clean; a helper's own query is kept only as a labelled helper observation (SKILL.md step 5 and Reply)."
    credentials-never-captured: "Reused for the maintenance pass (ruling D): no credential, generated ones included, in evidence, notes, the reply or a helper diff; output that can hold one is parsed inside the helper and never saved, and the rule is rechecked after a harness fix (SKILL.md steps 5 and 6)."
    generated-skill-left-uncommitted: "Reused for the maintenance pass (R10): the one set of proven fixes stays uncommitted for land, with no branch, commit or pull request unless the person asks (SKILL.md step 8)."
    generator-started-by-person: "Reused for the maintenance pass (R1): manual-only in its frontmatter and its sidecar, reached through the mvp-mode router line; the definition names the generator, and critic-85e accepted the same activation mechanism as reuse."
    evidence-hashed-across-teardown: "Ours (owner rulings of 2026-11-15, item 5, bead cr-r2pa.2.28.6; split from the scan, critic-93b F1): just before final teardown the pass hashes every kept evidence file, after the last session's credential scan, and checks the hashes after teardown; a changed hash ends the pass blocked, naming the file (SKILL.md:161-164; the blocked outcome SKILL.md:30-32)."
    generated-credentials-scanned-before-cleanup: "Ours (owner rulings of 2026-11-15, item 5, bead cr-r2pa.2.28.6; critic-93b F1 and F2): before any cleanup or restart destroys a session's generated credentials, every kept file is searched for each of them through the helper, printing and saving no match; a match or an incomplete scan (a session whose credentials can no longer be checked) ends the pass blocked, the reply naming the file and the kind of match, or the session, never the credential (SKILL.md:124-129). The cleanup and restart points wait for it and the final teardown runs the last session's scan first (SKILL.md:30-32, SKILL.md:86-88, SKILL.md:98-102, SKILL.md:103-106, SKILL.md:161-162)."
    fixed-command-driven-as-written: "Ours (owner rulings of 2026-11-15, item 5, bead cr-r2pa.2.28.6; critic-89b F1): every documented command the pass corrected or added is driven exactly as written before it ships, whether or not the helper changed; only a case left marked not yet driven is exempt (SKILL.md:153-155)."
