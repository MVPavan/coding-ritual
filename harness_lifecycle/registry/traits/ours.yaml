    concurrent-regions-rendering: "Carried by the tool at statechart_lib/mermaid.py:36-84 (render); named in .claude/skills/statechart/SKILL.md:125-126."
    portable-mark-styles: "Carried by the tool at statechart_lib/mermaid.py:11-16 (MARK_STYLES); named in .claude/skills/statechart/references/render.md:39-40."
    raised-render-limits: "Adaptation (blind ruling): Mermaid has exactly two such limits, maxTextSize and maxEdges, and the tool computes both per chart into render.json. Rendering is unproven: the renderer is pinned, not installed (owner item 3)."
    chart-theming-rules: "Adaptation (blind ruling): CSS class rules only, in the stylesheet references/render.md gives. Rendering is unproven: the renderer is pinned, not installed (owner item 3)."
    check-never-weakened-to-pass: "Held (plan 83 §3a, as decision 3 restates it in the verification units): never loosen a rule, the model or its bounds so that a check passes; a break on the current behaviour is the finding (SKILL.md \"Write the spec\")."
    checker-install-signed-and-undoable: "Carried by the tool at statechart_lib/install.py: _stage checks mise, the Temurin archive and the TLC jar against their pinned checksums (_pinned), and mise's signed SHASUMS256.txt and Temurin's .sig against the publisher's key under a pinned fingerprint (_gpg); the TLC jar has no signature and is checked by sha256 and sha1 alone. install writes inventory-before.txt and inventory-after.txt (_inventory) and manifest.json (_Record) and on failure calls _remove; _remove, _remove_java and remove undo only what the manifest records and is still unchanged. Written in references/install.md, the per-user recipe both formal skills use. From the blind check's five install rows (87/blind/rulings.md), basis owner item 2."
ours:create-formal-verification-skill:
