  notes:
    traceable-to-code: "Written in references/model-fidelity.md, decision 4's shared reference, owned here and read by maintain-formal-verification-skill without restating it; that unit's adopt of the same ID is completed in round 2026-11-15-maintain-formal-verification-skill (P2 :457)."
    atomicity-fidelity: "Written in references/model-fidelity.md, decision 4's shared reference, owned here and read by maintain-formal-verification-skill without restating it; that unit's adopt of the same ID is completed in round 2026-11-15-maintain-formal-verification-skill (P2 :458)."
    property-fails-on-broken-variant: "Written in references/model-fidelity.md, decision 4's shared reference, owned here; maintain-formal-verification-skill's adopt of the same ID is completed in round 2026-11-15-maintain-formal-verification-skill (P2 :461). Blind ruling, after critic-90d F1: a variant counts only by its named property breaking, never by any failure, and means nothing while the main run fails (references/tool-branches.md, \"The TLC gate\"). Q1 move (owner rulings of 2026-11-15, item 1): when a confirmed bug moves the sync commit, variant verdicts are accepted only from a later run whose main run holds (references/model-fidelity.md:64-66)."
    generator-started-by-person: "Reused (decision 1): manual-only in its frontmatter and its sidecar, reached through its mvp-mode router row; the definition is generic to a skill generator (plan 83 §5)."
    generated-skill-left-uncommitted: "Reused (decision 10, Q2 of plan 77): the formal verify skill it writes stays uncommitted unless the person asks, and land makes the commit (SKILL.md \"6. Hand off\"). It has no feature map; the definition's \"and its map\" covers its coverage.json, which stays uncommitted with it."
    handover-points-to-maintenance: "Reused (decision 11): the hand-off names /maintain-formal-verification-skill as a slash pointer (SKILL.md \"6. Hand off\"), true now that the unit exists; skill-catalog.py --check proves it resolves."
    single-source-of-truth: "Reused (decision 4): references/model-fidelity.md is the one home of the model-fidelity rules, which maintain-formal-verification-skill reads and never restates. Not claimed: feature-map-owns-shared-rule and shared-reference-home (plan 83 §5)."
    checker-install-approved-per-user: "Held: statechart owns it; for TLC this unit asks first and follows statechart's references/install.md once approved, stopping and naming what is missing otherwise (SKILL.md \"2. Choose the tool\")."
    check-never-weakened-to-pass: "Held (decision 3, a short guardrail restated per unit): a failing check on the current code is a finding, and the property, the model and the bounds are never loosened until it passes (SKILL.md \"3. Build the check\")."
    generated-skill-run-once: "Held (decision 3): the generated skill is followed once by a cold agent on a planted break before hand-off, and an unfollowed one is a draft (SKILL.md \"5. Prove it on a planted break\")."
    verification-only-edits: "Held at references/formal-verify-skill.md \"Reading a failure\" (coordinator's ruling, round 2): the generated skill's own verification pass reports a real bug and leaves product code alone unless the person asks."
    generator-edits-own-output-only: "Held (coordinator's ruling, round 2): this run writes the new skill folder and only step 5's reversible planted edit besides, and product code otherwise changes only when the person asks (SKILL.md Scope); the planted edit is the run's labelled scaffolding, removed and checked against the baseline."
    cold-agent-reader: "Reused (blind ruling): SKILL.md step 4 applies create-verification-skill's references/generated-skill.md \"Writing rules\", which state it, to the formal skill it writes; the proof follows that skill as a cold agent."
    real-code-names: "Reused (blind ruling): applied through generated-skill.md's \"Writing rules\"; domain-vocabulary carries the project's names in the model and the property."
    registering-generated-frontmatter: "Reused (blind ruling): generated-skill.md's \"Frontmatter\", with the formal name <area>-verification and its own description (references/formal-verify-skill.md)."
    pre-existing-edit-separation: "Reused (blind ruling): before the planted edit it records the product checkout's status, diff and the generated skill's hash list as the baseline, never clears the person's changes, and proves the restoration against that baseline."
    sync-commit-advanced-after-match: "Q1 move (owner rulings of 2026-11-15, item 1): references/coverage-record.md Rules lets a maintain pass move sync_commit and covers on a confirmed bug, with the faithful model update, so the verification still matches the code, which then fails there (references/coverage-record.md:51-58; references/formal-verify-skill.md:76-80)."
ours:maintain-formal-verification-skill:
  tree_hash: "4e57aea6e17dc561199b27ee56ea4684c5b10f48a3ce3b0c40755e37a54d8d82"
  traits: [per-check-outcome, per-check-inventory, inferred-sync-commit, baseline-check-before-change, failure-classified-after-rerun, covered-change-sweep, four-way-change-classification, no-effect-judged-by-model, intended-change-needs-evidence, update-from-code-before-rerun, traceable-to-code, atomicity-fidelity, property-change-audit-trail, keep-bounds, property-fails-on-broken-variant, counterexample-replayed-on-code, bug-report-fields, uncommitted-repro-evidence, verify-skill-metadata-refresh, blocked-check-sync-freeze, per-check-report, stale-pass-disclosure, separate-verification-change, verification-only-edits, target-found-by-content, no-target-points-to-create, check-never-weakened-to-pass, generated-skill-run-once, generated-skill-left-uncommitted, generator-started-by-person, installed-recipe-or-blocked, checker-install-approved-per-user, sync-commit-advanced-after-match, pre-existing-edit-separation, coverage-and-sync-record, formal-coverage-data-file, counterexample-as-code-steps, verify-skill-capabilities, verdict-from-exit-and-messages, formal-contract-gaps-reported, fixed-command-driven-as-written]
  notes:
    per-check-outcome: "Q1 move (owner rulings of 2026-11-15, item 1): a faithful update followed by a failing property is \"updated and bug\" (SKILL.md:38); the update is kept and the record moves with it (SKILL.md:166-170), so the skill describes the code it checks and fails there until a fix or an evidenced promise change."
    traceable-to-code: "Applied at SKILL.md:114-116 from its one home create-formal-verification-skill/references/model-fidelity.md:10-28 (\"Traceability table\", decision 4), each citation at the commit checked; restated nowhere here."
    atomicity-fidelity: "Applied at SKILL.md:114-116 from its one home create-formal-verification-skill/references/model-fidelity.md:30-37 (\"Indivisible steps\", decision 4); restated nowhere here."
    property-fails-on-broken-variant: "Applied at SKILL.md:129-133 from its one home create-formal-verification-skill/references/model-fidelity.md:39-56 (\"Broken variants\", decision 4). Q1 move (owner rulings of 2026-11-15, item 1): while the main run fails a variant's verdict means nothing and is accepted again only from a run whose main run holds (SKILL.md:141-142, the reply at SKILL.md:194; create-formal-verification-skill/references/model-fidelity.md:64-66)."
    counterexample-replayed-on-code: "The replay includes every step a writer runs between the model's last modelled check and its commit (SKILL.md:134-139), the proof's lesson 1 applied in the build's round 3 (92/proof-report.md)."
    uncommitted-repro-evidence: "Plan 92 §3a.4: the reproduction is a scratch model configuration (fewer writers, a smaller bound) or a scratch test needing no service, kept in the run's notes and given or linked with its result in the reply, never in product code or the skill (SKILL.md:153-156)."
    verify-skill-metadata-refresh: "Q1 move (owner rulings of 2026-11-15, item 1): the refresh to the commit checked runs on a confirmed bug too, with the faithful update (SKILL.md:166-170; create-formal-verification-skill/references/coverage-record.md:51-58, create-formal-verification-skill/references/formal-verify-skill.md:76-80)."
    verification-only-edits: "Held (decision 3): a maintain pass edits only the target skill's own folder, and product code only when the person asks (SKILL.md:19-22)."
    target-found-by-content: "Held (decisions 3 and 5): the skill the person named, else every host skills folder searched by content as formal-verify-skill.md \"How other units recognise it\" describes; a folder name is only a hint (SKILL.md:42-46)."
    no-target-points-to-create: "Held (decision 3): with none found it stops and points to /create-formal-verification-skill, writing no skill; a verify skill that drives the real app goes to /maintain-verification-skill (SKILL.md:46-48)."
    check-never-weakened-to-pass: "Held (decision 3): never loosen a property, the model or its bounds so that a run passes; a failure on the current code is a finding (SKILL.md:22-23)."
    generated-skill-run-once: "Held (decision 3): the refreshed skill is followed once as its next reader would, its drift diff, Run command and exit code; unfollowed, it is a draft (SKILL.md:173-176). Its clause that every command the refresh changed or added runs as written before hand-over (bead cr-r2pa.2.28.6, owner rulings of 2026-11-15, item 5) is held as fixed-command-driven-as-written (coordinator's ruling, round 2026-11-15-maintain-verification-two-rules Round 2)."
    generated-skill-left-uncommitted: "Held (decision 10): the verification edits stay one uncommitted change for land (SKILL.md:181-182); the definition's \"and its map\" reads as coverage.json, as create-formal-verification-skill's note says."
    generator-started-by-person: "Held (decision 1): manual-only in its frontmatter (SKILL.md:4) and sidecar, said in the body (SKILL.md:14-15) and reached through its mvp-mode router row; the definition's \"skill generator\" is read as the same activation rule, as accepted for maintain-verification-skill (critic-85e)."
    installed-recipe-or-blocked: "Held (decision 6): a missing tool is installed only by the per-user recipe and pins the skill records, never system-wide; without a recorded recipe the check is blocked, naming what is missing (SKILL.md:77-80). Q4 (owner rulings of 2026-11-15, item 4): a generated formal skill now names that recipe (create-formal-verification-skill/references/formal-verify-skill.md:63-66)."
    checker-install-approved-per-user: "Held (decision 6, L2): the install waits for the person's approval and goes per user, never as root or through a shell-profile change; without approval the check is blocked, naming what is missing (SKILL.md:77-80)."
    sync-commit-advanced-after-match: "Held, adapted by Q1 move (owner rulings of 2026-11-15, item 1): sync_commit moves once the covered diff is read, the model updated from it and the rerun gives its expected verdicts, and on a confirmed bug it moves too with the faithful update, which matches the code as the definition asks; the check then fails there (SKILL.md:166-170; create-formal-verification-skill/references/coverage-record.md:51-58)."
    pre-existing-edit-separation: "Held (decision 10): the checkout's status, diff and the target's hash list are recorded before any edit, so the person's own edits stay apart from this pass's (SKILL.md:50-52)."
    coverage-and-sync-record: "Held (decision 7): per check the pass reads covers and sync_commit from coverage.json and refreshes them at step 6; for an older skill without the file it gathers the record from the skill's text and writes it (SKILL.md:58-61; create-formal-verification-skill/references/coverage-record.md:62-65)."
    formal-coverage-data-file: "Held (decision 7): that record is written as coverage.json beside SKILL.md by coverage-record.md, kept as data, never as prose (SKILL.md:58-61)."
    counterexample-as-code-steps: "Held (decision 3): a confirmed bug's counterexample is given as a few numbered steps in the code's own terms (function, row, lock) (SKILL.md:151-153), in the sentence that also carries bug-report-fields."
    verify-skill-capabilities: "Held (coordinator's ruling on blind extra 3, 92/build-report.md Round 2): a maintain pass keeps the skill's fixed sections (formal-verify-skill.md \"Sections\") through any fix (SKILL.md:23-24) and refreshes their table, Run output and sync mentions (SKILL.md:160-164), so the next agent still learns all four from the skill alone."
    verdict-from-exit-and-messages: "Held at SKILL.md step 5 (\"Judge each rerun by its exit code and the checker's own messages together\", SKILL.md:126-127); the definition's remaining clauses, every rule checked where the checker checks all reachable states and no option that hides a violation, arrive through the pointer to create-formal-verification-skill/references/tool-branches.md and its TLC gate (safety rules under INVARIANT, temporal formulas only under PROPERTY, never -continue), by decision D4 (blind check Weak 2). Owner-accepted on 2026-11-15 (owner rulings of 2026-11-15, item 6)."
    formal-contract-gaps-reported: "Ours (owner rulings of 2026-11-15, item 2, Q2 report): the skill is compared with formal-verify-skill.md as it is now, its sections, check.py steps 1-6 and the install recipe its Run section names, and each gap goes to the reply as a follow-up, none fixed, except writing coverage.json for a skill that lacks it (SKILL.md:63-67)."
    fixed-command-driven-as-written: "Held (owner rulings of 2026-11-15, item 5; coordinator's ruling, round 2026-11-15-maintain-verification-two-rules Round 2): every command the refresh changed or added runs as written before hand-over, whatever the refresh changed (SKILL.md:174-175); the definition's \"drive\" is that run, and a formal skill marks no case not yet driven, so the exemption never applies. The ruling's other half, the evidence hash across teardown and the generated-credential scan before cleanup, has no counterpart: a formal pass tears nothing down and generates no credential."
