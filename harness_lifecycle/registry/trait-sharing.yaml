# Why our skills share a trait: <trait>: {skills: [..], why, reviewed}.
# `check` computes the shared set from traits/ours.yaml (a trait listed by two
# or more of our active skills, doc:AGENTS.md counted) and warns on a shared
# trait with no entry; an entry whose skills differ, or for an unshared trait,
# fails. Rules: docs/workstreams/skill-curation/stages-design.md §Shared traits.
# Entries are justified by the owner (bead cr-talb).
dependency-edges:
  skills: [planning, wayfinder]
  why: "Each builds its own tracker graph, planning for implementation stages and wayfinder for decision tickets, and lets readiness drive the work; edge semantics stay in beads."
  reviewed: "2026-10-30"
real-id-wiring:
  skills: [planning, wayfinder]
  why: "Both create beads and then wire edges between the IDs they just created, each inside its own seeding procedure."
  reviewed: "2026-10-30"
drift-scan:
  skills: [harness-scan, harness-status]
  why: "Both run the one drift command, scan for a single harness and status as a sweep of all of them; a pointer between them would add a hop to a one-line command."
  reviewed: "2026-10-30"
pin-preserving-fetch:
  skills: [harness-scan, harness-status]
  why: "Both run the fetching drift command themselves, so each must state that a fetch never moves pins and that --no-fetch skips the network."
  reviewed: "2026-10-30"
glossary-entry-template:
  skills: [domain-modeling, teach]
  why: "Each keeps a glossary of its own (project language, the learner's workspace) in one entry format, with its own admission rules."
  reviewed: "2026-10-30"
canonical-term-and-aliases:
  skills: [domain-modeling, teach]
  why: "Each keeps a glossary of its own (project language, the learner's workspace) in one entry format, with its own admission rules."
  reviewed: "2026-10-30"
tight-concept-definitions:
  skills: [domain-modeling, teach]
  why: "Each keeps a glossary of its own (project language, the learner's workspace) in one entry format, with its own admission rules."
  reviewed: "2026-10-30"
independent-synthesis:
  skills: [model-council, perspective-council]
  why: "Two entrypoints with distinct triggers (named models with a judge, opposing lenses) each run a full council ending in a fresh synthesizer."
  reviewed: "2026-10-30"
member-isolation:
  skills: [model-council, perspective-council]
  why: "Each council dispatches its own members in isolation."
  reviewed: "2026-10-30"
neutral-framing:
  skills: [model-council, perspective-council]
  why: "Each council frames its own neutral brief."
  reviewed: "2026-10-30"
no-silent-substitution:
  skills: [model-council, perspective-council]
  why: "Either council can lose a member, and each must report the gap rather than fill it."
  reviewed: "2026-10-30"
material-risk-review:
  skills: [brainstorming, harness-evaluate]
  why: "Each gates acceptance of its own output, a spec or a template adoption, on an independent critic; the critic itself belongs to review."
  reviewed: "2026-10-30"
no-stale-code-snippets:
  skills: [brainstorming, planning]
  why: "Each owns a different durable artifact, a spec or a plan, and its own template must keep code out."
  reviewed: "2026-10-30"
question-batching:
  skills: [brainstorming, grilling]
  why: "Brainstorming asks the owner questions inside its own exploration; grilling's rules live inside its interview loop, so pointing there would pull brainstorming into that loop."
  reviewed: "2026-10-30"
recommended-answer:
  skills: [brainstorming, grilling]
  why: "As question-batching: a short rule each skill applies inside its own flow."
  reviewed: "2026-10-30"
self-serve-facts:
  skills: [brainstorming, grilling]
  why: "As question-batching: a short rule each skill applies inside its own flow."
  reviewed: "2026-10-30"
settled-stop:
  skills: [brainstorming, grilling]
  why: "As question-batching: each skill stops its own questioning when its decisions are settled."
  reviewed: "2026-10-30"
finding-adjudication:
  skills: [implement, review]
  why: "Implement rules on findings inside its delivery loop and review owns the method; owner 2026-10-30: implement (then named execution) stays unchanged."
  reviewed: "2026-10-30"
domain-vocabulary:
  skills: [brief-me, improve-codebase-architecture, prototype, teach]
  why: "Each writes for its reader in the project's own terms: brief-me in its re-pitches, teach in its lessons, prototype in its states, actions and labels, so an answer transfers to the real code, and improve-codebase-architecture in its candidates and their friction."
  reviewed: "2026-11-04"
baseline:
  skills: [performance-optimization, systematic-debugging]
  why: "Each measures before a fix: performance-optimization for a resource target, systematic-debugging when the failure diagnosed is a performance regression, which it hands to the fixer."
  reviewed: "2026-11-04"
sequential-record-numbering:
  skills: [domain-modeling, teach]
  why: "Each keeps its own record folder (ADRs, learning records) in one minimal format."
  reviewed: "2026-10-30"
optional-record-sections:
  skills: [domain-modeling, teach]
  why: "Each keeps its own record folder (ADRs, learning records) in one minimal format."
  reviewed: "2026-10-30"
preserve-reproducers:
  skills: [doc:.claude/skills/mvp-mode/playbooks/bug-fix.md, systematic-debugging]
  why: "Each cleans up after its own work: the diagnosis when called alone, the bug-fix playbook at its closeout on every exit. Both keep reproducers, so neither cleanup deletes the evidence the other relies on."
  reviewed: "2026-10-31"
revert-ineffective-experiments:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/bug-fix.md, performance-optimization]
  why: "Each runs its own loop of attempts, fix attempts in the bug-fix playbook and optimization experiments in performance-optimization, and removes its own failed edits before the next attempt."
  reviewed: "2026-10-31"
attempt-log:
  skills: [doc:.claude/skills/mvp-mode/playbooks/bug-fix.md, implement]
  why: "Each fixes a failure on its own path, the bug-fix playbook for a bug-fix request and implement inside a task it is running, often delegated, where it cannot start the playbook (R8); both log each fix attempt so a stop hands back usable evidence."
  reviewed: "2026-10-31"
two-failure-stop:
  skills: [doc:.claude/skills/mvp-mode/playbooks/bug-fix.md, implement]
  why: "Each fixes a failure on its own path, the bug-fix playbook for a bug-fix request and implement inside a task it is running, often delegated, where it cannot start the playbook (R8); both stop after two failed fixes and return the attempt log, the playbook to the user and implement to the task owner."
  reviewed: "2026-10-31"
single-source-of-truth:
  skills: [authoring-for-agents, principle-subtract-before-you-add]
  why: "Each applies one-owner-per-meaning to its own material: authoring-for-agents to agent instructions (search for an existing owner before adding one), the principle to code and data before an addition; neither unit loads the other on its path."
  reviewed: "2026-11-01"
no-onward-delegation:
  skills: [delegation, doc:AGENTS.md, mvp-mode]
  why: "AGENTS.md holds it as policy every agent loads, so a delegate stops fanning out even when its brief was written by hand; the delegation skill writes it into each role block of the briefs it produces, so a delegate on a vendor or project without our AGENTS.md still receives it; the mvp-mode router states it beside its delegate-independent-by-default rule for plugin users who skip the optional AGENTS.md, so a router that tells them to delegate also tells their delegates not to fan out."
  reviewed: "2026-11-01"
implement-against-sketch:
  skills: [doc:.claude/skills/mvp-mode/playbooks/bug-fix.md, doc:.claude/skills/mvp-mode/playbooks/feature.md, doc:.claude/skills/mvp-mode/playbooks/perf-issue.md, doc:.claude/skills/mvp-mode/playbooks/refactoring.md]
  why: "Owner ruling 5 keeps the sketch design-only, so each playbook's own build step writes the code and holds this rule; a skill for it would bring back the implement branch the ruling removed (unit-kinds deviation log, St4)."
  reviewed: "2026-11-02"
build-closeout:
  skills: [doc:.claude/skills/mvp-mode/playbooks/feature.md, doc:.claude/skills/mvp-mode/playbooks/perf-issue.md, doc:.claude/skills/mvp-mode/playbooks/refactoring.md]
  why: "Each playbook's closeout runs on its own exits and feeds its own reply, and these three have the same three duties; a skill of three duties would be ceremony (unit-kinds deviation log, St4 and B4)."
  reviewed: "2026-11-02"
read-only-closeout:
  skills: ["doc:.claude/skills/mvp-mode/playbooks/investigation.md", "doc:.claude/skills/mvp-mode/playbooks/session-pickup.md"]
  why: "Each is a read-only run whose closeout belongs to its own exits and reply; logged under St4 in unit-kinds."
  reviewed: "2026-11-02"
own-output-location:
  skills: [interrogate, model-council]
  why: "Council members and adversaries each run independently on shared work, so each needs its own place to write; one is a branch of a council and the other a review, and neither calls the other."
  reviewed: "2026-11-03"
dropout-proceeds-noted:
  skills: [interrogate, model-council]
  why: "A failed member and a failed adversary are handled alike, going on and reporting it, but what is left when too few remain differs: no pick for one, not run for the other."
  reviewed: "2026-11-03"
limit-bounded-hold:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/hillclimb.md]
  why: "Each long loop stops starting at its own limit with an idea left; the rule is one short sentence, and a skill for it would be ceremony."
  reviewed: "2026-11-04"
read-trail-first:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/hillclimb.md]
  why: "Each looping playbook reads its own trail before choosing the next change; each trail has its own columns and rows."
  reviewed: "2026-11-04"
row-then-checkpoint:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/hillclimb.md]
  why: "Each loop writes its own row and checkpoint in this order, around its own keep-or-discard step, so a closing return can trust them."
  reviewed: "2026-11-04"
run-limits-first:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/hillclimb.md]
  why: "Each long loop fixes its own limits before its first change, from the same stated defaults, and gives them to `wake`."
  reviewed: "2026-11-04"
stated-unattended-gate:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/bug-fix.md, doc:.claude/skills/mvp-mode/playbooks/hillclimb.md]
  why: "The same one sentence tells each of these playbooks whether a run is away; each then takes its own branch or exit."
  reviewed: "2026-11-04"
worktree-environment-proof:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/hillclimb.md]
  why: "Each stated unattended loop proves its own command responds in its own worktree before starting; the check runs at each one's setup."
  reviewed: "2026-11-04"
bounded-background-wait:
  skills: [doc:.claude/skills/mvp-mode/playbooks/autonomous-run.md, doc:.claude/skills/mvp-mode/playbooks/bug-fix.md, doc:.claude/skills/mvp-mode/playbooks/hillclimb.md]
  why: "The same one sentence on waiting sits at each step that waits, with its own stopped exit; no skill is called for it."
  reviewed: "2026-11-04"
